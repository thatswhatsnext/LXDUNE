<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Framework Explorer — local preview</title>
<style>
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:#EEF0F2;color:#1a2027;}
  .bar{position:sticky;top:0;z-index:10;display:flex;gap:14px;align-items:center;flex-wrap:wrap;
       padding:10px 16px;background:#fff;border-bottom:1px solid #d7dde2;box-shadow:0 1px 4px rgba(0,0,0,.05);}
  .bar label{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;}
  .bar select,.bar button{font:inherit;font-size:13px;padding:6px 10px;border:1px solid #c6ced4;border-radius:8px;background:#fff;cursor:pointer;}
  .bar button.on{background:#1c4c5b;color:#fff;border-color:#1c4c5b;}
  .stamp{margin-left:auto;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:#68727b;}
  .frame{margin:0 auto;transition:max-width .15s;background:#EEF0F2;}
  .frame.mobile{max-width:390px;} .frame.tablet{max-width:800px;} .frame.desktop{max-width:1200px;} .frame.full{max-width:none;}
  .stage{padding:24px 18px 60px;}
</style>
</head>
<body>
  <div class="bar">
    <label>Framework
      <select id="fw">
        <option value="hits-nsw-science">HITS in NSW Science (deep-dive)</option>
        <option value="metacognition-nsw-science">Metacognition in Science (matrix)</option>
      </select>
    </label>
    <label>Width
      <span id="widths">
        <button data-w="mobile">mobile</button>
        <button data-w="tablet">tablet</button>
        <button data-w="desktop" class="on">desktop</button>
        <button data-w="full">full</button>
      </span>
    </label>
    <span class="stamp" id="stamp">—</span>
  </div>
  <div class="frame desktop" id="frame">
    <div class="stage"><div id="lxd-framework-explorer"></div></div>
  </div>

<script type="module">
  import { renderFrameworkExplorer } from "../moodle-blocks/framework-explorer.js";

  const fwSel = document.getElementById('fw');
  const mount = document.getElementById('lxd-framework-explorer');
  const stamp = document.getElementById('stamp');
  const frame = document.getElementById('frame');

  async function render() {
    mount.textContent = 'Loading…';
    await renderFrameworkExplorer({ framework: fwSel.value, mount });
    const d = mount.dataset;
    stamp.textContent = d.fxFramework
      ? `${d.fxFramework} · v${d.fxVersion} · ${d.fxContentHash}`
      : '(no stamp — check console)';
  }

  fwSel.addEventListener('change', render);
  document.getElementById('widths').addEventListener('click', (e) => {
    const w = e.target.dataset.w;
    if (!w) return;
    frame.className = 'frame ' + w;
    document.querySelectorAll('#widths button').forEach((b) => b.classList.toggle('on', b.dataset.w === w));
  });

  render();
</script>
</body>
</html>
