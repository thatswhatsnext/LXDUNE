function scene(s){return s.scene?'<div class="mcg-scene"><div class="ctx">'+s.scene.ctx+'</div>'+s.scene.t+'</div>':'';}

function rIntro(scr){
  var u=run.unit, hb=H[u.id], i=idx(u.id), labels=["Not yet","A little","Somewhat","Fairly","Very"];
  var h='<div class="mcg-card">'+eyebrow(C.PHASES[hb.phase].name+" · Habit "+(i+1)+" of "+U.length)+
    '<h1 class="mcg-q" style="font-size:27px" tabindex="-1" data-focus>'+hb.name+'</h1>'+
    '<p class="mcg-sub lead">'+u.intro+'</p>'+
    '<div class="mcg-note" id="calq"><b>Before you start.</b> How confident are you that you could use this habit, on purpose, in a lesson tomorrow?</div>'+
    '<div class="mcg-scale" role="group" aria-labelledby="calq">';
  for(var n=1;n<=5;n++)h+='<button class="mcg-lv" data-lv="'+n+'" aria-pressed="false"><span class="lvn">'+n+'</span><span class="lvl">'+labels[n-1]+'</span></button>';
  h+='</div><div class="mcg-scalelabels" aria-hidden="true"><span>Not confident</span><span>Very confident</span></div>'+
    '<div class="mcg-btnrow"><button class="mcg-btn ghost" data-act="exit">Back</button><button class="mcg-btn primary" data-act="begin" disabled>Choose a number to begin</button></div></div>';
  scr.innerHTML=h;
}
function rReviewIntro(scr){
  var n=run.scorable, names=run.units.map(function(id){return H[id].name;});
  var h='<div class="mcg-card">'+eyebrow("Mixed review · "+n+" questions")+
    '<h1 class="mcg-q" style="font-size:27px" tabindex="-1" data-focus>Mixed review</h1>'+
    '<p class="mcg-sub lead">Questions from different habits, shuffled together. Mixing them makes you decide which habit each question is about — which is what you have to do in a real lesson.</p>'+
    '<p class="mcg-sub">Drawing on: <b>'+names.join(", ")+'</b>.</p>'+
    '<div class="mcg-note" id="calq"><b>Predict first.</b> How many of the '+n+' do you think you’ll get right first time?</div>'+
    '<div class="mcg-scale" role="group" aria-labelledby="calq">';
  for(var k=0;k<=n;k++)h+='<button class="mcg-lv" data-lv="'+k+'" aria-pressed="false" style="padding:12px 2px"><span class="lvn">'+k+'</span></button>';
  h+='</div><div class="mcg-btnrow"><button class="mcg-btn ghost" data-act="exit">Back</button><button class="mcg-btn primary" data-act="begin" disabled>Choose a number to begin</button></div></div>';
  scr.innerHTML=h;
}
function rChoice(scr,s){
  var h='<div class="mcg-card">'+eyebrow(s.eyebrow)+'<h2 class="mcg-q" tabindex="-1" data-focus>'+s.q+'</h2>'+(s.sub?'<p class="mcg-sub">'+s.sub+'</p>':'')+scene(s)+'<div class="mcg-opts">';
  s.opts.forEach(function(o,j){h+='<button class="mcg-opt" data-opt="'+j+'"><span class="key" aria-hidden="true">'+String.fromCharCode(65+j)+'</span><span class="optbody">'+o.t+'</span></button>';});
  h+='</div><div class="mcg-fb" id="fb" role="status"></div><div class="mcg-btnrow" id="btnrow"></div></div>';
  scr.innerHTML=h;
}
function rTF(scr,s){
  scr.innerHTML='<div class="mcg-card">'+eyebrow(s.eyebrow)+'<h2 class="mcg-q" tabindex="-1" data-focus>'+s.q+'</h2>'+scene(s)+
    '<div class="mcg-tf"><button class="mcg-opt" data-tf="true"><span class="optbody">Yes, it is</span></button><button class="mcg-opt" data-tf="false"><span class="optbody">No, it isn’t</span></button></div>'+
    '<div class="mcg-fb" id="fb" role="status"></div><div class="mcg-btnrow" id="btnrow"></div></div>';
}
function rApply(scr,s){
  var h='<div class="mcg-card">'+eyebrow(s.eyebrow)+'<h2 class="mcg-q" tabindex="-1" data-focus>'+s.q+'</h2><p class="mcg-sub">'+s.sub+'</p>'+
    '<label class="mcg-sr" for="apta">Your draft</label><textarea class="mcg-ta" id="apta" placeholder="'+attr(s.placeholder)+'">'+attr(run.apply)+'</textarea>'+
    '<p class="mcg-hint">Nothing here is marked — it’s yours to keep. It’s saved with your progress.</p>'+
    '<div class="mcg-checklabel">Check your own draft</div>';
  s.criteria.forEach(function(c,j){var on=run.checks[j];h+='<button class="mcg-check" data-check="'+j+'" role="checkbox" aria-checked="'+on+'"><span class="box" aria-hidden="true">'+(on?"✓":"")+'</span><span class="txt">'+c+'</span></button>';});
  h+='<div class="mcg-note">Checking your own draft against criteria is itself a metacognitive habit — <b>Evaluate progress</b>.</div>'+
    '<div class="mcg-btnrow"><button class="mcg-btn primary" data-act="applynext">Continue</button></div></div>';
  scr.innerHTML=h;
}
function rCommit(scr,s){
  scr.innerHTML='<div class="mcg-card">'+eyebrow(s.eyebrow)+'<h2 class="mcg-q" tabindex="-1" data-focus>'+s.q+'</h2><p class="mcg-sub">'+s.sub+'</p>'+
    '<label class="mcg-sr" for="cmta">Your commitment</label><textarea class="mcg-ta" id="cmta" placeholder="'+attr(s.placeholder)+'">'+attr(run.commit)+'</textarea>'+
    '<div class="mcg-note"><b>For afterwards.</b> '+s.reflect+'</div>'+
    '<div class="mcg-btnrow"><button class="mcg-btn primary" data-act="commitnext">Finish</button></div></div>';
}
function calibration(predLabel,predVal,predPct,perfLabel,perfVal,perfPct,reflect){
  return '<div class="mcg-panel"><h3>Confidence, checked against performance</h3>'+
    '<div class="mcg-cb pre"><span class="cbl">You predicted</span><span class="cbtrack"><span class="cbfill" style="width:'+predPct+'%"></span></span><span class="cbv">'+predVal+'</span></div>'+
    '<div class="mcg-cb perf"><span class="cbl">You performed</span><span class="cbtrack"><span class="cbfill" style="width:'+perfPct+'%"></span></span><span class="cbv">'+perfVal+'</span></div>'+
    '<div class="mcg-reflect">'+reflect+'</div></div>';
}
function gapReflect(pred,perf,unit){
  if(perf>pred)return "You came in at "+pred+" and performed at "+perf+". Your skill is ahead of your confidence — notice that. You can do more than you think.";
  if(perf<pred)return "You came in at "+pred+" and performed at "+perf+". A little humbling — and noticing that gap is itself a metacognitive move. That awareness is the point.";
  return "You came in at "+pred+" and performed at "+perf+" — well calibrated. Your sense of your own skill matched reality, which is exactly what you’re building in your students.";
}
var CROWN='<svg viewBox="0 0 24 24" fill="none" stroke="#7A6B1F" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l4 4 5-7 5 7 4-4-2 12H5z"/></svg>';

function rComplete(scr){
  var u=run.unit, hb=H[u.id], i=idx(u.id);
  var perfPct=run.scorable?Math.round(run.correct/run.scorable*100):0, perfLv=Math.max(1,Math.round(perfPct/20));
  var nextU=U[i+1];
  var h='<div class="mcg-done"><div class="mcg-crown">'+CROWN+'</div>'+
    '<h1 tabindex="-1" data-focus>Habit complete</h1>'+
    '<p class="tagline">You’ve worked <b>'+hb.name+'</b> through definition, recall, judgement and practice.</p>'+
    '<div class="mcg-stats"><div class="mcg-stat"><div class="sv">'+run.xp+'</div><div class="sl">XP earned</div></div>'+
    '<div class="mcg-stat"><div class="sv">'+run.correct+'/'+run.scorable+'</div><div class="sl">First-time right</div></div>'+
    '<div class="mcg-stat"><div class="sv">'+streakNow()+'</div><div class="sl">Day streak</div></div></div>'+
    calibration("",run.conf+"/5",run.conf*20,"",perfLv+"/5",perfPct,gapReflect(run.conf+"/5",perfLv+"/5"));
  if(run.commit.trim()){h+='<div class="mcg-panel"><h3>Your commitment</h3><div class="mcg-quote">'+attr(run.commit)+'</div><p style="margin-top:10px">Saved on your path. Next review of this habit: <b>'+whenText(store.done[u.id].due)+'</b>.</p></div>';}
  else{h+='<div class="mcg-panel"><p>Next review of this habit: <b>'+whenText(store.done[u.id].due)+'</b>. Spacing the reviews out is what makes the habit stick.</p></div>';}
  h+='<div class="mcg-ref"><div class="rh">Go deeper</div><p>See <b>'+hb.name+'</b> across every stage and topic in the '+(EXPLORER_URL?'<a href="'+EXPLORER_URL+'" target="_blank" rel="noopener">Metacognition in Science Explorer</a>':'<b>Metacognition in Science Explorer</b> on your unit’s Teaching frameworks page')+' — the reference layer behind this game.</p></div>'+
    '<div class="mcg-btnrow"><button class="mcg-btn ghost" data-act="exit">Back to the path</button>'+
    (nextU?'<button class="mcg-btn primary" data-act="unit" data-id="'+nextU.id+'">Next: '+H[nextU.id].name+'</button>':'<button class="mcg-btn primary" data-act="exit">See your path</button>')+'</div></div>';
  scr.innerHTML=h;
}
function rReviewComplete(scr){
  var n=run.scorable, perfPct=n?Math.round(run.correct/n*100):0;
  var lines=run.units.filter(isDone).map(function(id){return '<li><b>'+H[id].name+'</b> — next review '+whenText(store.done[id].due)+'</li>';}).join("");
  var h='<div class="mcg-done"><div class="mcg-crown">'+CROWN+'</div>'+
    '<h1 tabindex="-1" data-focus>Review complete</h1>'+
    '<p class="tagline">Mixing the habits together is harder than practising them one at a time. That’s what makes it stick.</p>'+
    '<div class="mcg-stats"><div class="mcg-stat"><div class="sv">'+run.xp+'</div><div class="sl">XP earned</div></div>'+
    '<div class="mcg-stat"><div class="sv">'+run.correct+'/'+n+'</div><div class="sl">First-time right</div></div>'+
    '<div class="mcg-stat"><div class="sv">'+streakNow()+'</div><div class="sl">Day streak</div></div></div>'+
    calibration("",run.conf+"/"+n,n?run.conf/n*100:0,"",run.correct+"/"+n,perfPct,gapReflect(run.conf+"/"+n,run.correct+"/"+n))+
    (lines?'<div class="mcg-panel" style="text-align:left"><h3>Spaced reviews</h3><ul style="margin:0;padding-left:18px;font-size:14px;color:var(--ink)">'+lines+'</ul></div>':'')+
    '<div class="mcg-btnrow"><button class="mcg-btn ghost" data-act="exit">Back to the path</button><button class="mcg-btn primary" data-act="review">Another round</button></div></div>';
  scr.innerHTML=h;
}

/* ---------------- finishing (persist) ---------------- */
function finishUnit(){
  var u=run.unit, t=today(), d=store.done[u.id], pct=run.scorable?Math.round(run.correct/run.scorable*100):0;
  if(!d){store.done[u.id]={first:t,last:t,reviews:0,due:addDays(t,INTERVALS[0]),best:pct,conf:run.conf};}
  else{d.reviews=(d.reviews||0)+1;d.last=t;d.due=addDays(t,INTERVALS[Math.min(d.reviews,INTERVALS.length-1)]);d.best=Math.max(d.best||0,pct);}
  store.notes[u.id]={apply:run.apply,commit:run.commit,at:t};
  store.xp+=run.xp; bumpStreak(); save();
}
function finishReview(){
  var t=today();
  run.units.forEach(function(id){var d=store.done[id]; if(!d)return; d.reviews=(d.reviews||0)+1; d.last=t; d.due=addDays(t,INTERVALS[Math.min(d.reviews,INTERVALS.length-1)]);});
  store.xp+=run.xp; bumpStreak(); save();
}

/* ---------------- answering ---------------- */
function award(first){var pts=first?10:5;run.xp+=pts;var x=document.getElementById("xp");if(x)x.innerHTML=star()+run.xp+" XP";}
function credit(first){if(!run.counted[run.i]){run.counted[run.i]=true;if(first)run.correct++;award(first);}}
function feedback(kind,title,body,coach){
  var fb=document.getElementById("fb");
  fb.className="mcg-fb "+kind;
  fb.innerHTML='<div class="fbh">'+title+'</div><p>'+body+'</p>'+(coach?'<div class="coach">Coach: '+coach+'</div>':'');
}
function lockAll(){root.querySelectorAll(".mcg-opt").forEach(function(x){x.disabled=true;});}
function showContinue(){var b=document.getElementById("btnrow");b.innerHTML='<button class="mcg-btn primary" data-act="next">Continue</button>';b.querySelector("button").focus({preventScroll:true});}

function choose(s,j,el){
  var o=s.opts[j]; run.attempts++;
  if(o.correct){
    run.answered=true; lockAll(); el.classList.add("correct"); credit(run.attempts===1);
    feedback("good","✓ That’s the one.",s.good,s.coach); showContinue(); announce("Correct. "+el.textContent);
  } else if(o.partial){
    el.classList.add("partial","dim"); el.disabled=true;
    feedback("part","◐ So close.",s.part||o.fb,""); announce("Close, not quite. Try again.");
  } else {
    el.classList.add("wrong","dim"); el.disabled=true;
    feedback("bad","Not quite — try again.",o.fb,""); announce("Not quite. Try again.");
  }
}
function chooseTF(s,val,el){
  run.attempts++;
  if(val===s.answer){
    run.answered=true; lockAll(); el.classList.add("correct"); credit(run.attempts===1);
    feedback("good","✓ "+(s.answer?"Yes, it is.":"Right — it isn’t."),s.good,s.coach); showContinue(); announce("Correct.");
  } else {
    el.classList.add("wrong","dim"); el.disabled=true;
    feedback("bad","Have another look.",s.bad,""); announce("Not quite. Try again.");
  }
}

/* ---------------- events ---------------- */
var resetArmed=false;
root.addEventListener("click",function(e){
  var t=e.target.closest("[data-act],[data-opt],[data-tf],[data-lv],[data-check]"); if(!t)return;
  var act=t.getAttribute("data-act");
  if(act!=="reset")resetArmed=false;
  if(act==="unit"){startUnit(t.getAttribute("data-id"));return;}
  if(act==="review"){startReview();return;}
  if(act==="exit"){showPath();return;}
  if(act==="begin"){if(t.disabled)return;next();return;}
  if(act==="next"){next();return;}
  if(act==="applynext"){run.apply=document.getElementById("apta").value;next();return;}
  if(act==="commitnext"){run.commit=document.getElementById("cmta").value;finishUnit();next();return;}
  if(act==="reviewer"){store.reviewer=!store.reviewer;save();showPath(store.reviewer?"Reviewer mode on — every habit is unlocked.":"Reviewer mode off.");return;}
  if(act==="reset"){
    if(!resetArmed){resetArmed=true;t.classList.add("arm");t.textContent="Tap again to erase all progress";return;}
    resetArmed=false; store=blank(); save(); showPath("Progress reset.");return;
  }
  var lv=t.getAttribute("data-lv");
  if(lv!==null){run.conf=+lv;root.querySelectorAll(".mcg-lv").forEach(function(x){x.setAttribute("aria-pressed",x===t?"true":"false");});
    var b=root.querySelector('[data-act="begin"]');b.disabled=false;b.textContent="Start";return;}
  var ci=t.getAttribute("data-check");
  if(ci!==null){ci=+ci;run.checks[ci]=!run.checks[ci];t.setAttribute("aria-checked",run.checks[ci]);t.querySelector(".box").textContent=run.checks[ci]?"✓":"";return;}
  if(!run||run.answered)return;
  var s=run.steps[run.i];
  var oi=t.getAttribute("data-opt"); if(oi!==null){choose(s,+oi,t);return;}
  var tf=t.getAttribute("data-tf"); if(tf!==null){chooseTF(s,tf==="true",t);return;}
});
/* commit step finishes the unit before the completion screen renders;
   review completes when the last question's Continue is pressed */
var _next=next;
next=function(){
  if(run&&run.kind==="review"&&run.steps[run.i+1]&&run.steps[run.i+1].type==="reviewcomplete")finishReview();
  _next();
};

showPath();
})();
</script>
