<!-- Plate 1: The Willow Problem. Used as the Field Guide home hero (app.html) and as the lesson plate
     for 5e-1-willow in the game. Paste inline; colours come from the --plate-* tokens in the handoff,
     so the drawing follows light and dark themes. Keep the CO2 answer out of the drawing: the lesson
     asks students to predict it. -->
