# SWH path, lesson 3. Built on the SWH guide's worked sequence swh-seq-s5-duckweed (lesson 6). Draft for Steve's review.
schemaVersion: 1
id: swh-3-negotiate
path: swh
order: 3
title: Not the answer key
summary: Peers first, then the reading on run-off. How a text becomes another voice in the argument, and why the beginning ideas have to come back.
level: explain
version: 1.0.0
status: draft
lastReviewed: 2026-10-08
provenance:
