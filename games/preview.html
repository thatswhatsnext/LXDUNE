<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metacognition Coach — local preview</title>
<link rel="icon" href="data:,">
<!--
  Local preview for the Metacognition Coach, loaded through the same one-line
  loader a Moodle page uses. From the repo root: python3 -m http.server 8000,
  then open http://localhost:8000/games/preview.html. Query options:
    ?moodle=1     imitate Boost: a fixed navbar, #page as the scroller and a
                  .no-overflow wrapper round the content (where CSS sticky fails)
    ?combined=1   put HITS (deep-dive) and the metacognition matrix on the page too
    ?reviewer=1   allowReviewer: true (the staff-page toggle)
    ?explorer=URL explorerUrl, to turn "Go deeper" into a link
-->
<style>
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:#EEF0F2;color:#1a2027;}
  .navbar{display:none;}
  .stage{max-width:1100px;margin:0 auto;padding:24px 18px 60px;}
  .stage > h1{font-size:26px;margin:0 0 18px;}
  .stage > section{margin:0 0 40px;}
  body.moodle .navbar{display:flex;align-items:center;position:fixed;top:0;left:0;right:0;height:60px;z-index:1030;
    background:#fff;border-bottom:1px solid #d7dde2;padding:0 18px;font-weight:600;}
  body.moodle #page{position:fixed;top:60px;left:0;right:0;bottom:0;overflow-y:auto;}
  body.moodle .no-overflow{overflow:auto;}
</style>
</head>
<body>
  <nav class="navbar">myLearn (imitation Boost navbar)</nav>
  <div id="page">
    <div class="stage">
      <h1>Teaching frameworks</h1>
      <div class="no-overflow">
        <section id="before"></section>
        <section><div id="lxd-coach"></div></section>
        <section id="after"></section>
      </div>
    </div>
  </div>
<script type="module">
  import { renderCoach } from "../moodle-blocks/metacognition-coach.js";
  const q = new URLSearchParams(location.search);
  if (q.get('moodle') === '1') document.body.classList.add('moodle');
  if (q.get('combined') === '1') {
    const { renderFrameworkExplorer } = await import("../moodle-blocks/framework-explorer.js");
    document.getElementById('before').innerHTML = '<div id="lxd-hits"></div>';
    document.getElementById('after').innerHTML = '<div id="lxd-matrix"></div>';
    await renderFrameworkExplorer({ framework: 'hits-nsw-science', mount: 'lxd-hits' });
    await renderFrameworkExplorer({ framework: 'metacognition-nsw-science', mount: 'lxd-matrix' });
  }
  renderCoach({ mount: 'lxd-coach', allowReviewer: q.get('reviewer') === '1', explorerUrl: q.get('explorer') || '' });
</script>
</body>
</html>
