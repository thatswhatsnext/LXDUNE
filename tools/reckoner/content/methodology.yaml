# How the reckoner works: methodology notes shown on the "How it works" page (F1) and, later, the glossary (F7).
# Drafted in Claude chat. Stays status: draft, source: ai-generated, reviewedBy: [] until Steve signs off.
# Counts (models, guides) are deliberately left out: the page computes them from the manifest, so this file never goes stale.
schemaVersion: '1.0'
