# SWH path, lesson 2. Built on the SWH guide's worked sequence swh-seq-s5-bottles. Draft for Steve's review.
schemaVersion: 1
id: swh-2-bottles
path: swh
order: 2
title: A claim worth arguing
summary: Four bottles, one question with no single answer. Claims someone could disagree with, evidence that says why, and where the teacher's time goes.
level: explain
version: 1.0.0
status: draft
lastReviewed: 2026-10-07
