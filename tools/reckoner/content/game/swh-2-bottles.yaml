guideSection: sequences
items:
  - id: predict
    type: predict
    at: beginning-ideas
    processing: Retrieval
    kind: Predict
    title: "Year 10 groups test four reusable bottles: stainless steel, aluminium, glass and a copolyester plastic. They measure cooling with hot water, mass, and what a contained drop does."
    q: Two groups end up with opposite claims about the best bottle. Their data don't conflict. How?
    options:
      - text: One group must have measured something wrong
      - text: They weighted different properties, because they asked different questions
      - text: The claims are too vague to compare
      - text: It can't happen. Good data lead to one answer
    answer: 1
    reveal: >-
      A group that asked about keeping drinks cold argues for steel. A group that asked about a light, cheap bottle
      for a school bag argues for the plastic. Both are right about their own data. The best material depends on
      the purpose, and that's the disagreement lesson 6 is built on.
    why: >-
      “There is one best material, whatever it's for” is this sequence's first target conception. SWH needs a
      claim that's genuinely arguable, and this question makes one.

  - id: claim
    type: choice
    at: claims
    processing: Analysis
    kind: Judge the claim
    tests: claims
    title: Four students' claims, each answering their own question. Which could another student most usefully disagree with?
    options:
      - text: "Steel is the best material."
        fb: Arguable, but best for what? Without a purpose or a property it can't be tested against anyone's data.
      - text: "We tested four bottles and got results."
        fb: That's a report of what happened. No one could disagree with it.
      - text: "For keeping a drink cold through a school day, steel beat the other three, because it lost the least heat in our cooling tests."
        fb: Yes. It's tied to a purpose and a property, so another group can challenge it with their own data or a different purpose.
      - text: "Glass bottles are made of glass."
        fb: True by definition. There's nothing to argue.
    answer: 2
    refs:
      lookForIds: [swh-claim-arguable]

  - id: lf-individual
    type: lookfor
    at: claims
    processing: Comprehension
    kind: Match the look-for
    tests: lookfor
    vignette:
      who: Year 10 · Lesson 5
      text: >-
        Groups ran the tests together, but the teacher asks every student to write their own claim in their own
        book, without conferring. Two members of the same group write different claims: one argues for steel, the
        other for the plastic.
    answer: swh-claim-individual
    distractors: [swh-claim-arguable, swh-begin-own-question, swh-reading-peers-first]
    strong: true
    hint: Who wrote it?
    why: >-
      Shared data, individual claims. The two different claims from one group are the guide's sign that each
      student is reasoning, not copying the group's conclusion.

  - id: evidence
    type: choice
    at: evidence
    processing: Analysis
    kind: Judge the evidence
    tests: evidence
    title: A student claims steel is best for keeping drinks cold. Which Evidence section does the job?
    options:
      - text: Every cooling time, mass and drop result, copied from the results table
        fb: That's the observations again. It never says why any of it supports steel.
      - text: The cooling curves, where steel held temperature longest, with mass set aside because forty grams won't matter in a bag, and one fast steel trial explained by a loose lid she checked afterwards
        fb: Yes. Data chosen for the claim, a reason for leaving some out, and the odd trial named and explained. That's what the guide's Evidence question asks for.
      - text: "Steel is a metal, and the textbook says metals are strong."
        fb: The student's own data have disappeared, and strength isn't what the claim is about.
      - text: "Our group agreed steel was best."
        fb: Agreement isn't evidence, and the claim should be the student's own.
    answer: 1
    refs:
      exampleIds: [swh-evidence-pos-bottle-steel]
      lookForIds: [swh-evidence-justifies, swh-evidence-selected, swh-evidence-anomalies]

  - id: dx-recopied
    type: diagnose
    at: evidence
    processing: Analysis
    kind: Diagnose the plan
    tests: misapplication
    vignette:
      who: A pre-service teacher's SWH · Lesson 5
      text: >-
        The Evidence page is ruled up as a table with the same headings as the results page. Students copy their
        numbers across neatly, including two odd trials, and hand their books in early.
    answer: mis-swh-evidence-recopied
    distractors: [mis-swh-no-negotiation, mis-swh-closed-practical, mis-swh-supplied-question]
    hint: What does the ruled-up page make easy, and what does it leave out?
    why: >-
      The page invites restating, so the reasoning step is skipped while the work looks complete. The guide's fix
      is to ask what about this data makes the claim follow, and to require some data to be set aside with a
      reason.
    refs:
      exampleIds: [swh-evidence-neg-bottle-recopied]

  - id: lf-anomaly
    type: lookfor
    at: evidence
    processing: Analysis
    kind: Match the look-for
    tests: lookfor
    vignette:
      who: Year 10 · Lesson 5
      text: >-
        Jordan argues for aluminium on mass. Under Evidence he notes that one aluminium bottle dented badly in the drop
        test, says the dent didn't break the seal, and that it matters less for his claim than for a group arguing
        about durability.
    answer: swh-evidence-anomalies
    distractors: [swh-evidence-selected, swh-obs-separate, swh-claim-arguable]
    strong: true
    hint: What did Jordan do with the result that didn't help him?
    why: >-
      The dent is named and dealt with rather than quietly dropped. That's the work the look-for exists for.

  - id: move
    type: choice
    at: evidence
    processing: Knowledge utilisation
    kind: Teacher move
    tests: evidence
    vignette:
      who: Lesson 5 · claims and evidence
      text: The class is writing quietly. You have 40 minutes, a pile of marking and a prac to set up for tomorrow.
    q: Where does your time go?
    options:
      - text: Set up tomorrow's prac while they write
        fb: It's tempting, and the guide names it. The Evidence phase is where students most need you.
      - text: Mark the observation pages from last lesson
        fb: Useful, but the observations are done. The reasoning is happening now.
      - text: Move from student to student asking, “Why does this data support what you wrote?”
        fb: Yes. The guide says this lesson is where the teacher's time goes, even though it looks least like teaching. The claim-to-data link is what SWH exists to build.
      - text: Check that every student has used every data set
        fb: Using all the data isn't the goal. Choosing what matters and saying why is.
    answer: 2
    refs:
      lookForIds: [swh-evidence-justifies]

  - id: spot-tests
    type: spot
    at: tests
    processing: Comprehension
    kind: Spot the phase
    tests: tests
    vignette:
      who: Year 10 · Lesson 2
      text: >-
        A group whose question was “Which bottle survives a school bag?” plans a contained drop test from bench height
        onto a mat, three drops each. The teacher asks how they'll keep any glass contained, and leaves the rest of the
        plan alone.
    q: Which SWH phase is this?
    answer: tests
    among: [beginning-ideas, tests, observations]
    fb:
      beginning-ideas: The question was written in lesson 1. Now the group is deciding how to answer it.
      tests: Yes. The method follows from their own question, and the teacher checks it for safety and feasibility without redesigning it.
      observations: Nothing has been dropped yet. This is the plan.
    refs:
      lookForIds: [swh-tests-follows-question]

  - id: dx-closed
    type: diagnose
    at: claims
    processing: Analysis
    kind: Diagnose the plan
    tests: misapplication
    vignette:
      who: Another pre-service teacher's SWH · Year 10
      text: >-
        Students measure the density of a steel bottle offcut by displacement and run it through the seven SWH
        questions. Every claim reads “The density of steel is about 7.9 g/cm³”, and the reading phase has nothing to
        do.
    answer: mis-swh-closed-practical
    distractors: [mis-swh-evidence-recopied, mis-swh-answer-key, mis-swh-supplied-question]
    why: >-
      A practical with one right answer leaves the claim, evidence and reading phases with no work. The guide's fix
      is a practical where the claim depends on judgement, like choosing a bottle for a purpose.
    refs:
      lookForIds: [swh-claim-arguable]

  - id: nest
    type: nest
    at: claims
    processing: Knowledge utilisation
    kind: Nest it
    tests: nesting
    model: swh
    host: 5e
    answer: explain
    q: Your Year 10 materials unit runs as a 5E. In which 5E phase does the SWH writing do its work?
    why: >-
      SWH sits inside a unit model. Its claims, evidence and negotiation are how students explain what they found,
      so it does its work in Explain.

  - id: reflect
    type: reflect
    at: evidence
    processing: Metacognition
    kind: Look back
    title: Two right answers.
    q: Why does SWH work better on the bottle question than on measuring a density?
    model: "Example: “The bottle question has more than one defensible answer, so students' claims can differ and they have to say why. With a density there's one answer, so Claims and Evidence turn into copying.”"
    recall: predict
