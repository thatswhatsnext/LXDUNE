# 5E path, lesson 1. The Round 1 prototype, played and released by Steve on 2026-10-02.
schemaVersion: 1
id: 5e-1-willow
path: 5e
order: 1
title: The Willow Problem
summary: Where does a tree's mass come from? Spot the 5E phases in a photosynthesis sequence, then fix a flawed plan.
level: recognise
version: 1.0.0
status: published
lastReviewed: 2026-10-02
provenance:
  source: ai-drafted-reviewed
  authors: [Claude]
  reviewedBy: [Steve Grant]
  reviewedOn: 2026-10-02
context:
  stages: [stage4]
  focusAreas: [Living systems]
  disciplines: [biology]
outcomes: [SC4-LIV-01]
builtOn:
  phaseIds: [engage, explore, explain, elaborate, evaluate]
  exampleIds: [evaluate-pos-tree]
