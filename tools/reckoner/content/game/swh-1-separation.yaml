# SWH path, lesson 1. Built on the SWH guide's worked sequence swh-seq-s4-separation. Draft for Steve's review.
schemaVersion: 1
id: swh-1-separation
path: swh
order: 1
title: Get it all back
summary: A murky mixture, a teacher who knows exactly what went in, and seven questions in place of a lab report. Learn what each SWH phase has to do.
level: recognise
