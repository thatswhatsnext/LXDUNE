# Levels of inquiry path, lesson 5. Design level: Question Conference, a branching simulation of lessons 7–10 of the Levels of inquiry guide's worked sequence seq-s4-reaction-time. Draft for Steve's review.
schemaVersion: 1
id: loi-5-question-conference
path: levels-of-inquiry
order: 5
title: Question Conference
summary: Run the open lessons with a simulated Year 7 class. Every move decides whether the question stays theirs, and whether their data get read for what they show.
level: design
version: 0.1.0
status: draft
lastReviewed: 2026-10-10
provenance:
  source: ai-generated
  authors: [Claude]
  reviewedBy: []
context:
  stages: [stage4]
  focusAreas: [Data science 1]
  disciplines: [integrated]
outcomes: [SC4-DA1-01]
builtOn:
  sequenceIds: [seq-s4-reaction-time]
  phaseIds: [open]
