# SWH path, lesson 5. Design level: Negotiation Day, a branching simulation of lessons 5–6 of the SWH guide's bottles sequence (swh-seq-s5-bottles). Draft for Steve's review.
schemaVersion: 1
id: swh-5-negotiation-day
path: swh
order: 5
title: Negotiation Day
summary: Run the claims, the evidence and the negotiation with a simulated Year 10 class. Every move decides whether claims meet each other before they meet the textbook.
level: design
version: 1.0.0
status: draft
lastReviewed: 2026-10-07
provenance:
  source: ai-generated
  authors: [Claude]
  reviewedBy: []
context:
  stages: [stage5]
  focusAreas: [Materials]
  disciplines: [chemistry]
outcomes: [SC5-MAT-01]
builtOn:
  sequenceIds: [swh-seq-s5-bottles]
  lookForIds: [swh-claim-arguable, swh-evidence-justifies, swh-reading-peers-first, swh-reading-not-answer-key, swh-reflect-has-original]
  misapplicationIds: [mis-swh-answer-key, mis-swh-evidence-recopied, mis-swh-lost-beginnings]
guideSection: sequences
items:
  - id: briefing
    type: concept
    at: claims
    processing: Retrieval
    kind: How Negotiation Day works
    title: Two lessons, five decisions
    lead: >-
      You're on placement with a Year 10 class, near the end of the SWH routine on bottles from the guide. Groups
      have run their tests. At five moments you choose what to do next. Students voice the ideas the guide says to
      expect, and your choices decide which ideas surface, which stay hidden and which get challenged.
    rows:
      - phaseId: claims
        does: "Lesson 5: each student writes a claim."
        move: "Ask what it's a claim about."
      - phaseId: evidence
        does: "Lesson 5: each student writes why their data support it."
        move: "Spend your time on the claim-to-data link."
      - phaseId: reading
        does: "Lesson 6: groups compare, then the figures arrive."
        move: "Peers first. The text is another voice."
      - phaseId: reflection
        does: "Lesson 6: beginning ideas handed back."
        move: "Ask about their thinking."

  - id: sim
    type: sim
    at: claims
    processing: Knowledge utilisation
    kind: Negotiation Day
    tests: sim
    cast:
      who: Year 10 · Materials
      text: 26 students in six groups. Each student wrote their own questions in lesson 1, so groups tested different properties.
    sequenceId: swh-seq-s5-bottles
    start: claim
    nodes:
      - id: claim
        phase: claims
        when: Lesson 5 · claims
        situation: >-
          Students are writing their claims alone. Tom's group ran cooling tests. His claim reads “Steel is the best
          material.”
        said:
          who: Tom
          text: “Steel's just the best. Everyone knows that.”
          conception: 0
        choices:
          - text: Ask, “Best for what? Which of your lesson 1 questions does this answer?”
            next: evidence
            good: true
            lookFor: swh-claim-arguable
            surface: [0]
            debrief: Tom finds his question was about cold drinks and rewrites the claim around keeping a drink cold. “Best for everything” is now on the page, narrowed, where another group can push back.
          - text: Suggest he write “Steel is best for keeping drinks cold” instead
            next: evidence-thin
            good: false
            lookFor: swh-claim-arguable
            hide: [0]
            debrief: The claim is better, but it's yours. Tom still thinks steel is simply the best, and he hasn't had to say what his claim is about.

      - id: evidence
        phase: evidence
        when: Lesson 5 · evidence
        situation: Tom starts the Evidence page by copying out his whole results table, cooling times and masses included.
        choices:
          - text: Sit with him and ask, “Which of these numbers makes your claim follow? Which could you leave out, and why?”
            next: pair
            good: true
            lookFor: swh-evidence-justifies
            debrief: Tom keeps the cooling curves, sets mass aside because it isn't what his claim is about, and notices one steel trial cooled fast. He checks and finds the lid was loose. That's the reasoning SWH exists to build.
          - text: Let him finish. It's complete, and you need to set up for tomorrow
            next: pair-flat
            good: false
            lookFor: swh-evidence-justifies
            debrief: The page looks finished, but it never says why the data support steel. The guide warns that this lesson looks least like teaching and is the one that needs you most.

      - id: evidence-thin
        phase: evidence
        when: Lesson 5 · evidence
        situation: Tom's claim now carries your wording. Under Evidence he copies his results table, every number in it.
        choices:
          - text: Ask him to circle the numbers that make his claim follow and write one sentence on why
            next: pair
            good: true
            lookFor: swh-evidence-justifies
            surface: [0]
            debrief: Circling the cooling curves, Tom writes “steel kept it coldest”, then adds “but it's heavy”. “Best for everything” comes back into the open, a step later than it could have.
          - text: Tick the page and move to the next student
            next: pair-flat
            good: false
            lookFor: swh-evidence-justifies
            debrief: A complete page with no reasoning on it. Lesson 6 starts with claims nobody has had to defend.

      - id: pair
        phase: reading
        when: Lesson 6 · comparing claims
        situation: Tom's steel group pairs with a group that argued for the plastic on mass and cost. Their claims point in opposite directions.
        said:
          who: Aisha, plastic group
          text: “Can't we just look up the figures? They'll say who's right.”
          conception: 1
        choices:
          - text: “Not yet. First write where your data agree, where they disagree, and why.”
            next: figures
            good: true
            lookFor: swh-reading-peers-first
            surface: [1]
            challenge: [0]
            debrief: Ten minutes in, the groups find their data don't conflict. They asked different questions and weighted different properties. Nobody had to tell them there's no single best bottle.
          - text: Hand out the published figures so they can settle it
            next: reflect-flat
            good: false
            lookFor: swh-reading-peers-first
            hide: [1]
            debrief: The figures arrive as a verdict. Aisha's idea that the book decides is confirmed, and the two groups never discover why their claims differ.

      - id: pair-flat
        phase: reading
        when: Lesson 6 · comparing claims
        situation: Groups swap books with the bench next door. Most claims say “steel is best” or “plastic is best”, and the talk is brief.
        said:
          who: Aisha, plastic group
          text: “Can't we just look up the figures? They'll say who's right.”
          conception: 1
        choices:
          - text: Pair the steel and plastic groups and ask each what the other's data show that theirs can't
            next: figures
            good: true
            lookFor: swh-reading-peers-first
            surface: [1]
            challenge: [0]
            debrief: Setting the opposite claims side by side recovers the disagreement. The groups find they weighted different properties, though you're doing more of the work than lesson 5 needed.
          - text: Hand out the published figures so they can settle it
            next: reflect-flat
            good: false
            lookFor: swh-reading-peers-first
            hide: [1]
            debrief: The text decides, and claims that were never defended are crossed out or kept on the book's say-so.

      - id: figures
        phase: reading
        when: Lesson 6 · the published figures
        situation: Now you release density, thermal conductivity, cost and recyclability figures. Stainless steel conducts heat far better than the plastic.
        said:
          who: Lena, steel group
          text: “So steel's a good conductor. We were wrong. I'll cross out our claim.”
          conception: 1
        choices:
          - text: Ask what her cooling data and the figure each show, and what else about the steel bottle could explain her result
            next: reflect
            good: true
            lookFor: swh-reading-not-answer-key
            challenge: [1]
            debrief: Lena looks at the bottle and finds the double wall. The vacuum gap is doing the work, not the steel. She keeps her data, qualifies her claim in writing, and the figure has become another voice rather than a verdict.
          - text: Tell her to copy the published statement in place of her claim
            next: reflect-flat
            good: false
            lookFor: swh-reading-not-answer-key
            hide: [1]
            debrief: Her cooling data were real, and now they're crossed out. The class learns that testing was the slow way to reach what the book already held.

      - id: reflect
        phase: reflection
        when: Lesson 6 · last fifteen minutes
        situation: Claims have been revised in writing. Most of the class now argue for a material for a purpose.
        choices:
          - text: Hand back the lesson 1 question sheets and ask what they first thought a good bottle was, what moved them, and what they hold now
            next: end
            good: true
            lookFor: swh-reflect-has-original
            challenge: [0]
            debrief: Tom reads his lesson 1 page, “which is strongest?”, and writes that he now thinks it depends what the bottle is for. That sentence is the learning, and he can see it in his own handwriting.
          - text: Ask students to summarise what they've learned about bottle materials
            next: end
            good: false
            lookFor: swh-reflect-has-original
            debrief: The summaries are accurate, but they're about bottles, not about how anyone's thinking changed. The beginning ideas never came back.

      - id: reflect-flat
        phase: reflection
        when: Lesson 6 · last fifteen minutes
        situation: Most books now hold the textbook's statements, copied neatly. A few claims were crossed out.
        choices:
          - text: Hand back the lesson 1 sheets and ask what moved their thinking, and whether it was their data or the book
            next: end
            good: true
            lookFor: swh-reflect-has-original
            surface: [1]
            debrief: Several students write that the book changed their minds, not their tests. It's honest, and it gives you something to plan around next time, but the negotiation didn't happen.
          - text: Ask students to summarise what they've learned about bottle materials
            next: end
            good: false
            lookFor: swh-reflect-has-original
            debrief: The summaries match the textbook. Nobody can tell what they thought before or why it changed.

    endings:
      - minGood: 4
        title: Claims met each other first
        text: >-
          Claims were tied to a purpose, evidence said why, and groups worked out their disagreement before the published
          figures arrived as another voice. That's SWH working as the guide describes: the reading phase is where the
          learning is.
      - minGood: 2
        title: Some claims were tested, some were settled for them
        text: >-
          Parts of the routine did their job. Look at the decisions where you supplied the wording or let the figures
          decide. Those are the moments to plan a sentence for.
      - minGood: 0
        title: A practical with a textbook ending
        text: >-
          The class ran tests and ended up agreeing with the book, but no claim was defended against another student. The
          guide's look-fors for Evidence and Reading are the place to start.

  - id: takeaway
    type: choice
    at: reading
    processing: Analysis
    kind: What made the difference?
    tests: sim
    title: In every run, one kind of move did the most damage.
    q: Which?
    options:
      - text: Letting two groups reach opposite claims
        fb: That's the point. Opposite claims from data that don't conflict are what the reading phase is built for.
      - text: Spending lesson 5 with individual students
        fb: That was a strong move. The guide says the claim-to-data link is where your time belongs.
      - text: Handing back the lesson 1 sheets
        fb: That was a strong move. Without them, students can't see their own change.
      - text: Letting the published figures or your own wording settle a claim before students had argued it out
        fb: Yes. Every weak path started with an authority settling something students should have defended. Each one hid an idea the routine needed to challenge.
    answer: 3
    refs:
      misapplicationIds: [mis-swh-answer-key]

  - id: reflect
    type: reflect
    at: reflection
    processing: Metacognition
    kind: Look back
    title: Your Negotiation Day.
    q: Which decision would be hardest for you on a real placement, and what will you say in that moment?
    model: "Example: “Not handing out the figures when Aisha asks. I'll have a sentence ready: ‘You'll get them. First tell me where your data and theirs disagree.’”"
