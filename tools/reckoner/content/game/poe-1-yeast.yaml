schemaVersion: 1
id: poe-1-yeast
path: poe
order: 1
title: Is yeast alive?
summary: Three flasks, three balloons. Learn what each POE phase has to do, and what it looks like when it works.
level: recognise
version: 1.0.0
status: published
lastReviewed: 2026-10-03
provenance:
  source: ai-drafted-reviewed
  authors: [Claude]
  reviewedBy: [Steve Grant]
  reviewedOn: 2026-10-03
context:
  stages: [stage4]
  focusAreas: [Living systems]
  disciplines: [biology]
outcomes: [SC4-LIV-01]
builtOn:
  sequenceIds: [ep-s4-yeast]
  exampleIds: [poe-explain-pos-yeast, poe-explain-neg-quiz]
