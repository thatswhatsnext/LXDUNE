# 5E path, lesson 3. Built on the 5E guide's worked sequence seq-s5-disease. Draft: not shown to students until reviewed.
schemaVersion: 1
id: 5e-3-outbreak
path: 5e
order: 3
title: Outbreak
summary: Why does the simulation come before herd immunity is named? Explain why each phase sits where it does.
level: explain
version: 0.1.0
status: draft
lastReviewed: 2026-10-02
provenance:
  source: ai-generated
  authors: [Claude]
  reviewedBy: []
context:
  stages: [stage5]
  focusAreas: [Disease, Data science 2]
  disciplines: [biology]
outcomes: [SC5-DIS-01, SC5-DA2-01]
builtOn:
  sequenceIds: [seq-s5-disease]
