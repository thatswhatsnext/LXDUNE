# Settings for the game at /play/. Lessons live beside this file, one YAML per lesson.
schemaVersion: 1
paths:
  - id: 5e
    title: 5E path
    blurb: From spotting the five phases in a classroom to explaining why each one sits where it does.
  - id: poe
    title: POE path
    blurb: Predict, Observe, Explain. One lesson that makes students' ideas visible and then puts them to the test.
  - id: adi
    title: ADI path
    blurb: Argument-Driven Inquiry. Students investigate, argue from their own evidence, then write, review and revise. The arguing and reviewing are the point.
    rail: groups
    requires:
      - path: poe
        level: explain
  - id: swh
    title: SWH path
    blurb: The Science Writing Heuristic. Seven questions replace the lab report, and every claim gets tested against classmates before the textbook. The comparing is the point.
    rail: groups
    tracks:
      - id: bottles
        title: "Bottles: Year 10 Chemistry"
        blurb: Which drink bottle should the school choose? One set of results, more than one defensible answer.
      - id: duckweed
        title: "Duckweed: Year 9 Biology"
        blurb: What does run-off do to a creek? A result that surprises the class, and a reading that changes claims.
    requires:
      - path: poe
        level: explain
  - id: select
    kind: select
    title: Choosing a model
    blurb: Which model fits this class, and why? The reckoner is the answer key, so your reasons have to match the class, not your favourite model.
    journey: 5e
    models: [5e, poe, adi, swh]
    requires:
      - path: 5e
        level: explain
      - path: poe
        level: explain
feedback:
  # Google Form link. "placeholder" shows an inactive button until the form is ready.
  url: placeholder
notice: >-
  This is an early version being trialled to improve EDSE science education units. Nothing you do in
  the game is recorded or sent anywhere: your progress is kept in this browser only. Feedback is
  optional, anonymous and has no bearing on your grades.
