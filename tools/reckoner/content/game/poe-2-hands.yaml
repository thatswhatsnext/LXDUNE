# POE path, lesson 2. Built on the POE guide's worked sequence ep-s5-handwashing. Reviewed and published by Steve on 2026-10-03.
schemaVersion: 1
id: poe-2-hands
path: poe
order: 2
title: Clean hands
summary: Write prediction prompts that surface reasoning, handle a model's limits, and place a POE inside a 5E unit.
level: explain
version: 1.0.0
status: published
lastReviewed: 2026-10-03
provenance:
  source: ai-drafted-reviewed
  authors: [Claude]
  reviewedBy: [Steve Grant]
  reviewedOn: 2026-10-03
context:
  stages: [stage5]
  focusAreas: [Disease]
  disciplines: [biology]
outcomes: [SC5-DIS-01]
builtOn:
  sequenceIds: [ep-s5-handwashing]
  lookForIds: [poe-reasons, poe-observe-visible, poe-consolidate]
