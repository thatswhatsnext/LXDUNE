<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" role="img" aria-labelledby="t d"><title id="t">From whole specimens to cellular organisation</title><desc id="d">From whole specimens to cellular organisation Conceptual schematics, not microscope images; panels have no common scale. Seed tissue Mushroom tissue Individual yeast cells Salt crystal Seed and mushroom tissues contain cells; yeast is a single-celled fungus. Dried yeast granules contain many cells. Salt is a crystal, not cellular tissue. After-attempt reference only - do not show above the opening prediction.</desc><style>text{font-family:system-ui,sans-serif;fill:#16211f}.h{font-size:25px;font-weight:650}.b{font-size:20px}</style><rect width="1100" height="600" rx="20" fill="#F3F6F4"/><text x="35" y="50" class="h">From whole specimens to cellular organisation</text><text x="35" y="87" class="b">Conceptual schematics, not microscope images; panels have no common scale.</text><rect x="35" y="115" width="245" height="300" rx="12" fill="white" stroke="#62958D"/><text x="50" y="155" class="b">Seed tissue</text><rect x="67" y="190" width="60" height="50" rx="7" fill="#DFEDE7" stroke="#124B3C" stroke-width="2"/><rect x="127" y="190" width="60" height="50" rx="7" fill="#DFEDE7" stroke="#124B3C" stroke-width="2"/><rect x="187" y="190" width="60" height="50" rx="7" fill="#DFEDE7" stroke="#124B3C" stroke-width="2"/><rect x="67" y="240" width="60" height="50" rx="7" fill="#DFEDE7" stroke="#124B3C" stroke-width="2"/><rect x="127" y="240" width="60" height="50" rx="7" fill="#DFEDE7" stroke="#124B3C" stroke-width="2"/><rect x="187" y="240" width="60" height="50" rx="7" fill="#DFEDE7" stroke="#124B3C" stroke-width="2"/><rect x="67" y="290" width="60" height="50" rx="7" fill="#DFEDE7" stroke="#124B3C" stroke-width="2"/><rect x="127" y="290" width="60" height="50" rx="7" fill="#DFEDE7" stroke="#124B3C" stroke-width="2"/><rect x="187" y="290" width="60" height="50" rx="7" fill="#DFEDE7" stroke="#124B3C" stroke-