<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" role="img" aria-labelledby="title desc"><title id="title">One way to nest POE and ADI within a 5E unit</title><desc id="desc">ADI can carry Explore and Explain within a 5E unit. A POE can open its first stage, Task and guiding question, to surface prior ideas. Eight ADI stages are shown in reading order. This arrangement is not a ranking or fixed time allocation.</desc><style>text{font-family:system-ui,sans-serif;fill:#16211f}.small{font-size:17px}.label{font-size:22px;font-weight:650}</style><rect width="1100" height="780" rx="24" fill="#F3F6F4"/><text x="35" y="48" font-size="29" font-weight="700">Models can work at different scales</text><text x="35" y="82" class="small">One possible arrangement - schematic, not a time allocation</text><text x="35" y="126" class="label">5E - unit architecture</text><rect x="35" y="145" width="198" height="65" rx="10" fill="white" stroke="#b06e0c" stroke-width="3"/><text x="134" y="185" text-anchor="middle" class="label">Engage</text><rect x="242" y="145" width="198" height="65" rx="10" fill="white" stroke="#0d7c6f" stroke-width="3"/><text x="341" y="185" text-anchor="middle" class="label">Explore</text><rect x="449" y="145" width="198" height="65" rx="10" fill="white" stroke="#2a5cad" stroke-width="3"/><text x="548" y="185" text-anchor="middle" class="label">Explain</text><rect x="656" y="145" width="198" height="65" rx="10" fill="white" stroke="#7046ad" stroke-width="3"/><text x="755" y="185" text-anchor="middle" class="label">Elaborate</text><rect x="863" y="145" width="198" height="65" rx="10" fill="white" stroke="#ad4166" stroke-width="3"/><text x="962" y="185" text-anchor="middle" class="label">Evaluate</text><path d="M242 224v18h405v-18M444 242v30" fill="none" stroke="#35538F" stroke-width="3"/><rect x="35" y="277" width="1026" height="252" rx="16" fill="#E8EDF6" stroke="#35538F" stroke-width="2"/><text x="58" y="315" class="label">ADI - a routine within Explore and Explain</text><rect x="58" y="338" width="235" height="73" rx="8" fill="white" stroke="#9BAFCC"/><text x="70" y="360" font-size="14">1</text><text x="93" y="366" class="small">Task and</text><text x="93" y="389" class="small">guiding question</text><rect x="308" y="338" width="235" height="73" rx="8" fill="white" stroke="#9BAFCC"/><text x="320" y="360" font-size="14">2</text><text x="343" y="366" class="small">Design the method</text><text x="343" y="389" class="small">and collect data</text><rect x="558" y="338" width="235" height="73" rx="8" fill="white" stroke="#9BAFCC"/><text x="570" y="360" font-size="14">3</text><text x="593" y="366" class="small">Analysis and</text><text x="593" y="389" class="small">tentative argument</text><rect x="808" y="338" width="235" height="73" rx="8" fill="white" stroke="#9BAFCC"/><text x="820" y="360" font-size="14">4</text><text x="843" y="366" class="small">Argumentation</text><text x="843" y="389" class="small">session</text><rect x="58" y="426" width="235" height="73" rx="8" fill="white" stroke="#9BAFCC"/><text x="70" y="448" font-size="14">5</text><text x="93" y="454" class="small">Explicit and</text><text x="93" y="477" class="small">reflective discussion</text><rect x="308" y="426" width="235" height="73" rx="8" fill="white" stroke="#9BAFCC"/><text x="320" y="448" font-size="14">6</text><text x="343" y="454" class="small">Investigation</text><text x="343" y="477" class="small">report</text><rect x="558" y="426" width="235" height="73" rx="8" fill="white" stroke="#9BAFCC"/><text x="570" y="448" font-size="14">7</text><text x="593" y="454" class="small">Double-blind</text><text x="593" y="477" class="small">peer review</text><rect x="808" y="426" width="235" height="73" rx="8" fill="white" stroke="#9BAFCC"/><text x="820" y="448" font-size="14">8</text><text x="843" y="454" class="small">Revision and</text><text x="843" y="477" class="small">submission</text><path d="M58 375H20v203h38" fill="none" stroke="#96601A" stroke-width="3"/><rect x="58" y="548" width="1003" height="153" rx="14" fill="#F6ECDF" stroke="#96601A" stroke-width="2"/><text x="80" y="581" class="label">POE - can open Task and guiding question</text><rect x="80" y="603" width="290" height="54" rx="8" fill="white" stroke="#B18B59"/><text x="225" y="637" text-anchor="middle" class="label">Predict</text><rect x="398" y="603" width="290" height="54" rx="8" fill="white" stroke="#B18B59"/><text x="543" y="637" text-anchor="middle" class="label">Observe</text><rect x="716" y="603" width="290" height="54" rx="8" fill="white" stroke="#B18B59"/><text x="861" y="637" text-anchor="middle" class="label">Explain</text><text x="80" y="685" class="small">Surface prior ideas before posing the guiding question.</text><text x="35" y="743" class="small">Reference / after-attempt use: this diagram reveals the nesting relationship.</text></svg>