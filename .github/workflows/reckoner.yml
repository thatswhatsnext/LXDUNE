name: Reckoner

# The reckoner's publishing gate. Fails on invalid guide YAML, a broken schema
# rule, a build or render regression, or a reckoner/ folder that does not match
# the YAML (edited without running npm run publish:pages, or hand-edited output).
# Checks only: it never commits or deploys.
on:
  push:
    paths:
      - 'tools/reckoner/**'
      - 'reckoner/**'
      - 'frameworks/_schema/curriculum.vocab.json'
      - 'docs/ACTION-PLAN.md'
      - 'docs/reckoner-state.md'
      - '.github/workflows/reckoner.yml'
  pull_request:
    paths:
      - 'tools/reckoner/**'
      - 'reckoner/**'
      - 'frameworks/_schema/curriculum.vocab.json'
      - 'docs/ACTION-PLAN.md'
      - 'docs/reckoner-state.md'
      - '.github/workflows/reckoner.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/reckoner
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the regression check reads guides from the base branch with git show
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tools/reckoner/package-lock.json
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npm run typecheck
      - name: reckoner/ and docs/reckoner-state.md match the YAML
        run: npm run check:pages
      - name: Nothing goes backwards compared with the base branch
        # Pull requests compare with their base branch; pushes compare with dev.
        run: npm run check:regressions -- "${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/dev' }}"
