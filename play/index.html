 what moved them, and what they hold now."},"q":"Which SWH phase is this?","refs":{"phaseIds":[],"lookForIds":["swh-reflect-has-original"],"exampleIds":[],"sequenceIds":[],"misapplicationIds":[]},"type":"spot","answer":"reflection","among":["claims","reading","reflection"],"fb":{"claims":"The claims were written in lesson 5. This compares them with where students started.","reading":"The comparing is done. Students are now looking at their own change.","reflection":"Yes. Their own beginning ideas are in front of them, and the question is about their thinking."},"variants":[]},{"id":"prompt","at":"reflection","processing":"Analysis","kind":"Judge the prompt","tests":"reflection","title":"Which reflection prompt does the job SWH gives this phase?","refs":{"phaseIds":[],"lookForIds":["swh-reflect-about-thinking"],"exampleIds":[],"sequenceIds":[],"misapplicationIds":[]},"type":"choice","options":[{"text":"Summarise the properties of the four bottle materials","fb":"That's about the topic. Students can answer it without looking at their own thinking."},{"text":"What did you think a good bottle was in lesson 1, what moved you, and what do you hold now?","fb":"Yes. It's about their thinking, and it needs their beginning ideas in front of them."},{"text":"Was your claim right?","fb":"The reading showed there's more than one defensible claim. This makes reflection a verdict."},{"text":"Rate how well your group worked together","fb":"Useful for group work, but it isn't about how their ideas changed."}],"answer":1,"variants":[]},{"id":"nest","at":"reflection","processing":"Knowledge utilisation","kind":"Nest it","tests":"nesting","q":"SWH and ADI are in the same family. Where in an ADI routine could SWH's questions do their work?","why":"ADI's individual report can be written as an SWH, so the claim, evidence and reading questions shape the argument each student writes before peer review.","type":"nest","model":"swh","host":"adi","answer":"report","how":"Use the seven questions to scaffold the individual investigation report in ADI."},{"id":"reflect","at":"reflection","processing":"Metacognition","kind":"Look back","title":"Another voice.","q":"How would you introduce the published figures so that students treat them as another voice rather than the answer?","type":"reflect","model":"Example: “I'd say: ‘Here's what a materials lab measured. Where does it agree with your results, where doesn't it, and what might explain the difference?’ Then I'd ask each student to write one change, or one reason for keeping their claim.”","recall":"predict"}]},{"id":"swh-3-duckweed","path":"swh","track":"duckweed","order":3,"title":"Not the answer key","summary":"Peers first, then the reading on run-off. How a text becomes another voice in the argument, and why the beginning ideas have to come back.","level":"explain","version":"1.0.0","status":"published","guideSection":"sequences","requires":[],"items":[{"id":"case","at":"reading","processing":"Retrieval","kind":"The case","title":"Lesson 6, where claims meet each other","table":{"caption":"The class's results, mean of three cups","head":["Cup","Fronds at start","Fronds at day 14","Condition"],"rows":[["Plain water","10","26","Green"],["Dilute fertiliser","10","48","Green; a thick mat"],["Detergent","10","12","Yellowing"],["Salt","10","9","Brown edges"]]},"type":"case","setting":{"who":"Year 9 · Environmental sustainability · Biology · six lessons","text":"After heavy rain, a creek near the school turns murky with whatever washes off roads, gardens and homes. A Year 9 class is investigating what that run-off does to living things in the water. The teacher runs it as a Science Writing Heuristic routine: instead of a lab report, each student answers seven questions about their own investigation."},"lead":"Every student has written a claim and the evidence for it. Some argued that fertiliser is good for the creek, because the duckweed grew; others that detergent or salt harms it. Today groups compare their claims, and then the teacher releases a short reading on nutrient run-off, algal blooms and salinity in Australian waterways.","you":"You're the pre-service teacher taking lesson 6.","sofar":[{"phaseId":"beginning-ideas","when":"Lesson 1","text":"Each student wrote what they wanted to find out about run-off and the creek. The questions were kept."},{"phaseId":"observations","when":"Lessons 2–4","text":"Groups designed their own tests, then counted fronds for two weeks."},{"phaseId":"evidence","when":"Lesson 5","text":"Each student wrote a claim, chose the counts that support it, and said why."},{"phaseId":"reading","when":"Lesson 6 · this lesson","text":"Groups compare claims, then read about run-off. Then the beginning questions come back."}]},{"id":"predict","at":"reading","processing":"Retrieval","kind":"Predict","title":"Lesson 6 of the duckweed routine. Every student has a claim and evidence. You have a short reading on nutrient run-off, algal blooms and salinity in Australian waterways.","q":"When should students get the reading?","why":"Hand the reading out early and students wait for it next time. Their counting becomes the slow route to what the text already said.","type":"predict","options":[{"text":"In lesson 1, so their questions are well informed"},{"text":"In lesson 3, so they know what to expect while counting"},{"text":"In lesson 6, after groups have compared their claims with each other"},{"text":"Never. Their own counts should be enough"}],"answer":2,"reveal":"The guide holds the reading back until groups have compared claims with each other. By then students have their own counts to set against it, so the text joins the argument instead of ending it."},{"id":"lf-peers","at":"reading","processing":"Comprehension","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Year 9 · Lesson 6","text":"A group that claims fertiliser helps the duckweed pairs with a group that claims detergent harms it. After ten minutes they work out that one group asked about growth and the other about harm, and that neither had asked about the creek as a whole. Only then does the teacher hand out the reading."},"hint":"What happens before the reading arrives?","type":"lookfor","answer":"swh-reading-peers-first","distractors":["swh-reading-not-answer-key","swh-claim-individual","swh-reflect-about-thinking"],"strong":true,"variants":[]},{"id":"dx-key","at":"reading","processing":"Analysis","kind":"Diagnose the plan","tests":"misapplication","vignette":{"who":"A pre-service teacher's SWH · Lesson 6","text":"With fifteen minutes left, a textbook page on algal blooms goes on the board. Students whose claims match tick the box. Students whose claims don't cross them out and copy the textbook's statement. Nobody talks to another group."},"hint":"What role is the textbook playing?","why":"The text arrives as the verdict, so students learn their own counting was the slow route to what the book already held. Crossing out isn't revision, because nothing changed for a reason. Comparing with the next bench first costs five minutes.","type":"diagnose","answer":"mis-swh-answer-key","distractors":["mis-swh-no-negotiation","mis-swh-lost-beginnings","mis-swh-evidence-recopied"],"variants":[]},{"id":"move","at":"reading","processing":"Knowledge utilisation","kind":"Teacher move","tests":"reading","vignette":{"who":"Lesson 6 · after the reading","text":"Ravi claimed fertiliser run-off is good for creeks, because his duckweed grew fastest with fertiliser. The reading says nutrient run-off can cause blooms that kill fish. Ravi says: “So my results were wrong.”"},"q":"What is the best move?","refs":{"phaseIds":[],"lookForIds":["swh-reading-not-answer-key","swh-reading-something-changes"],"exampleIds":[],"sequenceIds":[],"misapplicationIds":[]},"type":"choice","options":[{"text":"Tell Ravi to copy the reading's statement in place of his claim","fb":"That makes the reading an answer key. Ravi's counts were real, and the useful question is what they do and don't show."},{"text":"Ask what his counts show and what the reading adds, then have him rewrite his claim about the creek","fb":"Yes. His data still stand, since the duckweed did grow faster. The reading adds what a thick mat of plants does to the rest of a waterway as it blocks light and later dies and rots. Ravi can keep his data and revise his claim about impact, in writing."},{"text":"Tell Ravi his experiment was too small to count","fb":"That dismisses his evidence without examining it. Nothing changes for a reason."},{"text":"Move on. He can sort it out in his reflection","fb":"The reflection is about how his thinking changed. This is the moment it could change."}],"answer":1,"variants":[]},{"id":"lf-changes","at":"reading","processing":"Analysis","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Year 9 · Lesson 6","text":"Groups compare claims with the bench next door, then read about run-off and blooms. At the bell, every book holds exactly the claim it held at the start of the lesson. The teacher says the discussion was the point."},"hint":"Compare the books at the start and the end.","why":"Talking isn't negotiating if nothing is allowed to change. The guide asks for revisions to be written, not just discussed. A claim that survives should be argued for in writing too.","type":"lookfor","answer":"swh-reading-something-changes","distractors":["swh-reading-peers-first","swh-reading-not-answer-key","swh-claim-individual"],"strong":false,"variants":[]},{"id":"dx-none","at":"reading","processing":"Analysis","kind":"Diagnose the plan","tests":"misapplication","vignette":{"who":"Another pre-service teacher's SWH · Year 9","text":"Short of time, the teacher keeps the student template (questions, claims, evidence) and cuts the lesson where groups compare claims and read about run-off. Books are marked on the Evidence page."},"why":"The negotiation is where a claim meets someone who might disagree. Without it, the writing still helps, but vague claims cost nothing. The guide's fix is to timetable the comparing as its own phase and protect it.","type":"diagnose","answer":"mis-swh-no-negotiation","distractors":["mis-swh-answer-key","mis-swh-closed-practical","mis-swh-evidence-recopied"],"variants":[]},{"id":"spot-reflect","at":"reflection","processing":"Comprehension","kind":"Spot the phase","tests":"reflection","vignette":{"who":"Year 9 · End of lesson 6","text":"The teacher hands back the lesson 1 question sheets. Students write what they first thought pollution did, what changed their mind, and one change to what goes down drains at school that their evidence supports."},"q":"Which SWH phase is this?","refs":{"phaseIds":[],"lookForIds":["swh-reflect-has-original"],"exampleIds":[],"sequenceIds":[],"misapplicationIds":[]},"type":"spot","answer":"reflection","among":["claims","reading","reflection"],"fb":{"claims":"The claims were written in lesson 5. This compares them with where students started.","reading":"The comparing is done. Students are now looking at their own change.","reflection":"Yes. Their own beginning ideas are in front of them, and the question is about their thinking."},"variants":[]},{"id":"prompt","at":"reflection","processing":"Analysis","kind":"Judge the prompt","tests":"reflection","title":"Which reflection prompt does the job SWH gives this phase?","refs":{"phaseIds":[],"lookForIds":["swh-reflect-about-thinking"],"exampleIds":[],"sequenceIds":[],"misapplicationIds":[]},"type":"choice","options":[{"text":"Summarise what you learned about algal blooms","fb":"That's about the topic. Students can answer it without looking at their own thinking."},{"text":"What did you think pollution did in lesson 1, what changed your mind, and what do you think now?","fb":"Yes. It's about their thinking, and it needs their beginning ideas in front of them."},{"text":"Was your claim right?","fb":"The reading may have shown a claim can be right about the duckweed and incomplete about the creek. This makes reflection a verdict."},{"text":"Rate how well your group worked together","fb":"Useful for group work, but it isn't about how their ideas changed."}],"answer":1,"variants":[]},{"id":"nest","at":"reflection","processing":"Knowledge utilisation","kind":"Nest it","tests":"nesting","q":"SWH and ADI are in the same family. Where in an ADI routine could SWH's questions do their work?","why":"ADI's individual report can be written as an SWH, so the claim, evidence and reading questions shape the argument each student writes before peer review.","type":"nest","model":"swh","host":"adi","answer":"report","how":"Use the seven questions to scaffold the individual investigation report in ADI."},{"id":"reflect","at":"reflection","processing":"Metacognition","kind":"Look back","title":"Another voice.","q":"How would you introduce the reading so that students treat it as another voice rather than the answer?","type":"reflect","model":"Example: “I'd say: ‘Here's what scientists have found about creeks. Where does it agree with your counts, where doesn't it, and what does it add that your cups couldn't show?’ Then I'd ask them to write one change or one reason for keeping their claim.”","recall":"predict"}]},{"id":"swh-4-bottles","path":"swh","track":"bottles","order":4,"title":"Build it: SWH","summary":"Build a six-lesson SWH routine for a Year 10 materials unit from activity cards, then read what the guide's look-fors say about it.","level":"design","version":"1.0.0","status":"published","guideSection":"checklist","requires":[],"items":[{"id":"practical","at":"beginning-ideas","processing":"Analysis","kind":"Choose the practical","tests":"design","title":"Your routine: Year 10, six lessons inside a materials unit. Many students think there's one best material, whatever it's for.","q":"Which practical gives SWH the most to work with?","refs":{"phaseIds":[],"lookForIds":[],"exampleIds":[],"sequenceIds":[],"misapplicationIds":["mis-swh-closed-practical"]},"type":"choice","options":[{"text":"Measuring the density of a steel offcut by displacement","fb":"One right answer, so claims can't differ and the reading phase has nothing to do. The guide calls this using SWH on a closed practical."},{"text":"Following a printed method to time how fast hot water cools in the steel and glass bottles","fb":"The method and the comparison are set, so students' own questions have nowhere to go."},{"text":"Four 750 mL bottles (stainless steel, aluminium, glass and a copolyester plastic) and the question of which one the school should choose","fb":"Yes. Which property matters depends on the purpose, so students' questions and claims can differ, and the reading phase has a real disagreement to work on."},{"text":"Researching bottle materials online and writing a summary","fb":"There's no practical, so there are no observations of their own to make a claim from."}],"answer":2,"variants":[]},{"id":"rubric","at":"beginning-ideas","processing":"Retrieval","kind":"Before you build","title":"What the report will look for","type":"concept","lead":"The board checks your plan against the SWH guide's look-fors and misapplications. A card counts only in the phase whose job it does, and some cards look efficient but bring a known problem with them. Leaving out the reading phase, where claims meet other students, is the cut the guide warns about most.","rows":[{"phaseId":"beginning-ideas","does":"Students' own questions, written down and kept.","move":"Watch for: a question on the board."},{"phaseId":"tests","does":"A method that answers their question.","move":"Watch for: one method for everyone."},{"phaseId":"observations","does":"What happened, apart from what it means.","move":"Watch for: explaining while recording."},{"phaseId":"claims","does":"An individual claim someone could disagree with.","move":"Watch for: one claim per group."},{"phaseId":"evidence","does":"Chosen data, and why it supports the claim.","move":"Watch for: the results table again."},{"phaseId":"reading","does":"Peers first, then the text as another voice.","move":"Watch for: the text as the answer key."},{"phaseId":"reflection","does":"Beginning ideas handed back; how thinking changed.","move":"Watch for: a summary of the topic."}]},{"id":"board","at":"tests","processing":"Knowledge utilisation","kind":"Build the plan","tests":"design","title":"Build your SWH routine.","q":"Place one activity in each phase. Not every card belongs in a strong routine.","hint":"Read each card for what students actually do, not the heading it sounds like.","why":"Seven headings are easy to fill. Whether it's SWH depends on whose question it is, whether evidence says why, and whether claims meet other students before they meet the textbook.","type":"build","brief":{"who":"Year 10 · Materials · six lessons inside the unit","text":"The practical: four 750 mL bottles (steel, aluminium, glass, copolyester plastic), and the question of which one the school should choose."},"cards":[{"id":"bi-own","text":"Ten minutes handling the four bottles, then each student writes what they'd need to find out before recommending one. Questions are conferenced briefly for testability and kept","kind":"activity","does":"beginning-ideas","features":["swh-begin-own-question"],"flaws":[]},{"id":"bi-board","text":"Write the question on the board, “Which bottle keeps water hot longest?”, and students copy it into their books","kind":"activity","does":"beginning-ideas","features":[],"flaws":["mis-swh-supplied-question"]},{"id":"t-sheet","text":"Every group follows the same method sheet: 80 °C water in each bottle, temperature after an hour","kind":"activity","does":"tests","features":[],"flaws":[]},{"id":"t-own","text":"Groups design tests for the properties their questions named, such as cooling with hot water, mass and a contained drop test; the teacher checks each plan for safety and feasibility without redesigning it","kind":"activity","does":"tests","features":["swh-tests-follows-question"],"flaws":[]},{"id":"o-columns","text":"Groups run their tests with repeats, recording what happened in one column and what they think it means in another. Odd trials are written down","kind":"activity","does":"observations","features":["swh-obs-separate"],"flaws":[]},{"id":"o-paragraph","text":"Groups write up what happened as a paragraph, explaining each result as they go","kind":"activity","does":"observations","features":[],"flaws":[]},{"id":"c-group","text":"Each group agrees one claim, and every member copies it into their book","kind":"activity","does":"claims","features":[],"flaws":[]},{"id":"c-own","text":"Each student writes their own claim answering their own question, in a form another student could disagree with","kind":"activity","does":"claims","features":["swh-claim-arguable","swh-claim-individual"],"flaws":[]},{"id":"e-why","text":"Students choose the data that support their claim, say why it supports it, and deal with anything that doesn't fit, such as a loose-lid trial. The teacher spends the lesson on this, student by student","kind":"activity","does":"evidence","features":["swh-evidence-justifies","swh-evidence-selected","swh-evidence-anomalies"],"flaws":[]},{"id":"e-table","text":"Students copy their results table under the Evidence heading","kind":"activity","does":"evidence","features":[],"flaws":["mis-swh-evidence-recopied"]},{"id":"r-key","text":"The textbook page goes on the board, and students check their claims against it","kind":"activity","does":"reading","features":[],"flaws":["mis-swh-answer-key"]},{"id":"r-peers","text":"Groups pair up and work out why their claims differ. Then the teacher releases published density, conductivity, cost and recyclability figures, and revisions are written","kind":"activity","does":"reading","features":["swh-reading-peers-first","swh-reading-not-answer-key","swh-reading-something-changes"],"flaws":[]},{"id":"rf-summary","text":"Students write a summary of what they learned about bottle materials","kind":"activity","does":"reflection","features":[],"flaws":["mis-swh-lost-beginnings"]},{"id":"rf-back","text":"The lesson 1 question sheets are handed back. Students write what they first thought a good bottle was, what moved them, and what they hold now","kind":"activity","does":"reflection","features":["swh-reflect-has-original","swh-begin-kept","swh-reflect-about-thinking"],"flaws":[]}],"report":["swh-begin-own-question","swh-begin-kept","swh-tests-follows-question","swh-obs-separate","swh-claim-arguable","swh-claim-individual","swh-evidence-justifies","swh-evidence-selected","swh-evidence-anomalies","swh-reading-peers-first","swh-reading-not-answer-key","swh-reading-something-changes","swh-reflect-has-original","swh-reflect-about-thinking"],"missing":{"beginning-ideas":"mis-swh-supplied-question","evidence":"mis-swh-evidence-recopied","reading":"mis-swh-no-negotiation","reflection":"mis-swh-lost-beginnings"}},{"id":"cut","at":"reading","processing":"Knowledge utilisation","kind":"Teacher move","tests":"design","vignette":{"who":"Week 7 · one lesson lost","text":"A school event takes one of your six lessons. The routine has to fit in five."},"q":"What do you cut?","refs":{"phaseIds":[],"lookForIds":[],"exampleIds":[],"sequenceIds":[],"misapplicationIds":["mis-swh-no-negotiation"]},"type":"choice","options":[{"text":"Drop the lesson where groups compare claims and read the figures","fb":"That's the cut the guide warns about most. Claims never meet anyone who might disagree, so they can stay vague at no cost."},{"text":"Run the practical in one lesson instead of two, with fewer repeats, and keep every phase","fb":"Yes. Fewer repeats make narrower claims, which is itself something to discuss. The reading phase is the one that gets cut, and the guide says to protect it."},{"text":"Supply the question and the method, so lessons 1 and 2 become one","fb":"You save a lesson but lose the students' own questions, so there's nothing of theirs to defend and nothing to reflect against."},{"text":"Skip the reflection and collect the books","fb":"The beginning ideas never come back, so students never see their own change."}],"answer":1,"variants":[]},{"id":"reflect","at":"reflection","processing":"Metacognition","kind":"Look back","title":"Your report, your routine.","q":"Which look-for in your report would be hardest to meet on placement, and what would you plan differently because of it?","type":"reflect","model":"Example: “Beginning ideas kept. Books go home and get lost, so I'd photograph every first page in lesson 1 and print them for lesson 6.”"}]},{"id":"swh-4-duckweed","path":"swh","track":"duckweed","order":4,"title":"Build it: SWH","summary":"Build a six-lesson SWH routine for a Year 9 sustainability unit from activity cards, then read what the guide's look-fors say about it.","level":"design","version":"1.0.0","status":"published","guideSection":"checklist","requires":[],"items":[{"id":"practical","at":"beginning-ideas","processing":"Analysis","kind":"Choose the practical","tests":"design","title":"Your routine: Year 9, six lessons inside a sustainability unit. Many students think pollution always makes living things grow less.","q":"Which practical gives SWH the most to work with?","refs":{"phaseIds":[],"lookForIds":[],"exampleIds":[],"sequenceIds":[],"misapplicationIds":["mis-swh-closed-practical"]},"type":"choice","options":[{"text":"Counting the fronds on one duckweed plant under a hand lens","fb":"One right answer, so claims can't differ and the reading phase has nothing to do. The guide calls this using SWH on a closed practical."},{"text":"Following a printed method to grow duckweed in fertiliser and in plain water","fb":"The method and the comparison are set, so students' own questions have nowhere to go."},{"text":"Duckweed in cups with run-off substances students choose from an approved list, and the question of what run-off does to a creek","fb":"Yes. Students' questions can differ, fertiliser's result surprises them, and “impact” has to be argued about the whole waterway. The reading phase has a real disagreement to work on."},{"text":"Researching water pollution online and writing a summary","fb":"There's no practical, so there are no observations of their own to make a claim from."}],"answer":2,"variants":[]},{"id":"rubric","at":"beginning-ideas","processing":"Retrieval","kind":"Before you build","title":"What the report will look for","type":"concept","lead":"The board checks your plan against the SWH guide's look-fors and misapplications. A card counts only in the phase whose job it does, and some cards look efficient but bring a known problem with them. Leaving out the reading phase, where claims meet other students, is the cut the guide warns about most.","rows":[{"phaseId":"beginning-ideas","does":"Students' own questions, written down and kept.","move":"Watch for: a question on the board."},{"phaseId":"tests","does":"A method that answers their question.","move":"Watch for: one method for everyone."},{"phaseId":"observations","does":"What happened, apart from what it means.","move":"Watch for: explaining while recording."},{"phaseId":"claims","does":"An individual claim someone could disagree with.","move":"Watch for: one claim per group."},{"phaseId":"evidence","does":"Chosen data, and why it supports the claim.","move":"Watch for: the counting table again."},{"phaseId":"reading","does":"Peers first, then the text as another voice.","move":"Watch for: the text as the answer key."},{"phaseId":"reflection","does":"Beginning ideas handed back; how thinking changed.","move":"Watch for: a summary of the topic."}]},{"id":"board","at":"tests","processing":"Knowledge utilisation","kind":"Build the plan","tests":"design","title":"Build your SWH routine.","q":"Place one activity in each phase. Not every card belongs in a strong routine.","hint":"Read each card for what students actually do, not the heading it sounds like.","why":"Seven headings are easy to fill. Whether it's SWH depends on whose question it is, whether evidence says why, and whether claims meet other students before they meet the textbook.","type":"build","brief":{"who":"Year 9 · Environmental sustainability · six lessons inside the unit","text":"The practical: duckweed in cups, run-off substances from an approved list, and the question of what run-off does to a creek."},"cards":[{"id":"bi-own","text":"Students look at duckweed and at photos of a local creek after rain, then each writes what they'd want to find out about what washes into it. Questions are conferenced for testability and kept","kind":"activity","does":"beginning-ideas","features":["swh-begin-own-question"],"flaws":[]},{"id":"bi-board","text":"Write the question on the board, “Does fertiliser affect duckweed growth?”, and students copy it into their books","kind":"activity","does":"beginning-ideas","features":[],"flaws":["mis-swh-supplied-question"]},{"id":"t-sheet","text":"Every group follows the same method sheet, with one cup of fertiliser and one of plain water","kind":"activity","does":"tests","features":[],"flaws":[]},{"id":"t-own","text":"Groups design tests of the substances and strengths their questions named, with repeats and plain-water cups; the teacher checks each plan for safety, disposal and feasibility without redesigning it","kind":"activity","does":"tests","features":["swh-tests-follows-question"],"flaws":[]},{"id":"o-columns","text":"Groups count fronds at the start of each lesson for two weeks, recording counts and condition in one column and what they think it means in another. Odd cups are written down","kind":"activity","does":"observations","features":["swh-obs-separate"],"flaws":[]},{"id":"o-paragraph","text":"At the end of two weeks, groups write a paragraph on what happened in each cup, explaining as they go","kind":"activity","does":"observations","features":[],"flaws":[]},{"id":"c-group","text":"Each group agrees one claim, and every member copies it into their book","kind":"activity","does":"claims","features":[],"flaws":[]},{"id":"c-own","text":"Each student writes their own claim answering their own question, in a form another student could disagree with","kind":"activity","does":"claims","features":["swh-claim-arguable","swh-claim-individual"],"flaws":[]},{"id":"e-why","text":"Students choose the counts that support their claim, say why they support it, and deal with any cup that doesn't fit. The teacher spends the lesson on this, student by student","kind":"activity","does":"evidence","features":["swh-evidence-justifies","swh-evidence-selected","swh-evidence-anomalies"],"flaws":[]},{"id":"e-table","text":"Students copy their counting table under the Evidence heading","kind":"activity","does":"evidence","features":[],"flaws":["mis-swh-evidence-recopied"]},{"id":"r-key","text":"The textbook page on algal blooms goes on the board, and students check their claims against it","kind":"activity","does":"reading","features":[],"flaws":["mis-swh-answer-key"]},{"id":"r-peers","text":"Groups pair up and work out why their claims differ. Then the teacher releases a reading on nutrient run-off, blooms and salinity, and revisions are written","kind":"activity","does":"reading","features":["swh-reading-peers-first","swh-reading-not-answer-key","swh-reading-something-changes"],"flaws":[]},{"id":"rf-summary","text":"Students write a summary of what they learned about water pollution","kind":"activity","does":"reflection","features":[],"flaws":["mis-swh-lost-beginnings"]},{"id":"rf-back","text":"The lesson 1 question sheets are handed back. Students write what they first thought pollution did, what changed their mind, and what they think now","kind":"activity","does":"reflection","features":["swh-reflect-has-original","swh-begin-kept","swh-reflect-about-thinking"],"flaws":[]}],"report":["swh-begin-own-question","swh-begin-kept","swh-tests-follows-question","swh-obs-separate","swh-claim-arguable","swh-claim-individual","swh-evidence-justifies","swh-evidence-selected","swh-evidence-anomalies","swh-reading-peers-first","swh-reading-not-answer-key","swh-reading-something-changes","swh-reflect-has-original","swh-reflect-about-thinking"],"missing":{"beginning-ideas":"mis-swh-supplied-question","evidence":"mis-swh-evidence-recopied","reading":"mis-swh-no-negotiation","reflection":"mis-swh-lost-beginnings"}},{"id":"cut","at":"reading","processing":"Knowledge utilisation","kind":"Teacher move","tests":"design","vignette":{"who":"Week 7 · one lesson lost","text":"A school event takes one of your six lessons. The routine has to fit in five."},"q":"What do you cut?","refs":{"phaseIds":[],"lookForIds":[],"exampleIds":[],"sequenceIds":[],"misapplicationIds":["mis-swh-no-negotiation"]},"type":"choice","options":[{"text":"Drop the lesson where groups compare claims and read about run-off","fb":"That's the cut the guide warns about most. Claims never meet anyone who might disagree, so they can stay vague at no cost."},{"text":"Fold the end-of-counting lesson into the start of lesson 5, and keep every phase","fb":"Yes. The counting already happens in five-minute slots across the fortnight, so organising the data can share a lesson. The reading phase is the one that gets cut, and the guide says to protect it."},{"text":"Supply the question and the method, so lessons 1 and 2 become one","fb":"You save a lesson but lose the students' own questions, so there's nothing of theirs to defend and nothing to reflect against."},{"text":"Skip the reflection and collect the books","fb":"The beginning ideas never come back, so students never see their own change."}],"answer":1,"variants":[]},{"id":"reflect","at":"reflection","processing":"Metacognition","kind":"Look back","title":"Your report, your routine.","q":"Which look-for in your report would be hardest to meet on placement, and what would you plan differently because of it?","type":"reflect","model":"Example: “Beginning ideas kept. Books go home and get lost, so I'd photograph every first page in lesson 1 and print them for lesson 6.”"}]},{"id":"swh-5-bottles","path":"swh","track":"bottles","order":5,"title":"Negotiation Day","summary":"Run the claims, the evidence and the negotiation with a simulated Year 10 class. Every move decides whether claims meet each other before they meet the published figures.","level":"design","version":"1.0.0","status":"published","guideSection":"sequences","requires":[],"items":[{"id":"briefing","at":"claims","processing":"Retrieval","kind":"How Negotiation Day works","title":"Two lessons, five decisions","table":{"caption":"The class's results: 750 mL bottles, 80 °C water at the start","head":["Bottle","After 1 hour","Empty mass","Drop test"],"rows":[["Steel (double wall)","71 °C","350 g","Small dent"],["Plastic","49 °C","130 g","Undamaged"],["Glass","46 °C","420 g","Cracked"],["Aluminium","42 °C","160 g","Dented"]]},"type":"concept","lead":"You're on placement with a Year 10 class recommending a reusable drink bottle for the school, near the end of their SWH routine. Groups have their results, shown here. At five moments you choose what to do next, and your choices decide which ideas surface, which stay hidden and which get challenged.","rows":[{"phaseId":"claims","does":"Lesson 5: each student writes a claim.","move":"Ask what it's a claim about."},{"phaseId":"evidence","does":"Lesson 5: each student writes why their data support it.","move":"Spend your time on the claim-to-data link."},{"phaseId":"reading","does":"Lesson 6: groups compare, then the figures arrive.","move":"Peers first. The figures are another voice."},{"phaseId":"reflection","does":"Lesson 6: beginning ideas handed back.","move":"Ask about their thinking."}]},{"id":"sim","at":"claims","processing":"Knowledge utilisation","kind":"Negotiation Day","tests":"sim","type":"sim","cast":{"who":"Year 10 · Materials","text":"26 students in six groups. Each student wrote their own questions in lesson 1, so groups tested different properties."},"sequenceId":"swh-seq-s5-bottles","start":"claim","nodes":[{"id":"claim","phase":"claims","when":"Lesson 5 · claims","situation":"Students are writing their claims alone. Tom's lesson 1 question was about keeping a drink hot. His claim reads “Steel is the best material for a bottle.”","said":{"who":"Tom","text":"“Steel's just the best. It won the cooling test.”","conception":0},"choices":[{"text":"Ask, “Best for what? Which of your lesson 1 questions does this answer?”","next":"evidence","good":true,"lookFor":"swh-claim-arguable","debrief":"Tom rewrites it as “For keeping a drink hot, the steel bottle is the best choice.” His idea that steel is simply the best is now on the page, narrowed to a purpose, where the plastic group can push back.","surface":[0],"hide":[],"challenge":[]},{"text":"Suggest he write “Steel is the best for keeping drinks hot” instead","next":"evidence-thin","good":false,"lookFor":"swh-claim-arguable","debrief":"The claim is better, but it's yours. Tom still thinks steel is simply the best, and he hasn't had to say what his claim is about.","surface":[],"hide":[0],"challenge":[]}]},{"id":"evidence","phase":"evidence","when":"Lesson 5 · evidence","situation":"Tom starts the Evidence page by copying out his whole results table, temperatures, masses and drop results included.","choices":[{"text":"Sit with him and ask, “Which of these numbers makes your claim follow? Which could you leave out, and why?”","next":"pair","good":true,"lookFor":"swh-evidence-justifies","debrief":"Tom keeps the cooling results (steel lost 9 °C, the others 31 °C or more), sets mass aside because it isn't what his claim is about, and spots one steel trial that lost 20 °C. He checks, and the lid had been loose. That's the reasoning SWH exists to build.","surface":[],"hide":[],"challenge":[]},{"text":"Let him finish. It's complete, and you need to set up for tomorrow","next":"pair-flat","good":false,"lookFor":"swh-evidence-justifies","debrief":"The page looks finished, but it never says why the data support steel. The guide warns that this lesson looks least like teaching and is the one that needs you most.","surface":[],"hide":[],"challenge":[]}]},{"id":"evidence-thin","phase":"evidence","when":"Lesson 5 · evidence","situation":"Tom's claim now carries your wording. Under Evidence he copies his results table, every number in it.","choices":[{"text":"Ask him to circle the numbers that make his claim follow and write one sentence on why","next":"pair","good":true,"lookFor":"swh-evidence-justifies","debrief":"Circling the cooling results, Tom writes “steel kept it hottest”, then adds “but it's nearly three times heavier than the plastic”. His idea that steel is best at everything comes back into the open, a step later than it could have.","surface":[0],"hide":[],"challenge":[]},{"text":"Tick the page and move to the next student","next":"pair-flat","good":false,"lookFor":"swh-evidence-justifies","debrief":"A complete page with no reasoning on it. Lesson 6 starts with claims nobody has had to defend.","surface":[],"hide":[],"challenge":[]}]},{"id":"pair","phase":"reading","when":"Lesson 6 · comparing claims","situation":"Tom's steel group pairs with Aisha's group, who argued for the plastic as the bottle to carry all day. Their claims point in opposite directions.","said":{"who":"Aisha","text":"“Can't we just look up the figures? They'll say who's right.”","conception":1},"choices":[{"text":"“Not yet. First write where your data agree, where they disagree, and why.”","next":"figures","good":true,"lookFor":"swh-reading-peers-first","debrief":"Ten minutes in, the groups find their data don't conflict. Tom's group asked about heat, Aisha's about carrying. Nobody had to tell them there's no single best bottle.","surface":[1],"hide":[],"challenge":[0]},{"text":"Hand out the published figures so they can settle it","next":"reflect-flat","good":false,"lookFor":"swh-reading-peers-first","debrief":"The figures arrive as a verdict. Aisha's idea that the numbers decide is confirmed, and the two groups never discover why their claims differ.","surface":[],"hide":[1],"challenge":[]}]},{"id":"pair-flat","phase":"reading","when":"Lesson 6 · comparing claims","situation":"Groups swap books with the bench next door. Most claims say “steel is best” or “plastic is best”, and the talk is brief.","said":{"who":"Aisha","text":"“Can't we just look up the figures? They'll say who's right.”","conception":1},"choices":[{"text":"Pair the steel and plastic groups and ask each what the other's data show that theirs can't","next":"figures","good":true,"lookFor":"swh-reading-peers-first","debrief":"Setting the opposite claims side by side recovers the disagreement. The groups find they weighted different properties, though you're doing more of the work than lesson 5 needed.","surface":[1],"hide":[],"challenge":[0]},{"text":"Hand out the published figures so they can settle it","next":"reflect-flat","good":false,"lookFor":"swh-reading-peers-first","debrief":"The figures decide, and claims that were never defended are crossed out or kept on the book's say-so.","surface":[],"hide":[1],"challenge":[]}]},{"id":"figures","phase":"reading","when":"Lesson 6 · the published figures","situation":"Now you release thermal conductivity, density, cost and recyclability figures. Stainless steel conducts heat about 16 times better than glass and about 80 times better than the plastic.","said":{"who":"Tom","text":"“So steel lets heat through easily. Our results were wrong. I'll cross out my claim.”","conception":1},"choices":[{"text":"Ask what his cooling data and the figure each show, and to look again at how the steel bottle is made","next":"reflect","good":true,"lookFor":"swh-reading-not-answer-key","debrief":"Tom unscrews the lid and finds the double wall. The vacuum gap is doing the work, not the steel. He keeps his data, qualifies his claim in writing, and the figure has become another voice rather than a verdict.","surface":[],"hide":[],"challenge":[1]},{"text":"Tell him to copy the published statement in place of his claim","next":"reflect-flat","good":false,"lookFor":"swh-reading-not-answer-key","debrief":"His cooling data were real, and now they're crossed out. The class learns that testing was the slow way to reach what the book already held.","surface":[],"hide":[1],"challenge":[]}]},{"id":"reflect","phase":"reflection","when":"Lesson 6 · last fifteen minutes","situation":"Claims have been revised in writing. Most of the class now argue for a bottle for a purpose.","choices":[{"text":"Hand back the lesson 1 question sheets and ask what they first thought a good bottle was, what moved them, and what they hold now","next":"end","good":true,"lookFor":"swh-reflect-has-original","debrief":"Tom reads his lesson 1 page, “Which bottle is the best?”, and writes that he now thinks it depends what the bottle is for, and that the design can matter more than the material. That sentence is the learning, in his own handwriting.","surface":[],"hide":[],"challenge":[0]},{"text":"Ask students to summarise what they've learned about bottle materials","next":"end","good":false,"lookFor":"swh-reflect-has-original","debrief":"The summaries are accurate, but they're about bottles, not about how anyone's thinking changed. The beginning ideas never came back.","surface":[],"hide":[],"challenge":[]}]},{"id":"reflect-flat","phase":"reflection","when":"Lesson 6 · last fifteen minutes","situation":"Most books now hold the published figures, copied neatly. A few claims were crossed out.","choices":[{"text":"Hand back the lesson 1 sheets and ask what moved their thinking, and whether it was their data or the figures","next":"end","good":true,"lookFor":"swh-reflect-has-original","debrief":"Several students write that the figures changed their minds, not their tests. It's honest, and it gives you something to plan around next time, but the negotiation didn't happen.","surface":[1],"hide":[],"challenge":[]},{"text":"Ask students to summarise what they've learned about bottle materials","next":"end","good":false,"lookFor":"swh-reflect-has-original","debrief":"The summaries match the figures. Nobody can tell what they thought before or why it changed.","surface":[],"hide":[],"challenge":[]}]}],"endings":[{"minGood":4,"title":"Claims met each other first","text":"Claims were tied to a purpose, evidence said why, and groups worked out their disagreement before the published figures arrived as another voice. That's SWH working as the guide describes: the reading phase is where the learning is."},{"minGood":2,"title":"Some claims were tested, some were settled for them","text":"Parts of the routine did their job. Look at the decisions where you supplied the wording or let the figures decide. Those are the moments to plan a sentence for."},{"minGood":0,"title":"A practical with a textbook ending","text":"The class ran tests and ended up agreeing with the figures, but no claim was defended against another student. The guide's look-fors for Evidence and Reading are the place to start."}],"conceptions":["There is one best material, independent of purpose","The published figure settles it, so testing is a formality"]},{"id":"takeaway","at":"reading","processing":"Analysis","kind":"What made the difference?","tests":"sim","title":"In every run, one kind of move did the most damage.","q":"Which?","refs":{"phaseIds":[],"lookForIds":[],"exampleIds":[],"sequenceIds":[],"misapplicationIds":["mis-swh-answer-key"]},"type":"choice","options":[{"text":"Letting two groups reach opposite claims","fb":"That's the point. Opposite claims from data that don't conflict are what the reading phase is built for."},{"text":"Spending lesson 5 with individual students","fb":"That was a strong move. The guide says the claim-to-data link is where your time belongs."},{"text":"Handing back the lesson 1 sheets","fb":"That was a strong move. Without them, students can't see their own change."},{"text":"Letting the published figures or your own wording settle a claim before students had argued it out","fb":"Yes. Every weak path started with an authority settling something students should have defended. Each one hid an idea the routine needed to challenge."}],"answer":3,"variants":[]},{"id":"reflect","at":"reflection","processing":"Metacognition","kind":"Look back","title":"Your Negotiation Day.","q":"Which decision would be hardest for you on a real placement, and what will you say in that moment?","type":"reflect","model":"Example: “Not handing out the figures when Aisha asks. I'll have a sentence ready: ‘You'll get them. First tell me where your data and theirs disagree.’”"}]},{"id":"swh-5-duckweed","path":"swh","track":"duckweed","order":5,"title":"Negotiation Day","summary":"Run the claims, the evidence and the negotiation with a simulated Year 9 class. Every move decides whether claims meet each other before they meet the textbook.","level":"design","version":"1.0.0","status":"published","guideSection":"sequences","requires":[],"items":[{"id":"briefing","at":"claims","processing":"Retrieval","kind":"How Negotiation Day works","title":"Two lessons, five decisions","table":{"caption":"The class's results, mean of three cups","head":["Cup","Fronds at start","Fronds at day 14","Condition"],"rows":[["Plain water","10","26","Green"],["Dilute fertiliser","10","48","Green; a thick mat"],["Detergent","10","12","Yellowing"],["Salt","10","9","Brown edges"]]},"type":"concept","lead":"You're on placement with a Year 9 class investigating what run-off from roads, gardens and homes does to a creek, near the end of their SWH routine. Groups have finished a fortnight of counting duckweed fronds, shown here. At five moments you choose what to do next, and your choices decide which ideas surface, which stay hidden and which get challenged.","rows":[{"phaseId":"claims","does":"Lesson 5: each student writes a claim.","move":"Ask what it's a claim about."},{"phaseId":"evidence","does":"Lesson 5: each student writes why their counts support it.","move":"Spend your time on the claim-to-data link."},{"phaseId":"reading","does":"Lesson 6: groups compare, then the reading arrives.","move":"Peers first. The text is another voice."},{"phaseId":"reflection","does":"Lesson 6: beginning ideas handed back.","move":"Ask about their thinking."}]},{"id":"sim","at":"claims","processing":"Knowledge utilisation","kind":"Negotiation Day","tests":"sim","type":"sim","cast":{"who":"Year 9 · Environmental sustainability","text":"24 students in six groups. Each student wrote their own questions in lesson 1, so groups tested different substances and strengths."},"sequenceId":"swh-seq-s5-duckweed","start":"claim","nodes":[{"id":"claim","phase":"claims","when":"Lesson 5 · claims","situation":"Students are writing their claims alone. Ravi's fertiliser cups grew far more fronds than plain water. His claim reads “Fertiliser run-off is good for creeks.”","said":{"who":"Ravi","text":"“It can't be pollution if it makes things grow.”","conception":0},"choices":[{"text":"Ask, “Good for what? Your lesson 1 question was about the whole creek. What does your claim say about that?”","next":"evidence","good":true,"lookFor":"swh-claim-arguable","debrief":"Ravi narrows it to “fertiliser made the duckweed grow faster, so it would spread in a creek”. His idea that only harm counts as pollution is now on the page, where another group can push back.","surface":[0],"hide":[],"challenge":[]},{"text":"Tell him fertiliser causes algal blooms, so he should change his claim","next":"evidence-thin","good":false,"lookFor":"swh-claim-arguable","debrief":"The claim changes, but the reason is yours. Ravi still thinks growth can't be harm, and he hasn't had to say what his claim is about.","surface":[],"hide":[0],"challenge":[]}]},{"id":"evidence","phase":"evidence","when":"Lesson 5 · evidence","situation":"Under Evidence, Ravi compares one fertiliser cup with one plain-water cup, though his group set up three of each.","said":{"who":"Ravi","text":"“One cup of each is enough. The difference was obvious.”","conception":2},"choices":[{"text":"Sit with him and ask, “What do your other cups show? And why does the comparison count?”","next":"pair","good":true,"lookFor":"swh-evidence-justifies","debrief":"Ravi adds the repeats and finds one fertiliser cup barely grew. He notes that it was the one by the window, and that its water level had dropped. His claim now rests on two cups out of three, with a reason for the third. That's the reasoning SWH exists to build.","surface":[],"hide":[],"challenge":[2]},{"text":"Let him finish. The difference is clear, and you need to set up for tomorrow","next":"pair-flat","good":false,"lookFor":"swh-evidence-justifies","debrief":"The page looks finished, but “one cup is enough” goes unchallenged. The guide warns that this lesson looks least like teaching and is the one that needs you most.","surface":[],"hide":[],"challenge":[]}]},{"id":"evidence-thin","phase":"evidence","when":"Lesson 5 · evidence","situation":"Ravi's claim now carries your wording about blooms. Under Evidence he copies his counting table, every cup and every day.","choices":[{"text":"Ask him to circle the counts that make his claim follow and write one sentence on why","next":"pair","good":true,"lookFor":"swh-evidence-justifies","debrief":"Circling the fertiliser counts, Ravi writes “the duckweed loved it”, then stops. His counts don't show anything about blooms. His own idea that growth is good comes back into the open, a step later than it could have.","surface":[0],"hide":[],"challenge":[]},{"text":"Tick the page and move to the next student","next":"pair-flat","good":false,"lookFor":"swh-evidence-justifies","debrief":"A complete page with no reasoning on it. Lesson 6 starts with claims nobody has had to defend.","surface":[],"hide":[],"challenge":[]}]},{"id":"pair","phase":"reading","when":"Lesson 6 · comparing claims","situation":"Ravi's group pairs with Aisha's, who tested salt. Their fronds yellowed, but the water stayed clear.","said":{"who":"Aisha","text":"“Our water looked clean, so the salt probably didn't do much. The duckweed just got old.”","conception":1},"choices":[{"text":"“Before the reading, write where your counts agree, where they disagree, and why.”","next":"reading","good":true,"lookFor":"swh-reading-peers-first","debrief":"Comparing cups, Aisha's group sees that their salt cups fell behind the plain-water cups, which aged just as long. Something invisible did have an effect. Ravi's group sees that growth and harm are different questions.","surface":[1],"hide":[],"challenge":[1,0]},{"text":"Hand out the reading so they can see who's right","next":"reflect-flat","good":false,"lookFor":"swh-reading-peers-first","debrief":"The reading arrives as a verdict. Aisha never checks her clear water against her own counts, and the groups never discover how their claims connect.","surface":[],"hide":[1],"challenge":[]}]},{"id":"pair-flat","phase":"reading","when":"Lesson 6 · comparing claims","situation":"Groups swap books with the bench next door. Most claims say a substance is “good” or “bad”, and the talk is brief.","said":{"who":"Aisha","text":"“Our water looked clean, so the salt probably didn't do much. The duckweed just got old.”","conception":1},"choices":[{"text":"Pair the fertiliser and salt groups and ask each what the other's cups show that theirs can't","next":"reading","good":true,"lookFor":"swh-reading-peers-first","debrief":"Setting the two groups side by side recovers some of the comparison. Aisha's group checks their counts against the plain-water cups, though you're doing more of the work than lesson 5 needed.","surface":[1],"hide":[],"challenge":[1]},{"text":"Hand out the reading so they can see who's right","next":"reflect-flat","good":false,"lookFor":"swh-reading-peers-first","debrief":"The text decides, and claims that were never defended are crossed out or kept on the book's say-so.","surface":[],"hide":[1],"challenge":[]}]},{"id":"reading","phase":"reading","when":"Lesson 6 · the reading","situation":"Now you release the reading on nutrient run-off, algal blooms and salinity in Australian waterways.","said":{"who":"Ravi","text":"“So fertiliser's bad after all. My results were wrong. I'll cross them out.”","conception":0},"choices":[{"text":"Ask what his counts show and what the reading adds that his cups couldn't, then have him rewrite his claim about the creek","next":"reflect","good":true,"lookFor":"swh-reading-not-answer-key","debrief":"Ravi keeps his counts, since the duckweed really did grow faster. He writes that in a creek, that growth can block light and then rot, using up oxygen. His claim about impact changes for a reason, and the reading has become another voice rather than a verdict.","surface":[],"hide":[],"challenge":[0]},{"text":"Tell him to copy the reading's statement in place of his claim","next":"reflect-flat","good":false,"lookFor":"swh-reading-not-answer-key","debrief":"His counts were real, and now they're crossed out. The class learns that counting was the slow way to reach what the book already held.","surface":[],"hide":[0],"challenge":[]}]},{"id":"reflect","phase":"reflection","when":"Lesson 6 · last fifteen minutes","situation":"Claims have been revised in writing. Most of the class now argue about impact on the creek, not just on the duckweed.","choices":[{"text":"Hand back the lesson 1 question sheets and ask what they first thought pollution did, what changed their mind, and what they think now","next":"end","good":true,"lookFor":"swh-reflect-has-original","debrief":"Ravi reads his lesson 1 page, “does pollution kill water plants?”, and writes that he now thinks something can help a plant and still harm a creek. That sentence is the learning, and he can see it in his own handwriting.","surface":[],"hide":[],"challenge":[0]},{"text":"Ask students to summarise what they've learned about water pollution","next":"end","good":false,"lookFor":"swh-reflect-has-original","debrief":"The summaries are accurate, but they're about creeks, not about how anyone's thinking changed. The beginning ideas never came back.","surface":[],"hide":[],"challenge":[]}]},{"id":"reflect-flat","phase":"reflection","when":"Lesson 6 · last fifteen minutes","situation":"Most books now hold the reading's statements, copied neatly. A few claims were crossed out.","choices":[{"text":"Hand back the lesson 1 sheets and ask what moved their thinking, and whether it was their counts or the reading","next":"end","good":true,"lookFor":"swh-reflect-has-original","debrief":"Several students write that the reading changed their minds, not their cups. It's honest, and it gives you something to plan around next time, but the negotiation didn't happen.","surface":[1],"hide":[],"challenge":[]},{"text":"Ask students to summarise what they've learned about water pollution","next":"end","good":false,"lookFor":"swh-reflect-has-original","debrief":"The summaries match the reading. Nobody can tell what they thought before or why it changed.","surface":[],"hide":[],"challenge":[]}]}],"endings":[{"minGood":4,"title":"Claims met each other first","text":"Claims were tied to the creek, evidence said why, and groups worked out their disagreement before the reading arrived as another voice. That's SWH working as the guide describes: the reading phase is where the learning is."},{"minGood":2,"title":"Some claims were tested, some were settled for them","text":"Parts of the routine did their job. Look at the decisions where you supplied the wording or let the reading decide. Those are the moments to plan a sentence for."},{"minGood":0,"title":"A practical with a textbook ending","text":"The class counted for a fortnight and ended up agreeing with the reading, but no claim was defended against another student. The guide's look-fors for Evidence and Reading are the place to start."}],"conceptions":["A pollutant always makes living things grow less","If something is not visible in the water, it has no effect","One container of duckweed is enough to show an effect"]},{"id":"takeaway","at":"reading","processing":"Analysis","kind":"What made the difference?","tests":"sim","title":"In every run, one kind of move did the most damage.","q":"Which?","refs":{"phaseIds":[],"lookForIds":[],"exampleIds":[],"sequenceIds":[],"misapplicationIds":["mis-swh-answer-key"]},"type":"choice","options":[{"text":"Letting two groups reach claims that pointed opposite ways","fb":"That's the point. Claims that seem to clash, from counts that don't, are what the reading phase is built for."},{"text":"Spending lesson 5 with individual students","fb":"That was a strong move. The guide says the claim-to-data link is where your time belongs."},{"text":"Handing back the lesson 1 sheets","fb":"That was a strong move. Without them, students can't see their own change."},{"text":"Letting the reading or your own wording settle a claim before students had argued it out","fb":"Yes. Every weak path started with an authority settling something students should have defended. Each one hid an idea the routine needed to challenge."}],"answer":3,"variants":[]},{"id":"reflect","at":"reflection","processing":"Metacognition","kind":"Look back","title":"Your Negotiation Day.","q":"Which decision would be hardest for you on a real placement, and what will you say in that moment?","type":"reflect","model":"Example: “Not telling Ravi about algal blooms when he writes that fertiliser is good. I'll have a question ready: ‘Your duckweed grew. What would a creek full of it look like in a month?’”"}]},{"id":"select-1-which","path":"select","track":null,"order":1,"title":"Which model, and why?","summary":"Three classes, three answers. Choose between 5E and POE, then justify the choice in the reckoner's terms.","level":"select","version":"1.0.0","status":"published","guideSection":null,"requires":[],"items":[{"id":"predict","at":"engage","processing":"Retrieval","kind":"Predict","title":"The reckoner asks eleven questions about your class before it recommends a model.","q":"Which question do you think counts most?","type":"predict","options":[{"text":"How much time you have"},{"text":"The main learning purpose"},{"text":"How independent your learners are"},{"text":"Whether there's scope for place-based learning"}],"answer":1,"reveal":"Purpose counts most: three times as much as most questions. Time and learner readiness count double, and place-based scope counts half. A model that fits your purpose but not your timetable can still come out on top, which is why the reasons behind a choice matter."},{"id":"class-yeast","at":"explore","processing":"Analysis","kind":"Choose the model","tests":"select","why":"A reason only counts if it tells the models apart. Both 5E and POE suit novices and phenomena you can see, so those true statements can't decide anything here.","type":"select","scenario":{"who":"Year 8 · Living systems","text":"You have one lesson. Your class are novice inquirers, and many of them think yeast is a non-living powder. You want to shift that idea. You have limited equipment."},"profile":{"purpose":["misc"],"time":"lesson","ready":"novice","concept":"observable","misc":"robust","res":"limited"},"candidates":["5e","poe"],"answer":"poe","reasons":[{"text":"There's only one lesson","dim":"time","ok":true},{"text":"The “yeast is a powder” idea is well documented","dim":"misc","ok":true},{"text":"The goal is to shift a misconception","dim":"purpose","ok":true},{"text":"Students can see the phenomenon in class","dim":"concept","ok":false},{"text":"The learners are novices","dim":"ready","ok":false},{"text":"POE is more engaging than 5E","dim":null,"ok":false}],"names":{"5e":"5E","poe":"Predict–Observe–Explain"},"weighing":{"rows":[{"dim":"purpose","label":"purpose","value":"Shift a robust misconception","weight":3,"scores":{"5e":2,"poe":3}},{"dim":"time","label":"timescale","value":"One lesson","weight":2,"scores":{"5e":0,"poe":3}},{"dim":"ready","label":"learner readiness","value":"Novice","weight":2,"scores":{"5e":3,"poe":3}},{"dim":"concept","label":"nature of the concept","value":"Directly observable in class","weight":1,"scores":{"5e":3,"poe":3}},{"dim":"misc","label":"alternative conceptions","value":"Robust and well documented","weight":1,"scores":{"5e":2,"poe":3}},{"dim":"res","label":"practical resources","value":"Limited equipment","weight":1,"scores":{"5e":2,"poe":3}}],"fits":{"5e":63,"poe":100}},"nested":null},{"id":"class-cells","at":"explain","processing":"Analysis","kind":"Choose the model","tests":"select","type":"select","scenario":{"who":"Year 8 · Cells and classification","text":"You have an eight-lesson unit. You want students to explain living things with a model of the cell and to get better at investigating with microscopes and data. They're developing inquirers."},"profile":{"purpose":["model","investigate"],"time":"unit","ready":"developing","concept":"instrument","misc":"some","ws":["4","5","6"],"assess":"explanation"},"candidates":["5e","poe"],"answer":"5e","reasons":[{"text":"There's a whole unit to work with","dim":"time","ok":true},{"text":"The aim is to explain with models and learn to investigate","dim":"purpose","ok":true},{"text":"Cells can only be seen with instruments","dim":"concept","ok":true},{"text":"The learners are developing inquirers","dim":"ready","ok":false},{"text":"You need conceptual explanations as evidence of learning","dim":"assess","ok":false},{"text":"5E is the model most schools use","dim":null,"ok":false}],"names":{"5e":"5E","poe":"Predict–Observe–Explain"},"weighing":{"rows":[{"dim":"purpose","label":"purpose","value":"Explain a phenomenon with a model; Learn to investigate","weight":3,"scores":{"5e":2.5,"poe":1}},{"dim":"time","label":"timescale","value":"A unit (6–15 lessons)","weight":2,"scores":{"5e":3,"poe":1}},{"dim":"ready","label":"learner readiness","value":"Developing","weight":2,"scores":{"5e":3,"poe":3}},{"dim":"concept","label":"nature of the concept","valu
