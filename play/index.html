 and “Our results”. Groups fill them neatly and move on to the argumentation session."},"hint":"Which of the three parts has no box?","why":"The template itself leaves out the justification, so the reasoning stays in students' heads, where no one can critique it.","refs":{"phaseIds":[],"lookForIds":[],"exampleIds":["adi-tentative-argument-neg-no-justification"],"sequenceIds":[],"misapplicationIds":[]},"type":"diagnose","answer":"mis-adi-no-justification","distractors":["mis-adi-closed-question","mis-adi-teacher-judges","mis-adi-given-method"],"variants":[]},{"id":"lf-critique","at":"argumentation","processing":"Analysis","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Year 9 · Round robin","text":"Visitors to each whiteboard say things like “Your chart is really neat” and “We got the same thing”, then move on. The presenters' logs are empty."},"hint":"The talk is friendly. What is it about?","why":"Polite agreement isn't critique. Stems such as “How many readings did you take at each tone?” point students at evidence and justification.","type":"lookfor","answer":"adi-critique-quality","distractors":["adi-talk-norms","adi-three-part","adi-concept-consolidated"],"strong":false,"variants":[]},{"id":"move","at":"argumentation","processing":"Knowledge utilisation","kind":"Teacher move","tests":"argumentation","vignette":{"who":"During the round robin","text":"A presenter says: “Foam works best. It's the softest, so it soaks up the sound.” The group only tested the high tone."},"q":"What is the best move?","refs":{"phaseIds":[],"lookForIds":["adi-critique-quality"],"exampleIds":[],"sequenceIds":[],"misapplicationIds":[]},"type":"choice","options":[{"text":"Send over a visitor from a group that tested the low tone, and ask the presenter what their own data can and can't show","fb":"Yes. Data from another group challenges the claim, and the presenter has to narrow it. The guide pairs groups that tested different tones for exactly this."},{"text":"Tell the group that timber did better on low tones","fb":"That's adjudicating. Authority replaces evidence, and the class learns to wait for the teacher's verdict."},{"text":"Stop the session and explain absorption to the whole class","fb":"The science belongs in the reflective discussion, after the arguments have been tested against each other."},{"text":"Praise the clear claim and move on","fb":"The claim goes unchallenged, and “soft always wins” leaves the lesson intact."}],"answer":0,"variants":[]},{"id":"lf-norms","at":"argumentation","processing":"Comprehension","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Year 9 · Round robin","text":"A visitor starts, “Your group always…”, stops, looks at the stem chart on the wall and says instead, “What makes you think the meter wasn't picking up the next group's speaker?” The presenter disagrees, and both stay calm."},"type":"lookfor","answer":"adi-talk-norms","distractors":["adi-revision-record","adi-criteria-shared","adi-concept-consolidated"],"strong":true,"variants":[]},{"id":"dx-judge","at":"argumentation","processing":"Analysis","kind":"Diagnose the plan","tests":"misapplication","vignette":{"who":"Another pre-service teacher's ADI · Lesson 5","text":"Each group presents its whiteboard to the class. After each one, the teacher says whether the group got it right, the class claps, and the next group starts."},"refs":{"phaseIds":[],"lookForIds":[],"exampleIds":["adi-argue-neg-presentations"],"sequenceIds":[],"misapplicationIds":[]},"type":"diagnose","answer":"mis-adi-teacher-judges","distractors":["mis-adi-no-justification","mis-adi-skip-review","mis-adi-closed-question"],"variants":[]},{"id":"lf-revision","at":"argumentation","processing":"Comprehension","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Year 9 · End of lesson 5","text":"One group's log reads: “Asked: did you test a low tone? Changed: our claim now says foam was best for the high tone only, and we added the other group's low-tone readings as a question we can't answer yet.”"},"hint":"This is a whiteboard argument, not a written report.","type":"lookfor","answer":"adi-revision-record","distractors":["adi-critique-quality","adi-revision-used","adi-three-part"],"strong":true,"variants":[]},{"id":"spot-discuss","at":"reflective-discussion","processing":"Comprehension","kind":"Spot the stage","tests":"reflective-discussion","vignette":{"who":"Year 9 · Lesson 6","text":"Using the class's results, the teacher works through amplitude and loudness, frequency and pitch, and reflection, absorption and transmission. Then the class names what changed claims in the session: readings from another group, not who said them."},"q":"Which ADI stage is this?","refs":{"phaseIds":[],"lookForIds":["adi-concept-consolidated","adi-nos-explicit"],"exampleIds":[],"sequenceIds":[],"misapplicationIds":[]},"type":"spot","answer":"reflective-discussion","among":["argumentation","reflective-discussion","report"],"fb":{"argumentation":"The critique has finished. The teacher is now consolidating.","reflective-discussion":"The science is consolidated and the nature-of-science idea is named. That's the reflective discussion.","report":"No one is writing yet. The reports come next, built on what the class agreed here."},"variants":[]},{"id":"nest","at":"reflective-discussion","processing":"Knowledge utilisation","kind":"Nest it","tests":"nesting","q":"A 5E unit on waves needs argument from evidence. In which 5E phase does an ADI routine begin?","why":"ADI runs across Explore and Explain: the investigation and argument are the exploring, and the reflective discussion becomes part of the explaining.","type":"nest","model":"adi","host":"5e","answer":"explore","how":"Run ADI as the Explore and Explain phases when the sequence targets argument from evidence."},{"id":"reflect","at":"reflective-discussion","processing":"Metacognition","kind":"Look back","title":"Hold the science back.","q":"Why does the teacher wait until the reflective discussion to explain absorption, even when a group is plainly wrong in lesson 5?","type":"reflect","model":"Example: “If I correct them in lesson 5, the class learns to wait for me. Holding back lets another group's low-tone data do the correcting, and then lesson 6 has their argument to build on.”","recall":"predict"}]},{"id":"adi-3-review","path":"adi","track":null,"order":3,"title":"Review, then revise","summary":"Individual reports, anonymous review with accountable reviewers, and revision that shows. The stages most often cut, and what cutting them costs.","level":"explain","version":"1.0.0","status":"published","guideSection":"sequences","requires":[],"items":[{"id":"predict","at":"report","processing":"Retrieval","kind":"Predict","title":"A Year 10 class has drafted individual reports on the two schoolyard sites. There's one lesson left before they submit.","q":"Which use of that lesson will most improve the final reports?","why":"Teacher comments are the familiar choice, but they arrive as a verdict. ADI's last three stages make students do the judging, which is the scientific practice the routine is teaching.","type":"predict","options":[{"text":"The teacher writes comments on every draft"},{"text":"Anonymous peer review against the shared criteria, with the teacher returning weak reviews"},{"text":"Hand out the marking rubric and let students check their own drafts"},{"text":"Give students the lesson to rewrite on their own"}],"answer":1,"reveal":"Peer review against shared criteria improves the reports, and it improves the reviewers too: applying the criteria to someone else's argument shows students what their own is missing. It only works when reviews must give reasons and the teacher holds reviewers to that."},{"id":"lf-individual","at":"report","processing":"Comprehension","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Year 10 · Lesson 7","text":"Each group submits one shared document, with three names at the top and the sections split between them."},"why":"Share the data, write individually. A split document hides whose reasoning is whose, so no one's argument can be reviewed or assessed.","type":"lookfor","answer":"adi-individual-writing","distractors":["adi-report-structure","adi-review-rubric","adi-revision-used"],"strong":false,"variants":[]},{"id":"lf-structure","at":"report","processing":"Analysis","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Year 10 · A draft report","text":"Aim, method, results, conclusion. The conclusion reads “Site B had more animals, so it is more diverse.” Nowhere does the report say why the group chose its sampling method, or why its evidence supports the claim."},"hint":"An ADI report answers three guiding questions. Which ones are missing here?","type":"lookfor","answer":"adi-report-structure","distractors":["adi-individual-writing","adi-review-rubric","adi-final-standard"],"strong":false,"variants":[]},{"id":"dx-skip","at":"report","processing":"Analysis","kind":"Diagnose the plan","tests":"misapplication","vignette":{"who":"A pre-service teacher's ADI","text":"Two lessons were lost to a swimming carnival. The teacher goes from the whiteboards straight to a report that students hand in for marking."},"why":"The stages cut are the ones that make it ADI. The guide's fix is to plan 6–8 lessons from the start and shorten data collection, not argument or review.","type":"diagnose","answer":"mis-adi-skip-review","distractors":["mis-adi-teacher-judges","mis-adi-group-report","mis-adi-no-justification"],"variants":[]},{"id":"feedback","at":"peer-review","processing":"Analysis","kind":"Usable feedback","tests":"peer-review","title":"A reviewer's comments on an anonymous report.","q":"Which comments would help the author revise? Select every one that would.","refs":{"phaseIds":[],"lookForIds":["adi-review-rubric"],"exampleIds":[],"sequenceIds":[],"misapplicationIds":[]},"type":"multi","options":[{"text":"Good job! Really interesting.","ok":false,"fb":"General praise gives the author nothing to act on."},{"text":"Criterion 3 not met: your justification says the leaf litter has “more life” but not why kinds count more than totals. Add a sentence on what diversity measures.","ok":true,"fb":"Names the criterion, the gap and a fix."},{"text":"Your method says one trap per site. Your argument should say how that limits your claim.","ok":true,"fb":"Points to evidence in the author's own report and asks for a qualified claim."},{"text":"I'd have used more colours in the graph.","ok":false,"fb":"A preference, not a criterion. It won't make the argument stronger."},{"text":"Criterion 2 met: your chart compares kinds per site, which answers the guiding question.","ok":true,"fb":"A judgement with its reason. The author learns what to keep."}]},{"id":"lf-rubric","at":"peer-review","processing":"Comprehension","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Year 10 · Lesson 8","text":"The review sheet lists the three criteria with a yes or no box beside each. There's no space for comments."},"refs":{"phaseIds":[],"lookForIds":[],"exampleIds":["adi-write-neg-ticks"],"sequenceIds":[],"misapplicationIds":[]},"type":"lookfor","answer":"adi-review-rubric","distractors":["adi-individual-writing","adi-report-structure","adi-final-standard"],"strong":false,"variants":[]},{"id":"lf-accountable","at":"peer-review","processing":"Comprehension","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Year 10 · Lesson 8","text":"Before any review goes back to its author, the teacher reads three at random and returns two to their reviewers: “Say what would fix criterion 3, not just that it's missing.”"},"refs":{"phaseIds":[],"lookForIds":[],"exampleIds":["adi-write-pos-review"],"sequenceIds":[],"misapplicationIds":[]},"type":"lookfor","answer":"adi-review-accountable","distractors":["adi-review-rubric","adi-final-standard","adi-revision-used"],"strong":true,"variants":[]},{"id":"spot-revise","at":"revision","processing":"Comprehension","kind":"Spot the stage","tests":"revision","vignette":{"who":"Year 10 · End of lesson 8","text":"Beside each review point, authors write “accepted: rewrote paragraph 3” or “not changed, because…”, then submit the final report with the review stapled to it."},"q":"Which ADI stage is this?","refs":{"phaseIds":[],"lookForIds":["adi-revision-used"],"exampleIds":[],"sequenceIds":[],"misapplicationIds":[]},"type":"spot","answer":"revision","among":["report","peer-review","revision"],"fb":{"report":"The reports were written in lesson 7. Now they're being changed in response to review.","peer-review":"The reviews are done. Authors are now responding to them.","revision":"Authors respond to each point, accepting or rebutting it, and submit with the review attached. That's revision."},"variants":[]},{"id":"lf-final","at":"revision","processing":"Analysis","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Year 10 · Marking","text":"Final reports are marked on a new 20-point rubric covering presentation, spelling, a labelled graph and a conclusion. The claim, evidence and justification criteria from lesson 1 don't appear."},"why":"Students spent eight lessons working to one standard. Marking to a different one tells them the argument wasn't what counted.","type":"lookfor","answer":"adi-final-standard","distractors":["adi-revision-used","adi-review-rubric","adi-criteria-shared"],"strong":false,"variants":[]},{"id":"order","at":"revision","processing":"Comprehension","kind":"Sequence it","tests":"sequence","title":"Put the last three stages in order.","q":"Tap each step in the order you'd teach it. Tap a placed step to remove it.","type":"order","steps":[{"text":"Each student drafts their own report from the group's shared data","phaseId":"report"},{"text":"The teacher checks each draft's justification paragraph","phaseId":"report"},{"text":"Reports are anonymised and swapped with another group","phaseId":"peer-review"},{"text":"Reviewers comment on each criterion, saying why or what would fix it","phaseId":"peer-review"},{"text":"The teacher samples reviews and returns any that aren't specific enough","phaseId":"peer-review"},{"text":"Authors respond to every review point","phaseId":"revision"},{"text":"Final reports are submitted with the review attached","phaseId":"revision"}],"variants":[]},{"id":"reflect","at":"revision","processing":"Metacognition","kind":"Look back","title":"Your review guide.","q":"Which three criteria would you put on the review guide for the leaf-litter investigation, and why those three?","type":"reflect","model":"Example: “A claim limited to what the traps can show; evidence that compares kinds, not totals; and a justification that explains why kinds measure diversity. Those three are where the target conceptions hide.”","recall":"predict"}]},{"id":"adi-4-build","path":"adi","track":null,"order":4,"title":"Build it: ADI","summary":"Build a 6–8 lesson ADI routine for a Year 10 waves unit from activity cards, then read what the guide's look-fors say about it.","level":"design","version":"1.0.0","status":"published","guideSection":"checklist","requires":[],"items":[{"id":"question","at":"task-question","processing":"Analysis","kind":"Set the question","tests":"task-question","title":"Your routine: Year 10, 6–8 lessons inside a waves unit. Many students think soft materials always block sound best.","q":"Which guiding question gives the routine the most to argue about?","refs":{"phaseIds":[],"lookForIds":["adi-question-open"],"exampleIds":[],"sequenceIds":[],"misapplicationIds":[]},"type":"choice","options":[{"text":"Which material best reduces the sound reaching a classroom, and does the answer depend on the sound?","fb":"Yes. Groups that test different tones can reach different defensible answers, which is exactly what the argumentation session needs."},{"text":"Does foam reduce sound?","fb":"One obvious answer, so there's nothing to argue about. The guide calls this a closed guiding question."},{"text":"Which material is the best sound insulator?","fb":"Closer, but without the second half every group can agree on one winner. Asking whether it depends on the sound is what makes groups disagree."},{"text":"What is sound?","fb":"This asks for a definition. Students can answer it without investigating anything."}],"answer":0,"variants":[]},{"id":"rubric","at":"task-question","processing":"Retrieval","kind":"Before you build","title":"What the report will look for","type":"concept","lead":"The board checks your plan against the ADI guide's look-fors and misapplications. A card counts only in the stage whose job it does, and some cards look efficient but bring a known problem with them. Leaving the argumentation session or peer review empty is the cut the guide warns about most.","rows":[{"phaseId":"task-question","does":"An open question, criteria shared, a tool talk.","move":"Watch for: a question with one answer."},{"phaseId":"design-data","does":"Groups design the method; the teacher checks it.","move":"Watch for: one method sheet for everyone."},{"phaseId":"tentative-argument","does":"Claim, evidence and a justification on a whiteboard.","move":"Watch for: a claim above a results table."},{"phaseId":"argumentation","does":"Every argument critiqued by students, and revised.","move":"Watch for: the teacher deciding who's right."},{"phaseId":"reflective-discussion","does":"The science consolidated, and how it was settled named.","move":"Watch for: ending on competing claims."},{"phaseId":"report","does":"Every student writes their own argument.","move":"Watch for: one report per group."},{"phaseId":"peer-review","does":"Anonymous review, with reviewers held to account.","move":"Watch for: ticks and “good job”."},{"phaseId":"revision","does":"Authors respond to every review point.","move":"Watch for: a new rubric at the end."}]},{"id":"board","at":"design-data","processing":"Knowledge utilisation","kind":"Build the plan","tests":"design","title":"Build your ADI routine.","q":"Place one activity in each stage. Not every card belongs in a strong routine.","hint":"Read each card for what students actually do, not the stage it sounds like.","why":"Eight stage headings are easy to fill. Whether the routine is ADI depends on who designs the method, who decides which argument holds, and whether review changes anything.","type":"build","brief":{"who":"Year 10 · Waves and motion · 6–8 lessons inside the unit","text":"Guiding question: which material best reduces the sound reaching a classroom, and does the answer depend on the sound?"},"cards":[{"id":"tq-open","text":"Pose the guiding question, run a tool talk on the tone generator and meter app, and display the claim, evidence and justification criteria","kind":"activity","does":"task-question","features":["adi-question-open"],"flaws":[]},{"id":"tq-closed","text":"Ask “Does foam reduce sound?” and demonstrate the set-up with foam","kind":"activity","does":"task-question","features":[],"flaws":["mis-adi-closed-question"]},{"id":"dd-own","text":"Groups choose their linings, tones and number of readings, then talk the plan through with the teacher for safety and feasibility","kind":"activity","does":"design-data","features":["adi-student-designed","adi-plan-checkpoint"],"flaws":[]},{"id":"dd-sheet","text":"Every group follows one method sheet, testing foam, felt and cardboard at one tone, one reading each","kind":"activity","does":"design-data","features":[],"flaws":["mis-adi-given-method"]},{"id":"ta-board","text":"Groups graph the reduction for each lining and tone, and build a whiteboard with a claim, the graph and a justification using wave ideas","kind":"activity","does":"tentative-argument","features":["adi-three-part","adi-justification"],"flaws":[]},{"id":"ta-table","text":"Groups write their claim at the top of a whiteboard and copy their results table underneath","kind":"activity","does":"tentative-argument","features":[],"flaws":["mis-adi-no-justification"]},{"id":"arg-robin","text":"Round robin with displayed critique stems, pairing groups that tested different tones; each group logs the questions it was asked and what it changed","kind":"activity","does":"argumentation","features":["adi-critique-quality","adi-revision-record"],"flaws":[]},{"id":"arg-present","text":"Each group presents to the class, the teacher says which result is right, and the next group starts","kind":"activity","does":"argumentation","features":[],"flaws":["mis-adi-teacher-judges"]},{"id":"rd-consolidate","text":"The teacher consolidates amplitude, frequency, reflection, absorption and transmission from the class's results, and tackles “soft always wins” head on","kind":"activity","does":"reflective-discussion","features":["adi-concept-consolidated"],"flaws":[]},{"id":"rep-own","text":"Each student writes their own report within a word limit, including a recommendation for a real classroom","kind":"activity","does":"report","features":["adi-individual-writing"],"flaws":[]},{"id":"rep-group","text":"Each group writes one shared report, splitting the sections between members","kind":"activity","does":"report","features":[],"flaws":["mis-adi-group-report"]},{"id":"pr-sampled","text":"Anonymised reports go to another group with a review guide; the teacher samples reviews and returns vague ones before authors see them","kind":"activity","does":"peer-review","features":["adi-review-accountable"],"flaws":[]},{"id":"pr-swap","text":"Students swap reports with the person beside them and tick a checklist","kind":"activity","does":"peer-review","features":[],"flaws":[]},{"id":"rv-respond","text":"Authors respond to every review point and submit with the review attached, marked against the same three criteria as lesson 1","kind":"activity","does":"revision","features":["adi-revision-used","adi-final-standard"],"flaws":[]},{"id":"rv-rubric","text":"Authors hand in their final report, marked on a new rubric for presentation, spelling and a labelled graph","kind":"activity","does":"revision","features":[],"flaws":[]}],"report":["adi-question-open","adi-student-designed","adi-plan-checkpoint","adi-three-part","adi-justification","adi-critique-quality","adi-revision-record","adi-concept-consolidated","adi-individual-writing","adi-review-accountable","adi-revision-used","adi-final-standard"],"missing":{"tentative-argument":"mis-adi-no-justification","argumentation":"mis-adi-skip-review","peer-review":"mis-adi-skip-review"}},{"id":"cut","at":"report","processing":"Knowledge utilisation","kind":"Teacher move","tests":"design","vignette":{"who":"Week 6 · two lessons lost","text":"An excursion takes two of your eight lessons. The routine has to fit in six."},"q":"What do you cut?","refs":{"phaseIds":[],"lookForIds":[],"exampleIds":[],"sequenceIds":[],"misapplicationIds":["mis-adi-skip-review"]},"type":"choice","options":[{"text":"Shorten data collection to one lesson, and keep every stage","fb":"Yes. The guide's fix is to shorten data collection rather than argument or review. Fewer readings make a narrower claim, which is itself something to argue about."},{"text":"Drop the peer review and mark the reports yourself","fb":"That cuts one of the stages that make it ADI. Students lose the review that improves both their report and their own judgement."},{"text":"Drop the argumentation session and go straight to reports","fb":"Without critique, nobody's argument is tested. This is the cut the guide warns about most."},{"text":"Skip the whiteboards and have groups write reports from their tables","fb":"The justification never gets drafted or critiqued, so the reports inherit the gap."}],"answer":0,"variants":[]},{"id":"reflect","at":"revision","processing":"Metacognition","kind":"Look back","title":"Your report, your routine.","q":"Which look-for in your report would be hardest to meet on placement, and what would you plan differently because of it?","type":"reflect","model":"Example: “Reviewers held to account. I'd never have planned time to sample reviews, so I'd build ten minutes into lesson 8 to read three and send weak ones back.”"}]},{"id":"adi-5-argument-day","path":"adi","track":null,"order":5,"title":"Argument Day","summary":"Run the whiteboards, the round robin and the reflective discussion with a simulated Year 10 class. Every move decides whose argument gets tested.","level":"design","version":"1.0.0","status":"published","guideSection":"sequences","requires":[],"items":[{"id":"briefing","at":"tentative-argument","processing":"Retrieval","kind":"How Argument Day works","title":"Three lessons, four decisions","type":"concept","lead":"You're on placement with a Year 10 class, in the middle of the ADI routine on sound from the guide. Groups have their data. At four moments you choose what to do next. Students voice the ideas the guide says to expect, and your choices decide which ideas surface, which stay hidden and which get challenged by other students' evidence.","rows":[{"phaseId":"tentative-argument","does":"Lesson 4: groups build their whiteboards.","move":"Ask why the evidence counts."},{"phaseId":"argumentation","does":"Lesson 5: the round robin.","move":"Let evidence do the correcting."},{"phaseId":"reflective-discussion","does":"Lesson 6: the reflective discussion.","move":"Consolidate the science, and how it was settled."}]},{"id":"sim","at":"tentative-argument","processing":"Knowledge utilisation","kind":"Argument Day","tests":"sim","type":"sim","cast":{"who":"Year 10 · Waves and motion","text":"25 students in six groups. Groups chose their own linings and tones, so their data don't all agree."},"sequenceId":"seq-s5-sound","start":"board","nodes":[{"id":"board","phase":"tentative-argument","when":"Lesson 4 · whiteboards","situation":"Group 2 tested foam, felt and timber with a high tone. Their whiteboard says “Claim: foam is best” above a copy of their results table.","said":{"who":"Jai, Group 2","text":"“Foam's the softest, so it soaks up the sound. Obviously.”","conception":1},"choices":[{"text":"Point to the criteria and ask, “Why does your evidence count? Write the ‘because’ on the board, in your words.”","next":"round","good":true,"lookFor":"adi-justification","debrief":"Jai writes “because soft things absorb sound”. It isn't right yet, but it's on the board where other students can test it, which is what the argumentation session is for.","surface":[1],"hide":[],"challenge":[]},{"text":"Tell them that foam's air pockets absorb high tones, and suggest they add that as their justification","next":"round-quiet","good":false,"lookFor":"adi-justification","debrief":"The physics is right, but the justification is now yours. Jai's “soft always wins” never reaches the board, so nobody gets to argue with it.","surface":[],"hide":[1],"challenge":[]}]},{"id":"round","phase":"argumentation","when":"Lesson 5 · round robin","situation":"Group 5 tested a low tone only, and found timber cut more sound than foam. Their presenter is explaining why to visitors from Group 2.","said":{"who":"Mia, Group 5","text":"“Timber's solid, so sound can't get through it. That's why it won.”","conception":0},"choices":[{"text":"Ask both groups, “What does the other group's data show that yours can't?”, and have them log the answer","next":"logs","good":true,"lookFor":"adi-critique-quality","debrief":"Group 2 sees foam lose at a low tone, and Group 5 has to explain why its meter still read some sound through the timber. The data are doing the correcting, not you.","surface":[0],"hide":[],"challenge":[1]},{"text":"Tell the class that timber was better at low tones and foam at high tones, so both groups are right","next":"discuss-flat","good":false,"lookFor":"adi-critique-quality","debrief":"It's a fair summary, but you've adjudicated. The guide calls this the teacher adjudicating. Mia's idea that sound can't pass through solids is never questioned, and critique stops.","surface":[],"hide":[0],"challenge":[]}]},{"id":"round-quiet","phase":"argumentation","when":"Lesson 5 · round robin","situation":"Group 2's board now carries your justification. Visitors read it, nod and move on. Nobody asks Group 2 anything.","said":{"who":"A visitor","text":"“Yours is right. The teacher wrote that bit.”","conception":1},"choices":[{"text":"Ask every visitor to leave each board one question about evidence the group hasn't got yet, using the stems on the wall","next":"logs","good":true,"lookFor":"adi-critique-quality","debrief":"A visitor asks Group 2 whether foam beat timber at a low tone. They didn't test one. The question brings “soft always wins” back into the open, a lesson later than it could have been.","surface":[1],"hide":[],"challenge":[]},{"text":"Keep moving between groups. The session is running smoothly.","next":"discuss-flat","good":false,"lookFor":"adi-critique-quality","debrief":"Smooth isn't the same as working. Agreement without questions is the weak evidence the look-for describes, and no argument changes.","surface":[],"hide":[],"challenge":[]}]},{"id":"logs","phase":"argumentation","when":"End of lesson 5","situation":"Groups are packing up. Group 2's whiteboard still says “foam is best”, though two visitors challenged it with low-tone readings.","choices":[{"text":"Give groups five minutes to log the questions that changed their thinking and rewrite their claim","next":"discuss","good":true,"lookFor":"adi-revision-record","debrief":"Group 2 narrows its claim to “foam cut the high tone most” and logs the low-tone question as the reason. Revision is visible, and the lesson 6 discussion has something to build on.","surface":[],"hide":[],"challenge":[1]},{"text":"Photograph the whiteboards for marking, and start the reflective discussion next lesson","next":"discuss-flat","good":false,"lookFor":"adi-revision-record","debrief":"The challenge happened, but nothing records it. Next lesson the boards still say what they said before the session.","surface":[],"hide":[],"challenge":[]}]},{"id":"discuss","phase":"reflective-discussion","when":"Lesson 6 · reflective discussion","situation":"The class's results are on the screen. Most groups have narrowed their claims to the tones they tested.","said":{"who":"Ella","text":"“The high tone was louder, so it's harder to block.”","conception":2},"choices":[{"text":"Use the class's data to separate loudness (amplitude, in decibels) from pitch (frequency), then consolidate reflection, absorption and transmission, and name what changed claims on Tuesday","next":"end","good":true,"lookFor":"adi-concept-consolidated","debrief":"Ella's idea meets the class's own readings, and Mia's timber result becomes an example of transmission. Students leave with the accepted science and know it was another group's evidence, not the teacher, that moved their claims.","surface":[],"hide":[],"challenge":[2,0]},{"text":"Hand out a summary sheet of sound facts and start the reports","next":"end","good":false,"lookFor":"adi-concept-consolidated","debrief":"The facts are on paper, but Ella's mix-up of loudness and pitch goes straight into her report, where her reviewer may not catch it.","surface":[],"hide":[2],"challenge":[]}]},{"id":"discuss-flat","phase":"reflective-discussion","when":"Lesson 6 · reflective discussion","situation":"Several whiteboards still say soft materials always win, and one says sound can't go through timber. Few claims changed in the session.","said":{"who":"Ella","text":"“The high tone was louder, so it's harder to block.”","conception":2},"choices":[{"text":"Put two contradictory whiteboards side by side and ask what evidence would settle it, then consolidate the wave ideas from the class's readings","next":"end","good":true,"lookFor":"adi-concept-consolidated","debrief":"Setting the boards against each other recovers some of the argument the session missed. The ideas finally meet evidence, though later and with you doing more of the work.","surface":[1],"hide":[],"challenge":[1,2]},{"text":"Explain the right answers, and move on to the reports","next":"end","good":false,"lookFor":"adi-concept-consolidated","debrief":"The reports will repeat your explanation. The ideas students started with were never tested, so they'll be back the next time sound comes up.","surface":[],"hide":[],"challenge":[]}]}],"endings":[{"minGood":4,"title":"Evidence did the arguing","text":"Every idea surfaced on a whiteboard, met another group's data and changed, and you consolidated the science at the end. That's ADI working as the guide describes: the teacher holds the science back until the argument has run."},{"minGood":2,"title":"Some arguments ran, some were settled for them","text":"Parts of the routine did their job. Look at the decisions where you supplied the answer or let agreement pass for critique. Those are the moments to plan a sentence for."},{"minGood":0,"title":"A practical with a presentation","text":"The class did an investigation and heard the right answers, but no argument was tested by another student. The guide's look-fors for the whiteboard and the argumentation session are the place to start."}],"conceptions":["Sound cannot travel through solids","Soft materials always block sound best","Loudness and pitch are the same thing"]},{"id":"takeaway","at":"reflective-discussion","processing":"Analysis","kind":"What made the difference?","tests":"sim","title":"In every run, one kind of move did the most damage.","q":"Which?","refs":{"phaseIds":[],"lookForIds":[],"exampleIds":[],"sequenceIds":[],"misapplicationIds":["mis-adi-teacher-judges"]},"type":"choice","options":[{"text":"Supplying the justification or the verdict before students had argued it out","fb":"Yes. Every weak path started with the teacher settling something students should have tested. Each one hid an idea the routine needed to challenge."},{"text":"Letting groups disagree in the round robin","fb":"Disagreement is the point. The strong moves made it sharper by pairing groups whose data conflict."},{"text":"Asking students to log what changed","fb":"That was a strong move. It makes revision visible and gives lesson 6 something to build on."},{"text":"Consolidating the science in lesson 6","fb":"The guide plans for it. Holding the science back until lesson 6 is what lets the argument run first."}],"answer":0,"variants":[]},{"id":"reflect","at":"reflective-discussion","processing":"Metacognition","kind":"Look back","title":"Your Argument Day.","q":"Which decision would be hardest for you on a real placement, and what will you say in that moment?","type":"reflect","model":"Example: “Not telling Mia that sound goes through solids. I'll have a question ready: ‘Your meter still read something. Where did that sound come from?’”"}]},{"id":"swh-1-spinners","path":"swh","track":null,"order":1,"title":"Slow it down","summary":"A paper spinner, a stopwatch and seven questions in place of a lab report. Learn what each SWH phase has to do.","level":"recognise","version":"1.0.0","status":"published","guideSection":"sequences","requires":[],"items":[{"id":"case","at":"beginning-ideas","processing":"Retrieval","kind":"The case","title":"What makes a falling object slow down?","type":"case","setting":{"who":"Year 7 · Forces · Physics · five lessons","text":"A Year 7 class is starting forces. Instead of a demonstration and a worksheet, the teacher gives them paper spinners, simple paper helicopters that twirl as they fall, and lets each student ask their own question about what makes one fall slowly."},"lead":"The routine is the Science Writing Heuristic. Students don't write a lab report. Each one answers seven questions about their own investigation, from “What are my questions?” to “How have my ideas changed?”. This lesson walks through all seven with this class.","you":"You're a pre-service teacher on placement, watching the routine from the first lesson to the last."},{"id":"predict","at":"beginning-ideas","processing":"Retrieval","kind":"Predict","title":"A Year 7 teacher drops two things from the same height: a paper spinner, and a crumpled ball made from an identical sheet of paper. Same paper, same mass.","q":"What happens?","why":"“Air is nothing, so it can't push on anything” is one of this sequence's target conceptions. SWH asks students to write ideas like this down first and keep them, so they can see later what changed their minds.","type":"predict","options":[{"text":"They land together, because they weigh the same"},{"text":"The ball lands first, because the air pushes back harder on the spinner"},{"text":"The spinner lands first, because spinning speeds it up"},{"text":"The ball lands first, because crumpling makes it heavier"}],"answer":1,"reveal":"The ball hits the floor well before the spinner. Same mass, so the difference has to come from the air, which pushes back on the spinner's wings much harder than on the small ball. Classes are usually surprised, and that surprise is where students' own questions come from."},{"id":"concept","at":"beginning-ideas","processing":"Retrieval","kind":"The model","title":"The Science Writing Heuristic","type":"concept","lead":"SWH replaces the lab report with seven questions that make a student's reasoning visible. It's a multi-lesson routine of about 4–6 lessons that sits inside a unit, in three movements: in the lab, make the claim, then test it against others.","rows":[{"phaseId":"beginning-ideas","does":"What are my questions? Each student writes their own, after trying a spinner.","move":"Teacher move: conference questions for testability, and keep them."},{"phaseId":"tests","does":"What did I do? Groups plan a test of the change their question named.","move":"Teacher move: check plans for safety and feasibility, not correctness."},{"phaseId":"observations","does":"What did I see? Every time, and what happened on each drop.","move":"Teacher move: ask for repeats and the odd drops."},{"phaseId":"claims","does":"What can I claim? An individual claim someone could disagree with.","move":"Teacher move: read each claim for whether it can be argued."},{"phaseId":"evidence","does":"How do I know? Why do these times support the claim?","move":"Teacher move: spend your time here, one student at a time."},{"phaseId":"reading","does":"How do my ideas compare? Peers first, then a text on air resistance.","move":"Teacher move: release the reading only after groups compare."},{"phaseId":"reflection","does":"How have my ideas changed? Beginning questions handed back.","move":"Teacher move: ask about their thinking, not the topic."}],"cite":"Keys, C. W., Hand, B., Prain, V. & Collins, S. (1999). Using the Science Writing Heuristic as a tool for learning from laboratory investigations in secondary science. Journal of Research in Science Teaching, 36(10)."},{"id":"lf-question","at":"beginning-ideas","processing":"Comprehension","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Year 7 · Lesson 1","text":"After trying her spinner a few times, Mei writes: “Would longer wings make it spin faster and fall slower, because they catch more air?” The teacher asks how she'd know it was slower, and Mei adds: “Time lots of drops.”"},"hint":"Whose question is it, and where did it come from?","why":"The question is Mei's, from her own spinner, and the short conference made it testable without replacing it. Her reason, that wings “catch more air”, is a beginning idea worth keeping for the last lesson.","type":"lookfor","answer":"swh-begin-own-question","distractors":["swh-begin-kept","swh-tests-follows-question","swh-claim-individual"],"strong":true,"variants":[]},{"id":"spot-tests","at":"tests","processing":"Comprehension","kind":"Spot the phase","tests":"tests","vignette":{"who":"Year 7 · Lesson 2","text":"Mei's group plans spinners with 6, 8, 10 and 12 cm wings, the same paper and the same paperclip, dropped from the top of the stairwell five times each. The teacher asks where they'll stand to drop them safely, and leaves the rest of the plan alone."},"q":"Which SWH phase is this?","refs":{"phaseIds":[],"lookForIds":["swh-tests-follows-question"],"exampleIds":[],"sequenceIds":[],"misapplicationIds":[]},"type":"spot","answer":"tests","among":["beginning-ideas","tests","observations"],"fb":{"beginning-ideas":"The question was written in lesson 1. Now the group is deciding how to answer it.","tests":"Yes. The method follows from their own question, and the teacher checks it for safety and feasibility without redesigning it.","observations":"Nothing has been dropped yet. This is the plan."},"variants":[]},{"id":"lf-obs","at":"observations","processing":"Analysis","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Year 7 · Lesson 3","text":"A results sheet has one column, headed “What happened”. It reads: “Longer wings were slower because they catch more air. The 12 cm one was faulty.”"},"hint":"Which parts did they see, and which parts did they decide?","why":"“Because they catch more air” and “faulty” are interpretations, not observations. The sheet has no times, and no record of what the 12 cm spinner actually did. A second column for “What we think it means” keeps those ideas where they can be questioned later.","type":"lookfor","answer":"swh-obs-separate","distractors":["swh-claim-arguable","swh-evidence-selected","swh-tests-follows-question"],"strong":false,"variants":[]},{"id":"spot-claim","at":"claims","processing":"Comprehension","kind":"Spot the phase","tests":"claims","vignette":{"who":"Year 7 · Lesson 4","text":"Mei's group timed each design five times from the top of the stairwell. Working alone, Mei writes: “Longer wings made the spinner fall more slowly up to 10 cm. At 12 cm the wings flopped, it stopped spinning, and it fell faster.”"},"q":"Which SWH phase is this?","refs":{"phaseIds":[],"lookForIds":["swh-claim-arguable","swh-claim-individual"],"exampleIds":[],"sequenceIds":[],"misapplicationIds":[]},"table":{"caption":"Mei's group, 2.2 m drop, mean of five drops","head":["Wing length","Fall time","What happened"],"rows":[["6 cm","1.3 s","Spun fast"],["8 cm","1.6 s","Spun"],["10 cm","1.9 s","Spun slowly"],["12 cm","1.2 s","Wings flopped; barely spun"]]},"type":"spot","answer":"claims","among":["observations","claims","evidence"],"fb":{"observations":"This says what Mei thinks the results show, not each time she recorded.","claims":"Yes. An individual answer to her own question, in a form another student could disagree with.","evidence":"The evidence comes next, when Mei picks the times that support this and says why they do."},"variants":[]},{"id":"spot-reading","at":"reading","processing":"Comprehension","kind":"Spot the phase","tests":"reading","vignette":{"who":"Year 7 · Lesson 5","text":"Mei's group, who changed wing length, pairs with a group that added paperclips. They work out how both claims can be true. Only then does the teacher hand out a short reading on air resistance and on winged Banksia seeds."},"q":"Which SWH phase is this?","refs":{"phaseIds":[],"lookForIds":["swh-reading-peers-first"],"exampleIds":[],"sequenceIds":[],"misapplicationIds":[]},"type":"spot","answer":"reading","among":["evidence","reading","reflection"],"fb":{"evidence":"Each student's evidence is already written. Now it's being set against everyone else's.","reading":"Yes. Peers first, then the text, so the text is another voice in the argument rather than the answer.","reflection":"That comes last, with the beginning questions handed back."},"variants":[]},{"id":"dx-supplied","at":"beginning-ideas","processing":"Analysis","kind":"Diagnose the plan","tests":"misapplication","vignette":{"who":"A pre-service teacher's SWH · Lesson 1","text":"The worksheet opens with a printed box: “Question: Does wing length affect how long a spinner takes to fall?” Students copy it into their books, then start on the method."},"hint":"What does each student have to defend later?","why":"Every student has the same question, so nobody has a claim of their own to defend, groups don't change different things, and the final reflection has nothing personal to compare against.","type":"diagnose","answer":"mis-swh-supplied-question","distractors":["mis-swh-lost-beginnings","mis-swh-closed-practical","mis-swh-answer-key"],"variants":[]},{"id":"dx-lost","at":"reflection","processing":"Analysis","kind":"Diagnose the plan","tests":"misapplication","vignette":{"who":"Another pre-service teacher's SWH · Lesson 5","text":"The lesson ends: “Write a paragraph on how your ideas about falling objects have changed.” Lesson 1's question sheets were collected for marking a fortnight ago and haven't come back."},"why":"Without their first page in front of them, students write a summary of the topic instead of an account of their own change. The guide's fix is to photograph or keep the first page and hand it back for this phase.","refs":{"phaseIds":[],"lookForIds":["swh-reflect-has-original","swh-begin-kept"],"exampleIds":[],"sequenceIds":[],"misapplicationIds":[]},"type":"diagnose","answer":"mis-swh-lost-beginnings","distractors":["mis-swh-supplied-question","mis-swh-no-negotiation","mis-swh-evidence-recopied"],"variants":[]},{"id":"order","at":"reflection","processing":"Comprehension","kind":"Put it in order","tests":"sequence","title":"Put the spinner routine in SWH order.","type":"order","steps":[{"text":"Each student writes what they'd change to make a spinner fall slowly, and why","phaseId":"beginning-ideas"},{"text":"Groups plan a test of the change their questions named","phaseId":"tests"},{"text":"Groups time each design five times, noting odd drops","phaseId":"observations"},{"text":"Each student writes how their change affected the fall","phaseId":"claims"},{"text":"Students pick the times that support their claim and explain the odd ones","phaseId":"evidence"},{"text":"Groups compare claims, then read about air resistance and winged seeds","phaseId":"reading"},{"text":"Students reread their first questions and write what changed","phaseId":"reflection"}],"variants":[]},{"id":"reflect","at":"reflection","processing":"Metacognition","kind":"Look back","title":"Keep the beginnings.","q":"Why does SWH keep each student's beginning questions until the last lesson, even the ones that turned out to be wrong?","type":"reflect","model":"Example: “Because the last phase asks what changed. If I'd thought air couldn't push on anything, seeing that in my own handwriting next to my spinner times is the learning. A wrong first idea is the most useful one to keep.”","recall":"predict"}]},{"id":"swh-2-bottles","path":"swh","track":"bottles","order":2,"title":"A claim worth arguing","summary":"Four bottles and one class's results. Claims tied to a purpose, evidence that says why, and where the teacher's time goes.","level":"explain","version":"1.0.0","status":"published","guideSection":"sequences","requires":[],"items":[{"id":"case","at":"claims","processing":"Retrieval","kind":"The case","title":"Which bottle should the school choose?","table":{"caption":"The class's results: 750 mL bottles, 80 °C water at the start","head":["Bottle","After 1 hour","Empty mass","Drop test"],"rows":[["Steel (double wall)","71 °C","350 g","Small dent"],["Plastic","49 °C","130 g","Undamaged"],["Glass","46 °C","420 g","Cracked"],["Aluminium","42 °C","160 g","Dented"]]},"type":"case","setting":{"who":"Year 10 · Materials · Chemistry · six lessons","text":"The school is replacing single-use plastic with a reusable drink bottle for every student, and a Year 10 class has been asked to recommend one. The teacher runs the investigation as a Science Writing Heuristic routine: instead of a lab report, each student answers seven questions about their own investigation."},"lead":"Every bench had the same four 750 mL bottles: stainless steel (double-walled, like most steel drink bottles), aluminium, glass and a copolyester plastic. Each student chose what to find out, so groups tested different properties. These are the class's results.","you":"You're a pre-service teacher on placement, taking this class for lessons 5 and 6.","sofar":[{"phaseId":"beginning-ideas","when":"Lesson 1","text":"Students handled the bottles, and each wrote what they'd need to find out before recommending one. The questions were kept."},{"phaseId":"tests","when":"Lesson 2","text":"Groups designed tests for the properties their questions named, and the teacher checked each plan for safety."},{"phaseId":"observations","when":"Lessons 3–4","text":"Groups ran their tests with repeats, recording what happened apart from what they thought it meant."},{"phaseId":"claims","when":"Lesson 5 · this lesson","text":"Each student writes a claim answering their own question, then the evidence for it."}]},{"id":"predict","at":"claims","processing":"Retrieval","kind":"Predict","title":"Before the class writes its claims, make your own call.","q":"Which bottle should the school choose?","why":"“There is one best material, whatever it's for” is this sequence's first target conception. A question with more than one defensible answer is what gives SWH's claims and evidence real work to do.","table":{"caption":"The class's results: 750 mL bottles, 80 °C water at the start","head":["Bottle","After 1 hour","Empty mass","Drop test"],"rows":[["Steel (double wall)","71 °C","350 g","Small dent"],["Plastic","49 °C","130 g","Undamaged"],["Glass","46 °C","420 g","Cracked"],["Aluminium","42 °C","160 g","Dented"]]},"type":"predict","options":[{"text":"Steel, because it kept the water hottest"},{"text":"Plastic, because it's the lightest"},{"text":"It depends what the school wants the bottle to do"},{"text":"Glass, because it's the heaviest and so the strongest"}],"answer":2,"reveal":"For keeping a drink hot, the steel bottle wins clearly. For a bottle students carry all day, the plastic is less than half the mass of steel and survived the class's drop test. Both claims fit the same data. Which property matters depends on the purpose, so the question has more than one defensible answer."},{"id":"claim","at":"claims","processing":"Analysis","kind":"Judge the claim","tests":"claims","title":"Four students' claims, each answering their own question. Which could another student most usefully disagree with?","refs":{"phaseIds":[],"lookForIds":["swh-claim-arguable"],"exampleIds":[],"sequenceIds":[],"misapplicationIds":[]},"type":"choice","options":[{"text":"Steel is the best material.","fb":"Best for what? Without a purpose it can't be tested against anyone's data, and the class's own results show it isn't best for weight."},{"text":"We tested four bottles in three ways.","fb":"That's a report of what happened. No one could disagree with it."},{"text":"For keeping a drink hot through a morning, the school should choose the steel bottle: it lost 9 °C in an hour, and the others lost 31 °C or more.","fb":"Yes. It names a purpose, rests on the class's data, and another student can push back, for example by asking whether it's the steel or the bottle's design that keeps the heat in."},{"text":"Glass bottles are made of glass.","fb":"True by definition. There's nothing to argue."}],"answer":2,"variants":[]},{"id":"lf-individual","at":"claims","processing":"Comprehension","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Year 10 · Lesson 5","text":"Groups ran the tests together, but the teacher asks every student to write their own claim in their own book, without conferring. Two members of the same group write different claims: one argues for steel, to keep drinks hot, the other for the plastic, to carry all day."},"hint":"Who wrote it?","why":"Shared data, individual claims. Two different claims from one group are the guide's sign that each student is reasoning from their own question, not copying the group's conclusion.","type":"lookfor","answer":"swh-claim-individual","distractors":["swh-claim-arguable","swh-begin-own-question","swh-reading-peers-first"],"strong":true,"variants":[]},{"id":"evidence","at":"evidence","processing":"Analysis","kind":"Judge the evidence","tests":"evidence","title":"Mia claims the steel bottle is the best choice for keeping drinks hot. Which Evidence section does the job?","refs":{"phaseIds":[],"lookForIds":["swh-evidence-justifies","swh-evidence-selected","swh-evidence-anomalies"],"exampleIds":["swh-evidence-pos-bottle-steel"],"sequenceIds":[],"misapplicationIds":[]},"type":"choice","options":[{"text":"Every temperature, mass and drop result from her table, copied out again","fb":"That's the observations again. It never says why any of it supports steel."},{"text":"Steel is a metal, and metals are strong.","fb":"Her own data have disappeared, and strength isn't what her claim is about."},{"text":"The cooling results, where steel lost 9 °C against 31–38 °C for the others; mass set aside because it isn't what her claim is about; and one steel trial that lost 20 °C, explained by a loose lid she checked afterwards","fb":"Yes. Data chosen for the claim, a reason for leaving some out, and the odd trial named and explained. That's what the guide's Evidence question asks for."},{"text":"Our group agreed steel was best.","fb":"Agreement isn't evidence, and the claim should be Mia's own."}],"answer":2,"variants":[]},{"id":"dx-recopied","at":"evidence","processing":"Analysis","kind":"Diagnose the plan","tests":"misapplication","vignette":{"who":"A pre-service teacher's SWH · Lesson 5","text":"The Evidence page is ruled up as a table with the same headings as the results page: temperature, mass, drop result. Students copy their numbers across neatly, including the loose-lid trial, and hand their books in early."},"hint":"What does the ruled-up page make easy, and what does it leave out?","why":"The page invites restating, so the reasoning step is skipped while the work looks complete. The guide's fix is to ask what about this data makes the claim follow, and to require some data to be set aside with a reason.","refs":{"phaseIds":[],"lookForIds":[],"exampleIds":["swh-evidence-neg-bottle-recopied"],"sequenceIds":[],"misapplicationIds":[]},"type":"diagnose","answer":"mis-swh-evidence-recopied","distractors":["mis-swh-no-negotiation","mis-swh-closed-practical","mis-swh-supplied-question"],"variants":[]},{"id":"lf-anomaly","at":"evidence","processing":"Analysis","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Year 10 · Lesson 5","text":"Jordan claims the plastic bottle is the best choice to carry all day: lightest, and undamaged in the drop test. Under Evidence he notes that in the cooling test the plastic lost 31 °C, and says that doesn't count against his claim, because a bottle carried all day is mostly holding water, not hot drinks."},"hint":"What did Jordan do with the result that didn't help him?","why":"The weak cooling result is named and dealt with, not quietly dropped. Another student may disagree with his reason, and that's exactly what the reading phase is for.","type":"lookfor","answer":"swh-evidence-anomalies","distractors":["swh-evidence-selected","swh-obs-separate","swh-claim-arguable"],"strong":true,"variants":[]},{"id":"move","at":"evidence","processing":"Knowledge utilisation","kind":"Teacher move","tests":"evidence","vignette":{"who":"Lesson 5 · claims and evidence","text":"The class is writing quietly. You have 40 minutes, a pile of marking and a prac to set up for tomorrow."},"q":"Where does your time go?","refs":{"phaseIds":[],"lookForIds":["swh-evidence-justifies"],"exampleIds":[],"sequenceIds":[],"misapplicationIds":[]},"type":"choice","options":[{"text":"Set up tomorrow's prac while they write","fb":"It's tempting, and the guide names it. The Evidence phase is where students most need you."},{"text":"Mark the observation pages from lessons 3 and 4","fb":"Useful, but the observations are done. The reasoning is happening now."},{"text":"Move from student to student asking, “Why does this data support what you wrote?”","fb":"Yes. The guide says this lesson is where the teacher's time goes, even though it looks least like teaching. The claim-to-data link is what SWH exists to build."},{"text":"Check that every student has used all three tests","fb":"Using all the data isn't the goal. Choosing what matters and saying why is."}],"answer":2,"variants":[]},{"id":"plan","at":"tests","processing":"Knowledge utilisation","kind":"Teacher move","tests":"tests","vignette":{"who":"Lesson 2 · plan conference","text":"A group whose question was “Which bottle would survive being dropped in a school bag?” wants to drop the glass bottle onto the concrete outside."},"q":"What do you say, without simply refusing?","refs":{"phaseIds":[],"lookForIds":["swh-tests-follows-question"],"exampleIds":[],"sequenceIds":[],"misapplicationIds":[]},"type":"choice","options":[{"text":"“No glass. Test the other three.”","fb":"That removes the bottle their question is most about, and takes the plan out of their hands."},{"text":"“What do you want to find out from it, and how could you test that so any broken glass stays in a tub?”","fb":"Yes. The method stays theirs and still answers their question, and the plan conference does its job of checking safety and feasibility. This is the guide's own prompt for this lesson."},{"text":"“Fine, but stand well back.”","fb":"The plan conference is where safety gets checked. This skips it."},{"text":"“Here's the method I'd use instead.”","fb":"That redesigns their test. The guide's checkpoint covers safety and feasibility, not correctness."}],"answer":1,"variants":[]},{"id":"dx-closed","at":"claims","processing":"Analysis","kind":"Diagnose the plan","tests":"misapplication","vignette":{"who":"Another pre-service teacher's SWH · Year 10","text":"Students measure the density of a steel offcut by displacement and run it through the seven SWH questions. Every claim reads “The density of steel is about 8 g/cm³”, and the reading phase has nothing to do."},"why":"A practical with one right answer leaves the claim, evidence and reading phases with no work. The guide's fix is a practical where the claim depends on judgement, like choosing a bottle for a purpose.","refs":{"phaseIds":[],"lookForIds":["swh-claim-arguable"],"exampleIds":[],"sequenceIds":[],"misapplicationIds":[]},"type":"diagnose","answer":"mis-swh-closed-practical","distractors":["mis-swh-evidence-recopied","mis-swh-answer-key","mis-swh-supplied-question"],"variants":[]},{"id":"nest","at":"claims","processing":"Knowledge utilisation","kind":"Nest it","tests":"nesting","q":"Your Year 10 materials unit runs as a 5E. In which 5E phase does the SWH writing do its work?","why":"SWH sits inside a unit model. Its claims, evidence and negotiation are how students explain what they found, so it does its work in Explain.","type":"nest","model":"swh","host":"5e","answer":"explain","how":"Use the seven questions to structure sense-making in the 5E Explain phase."},{"id":"reflect","at":"evidence","processing":"Metacognition","kind":"Look back","title":"Two right answers.","q":"Why does SWH work better on the bottle question than on measuring a density?","type":"reflect","model":"Example: “The bottle question has more than one defensible answer, so students' claims can differ and they have to say why. With a density there's one answer, so Claims and Evidence turn into copying.”","recall":"predict"}]},{"id":"swh-2-duckweed","path":"swh","track":"duckweed","order":2,"title":"A claim worth arguing","summary":"Duckweed, run-off and a result that surprises the class. Claims someone could disagree with, evidence that says why, and where the teacher's time goes.","level":"explain","version":"1.0.0","status":"published","guideSection":"sequences","requires":[],"items":[{"id":"case","at":"claims","processing":"Retrieval","kind":"The case","title":"What does run-off do to a creek?","table":{"caption":"What the class tested, three cups of each","head":["Cup","What went in"],"rows":[["Plain water","Nothing added"],["Fertiliser","Garden fertiliser, diluted"],["Detergent","Dishwashing detergent, diluted"],["Salt","Table salt"]]},"type":"case","setting":{"who":"Year 9 · Environmental sustainability · Biology · six lessons","text":"After heavy rain, a creek near the school turns murky with whatever washes off roads, gardens and homes. A Year 9 class is investigating what that run-off does to living things in the water. The teacher runs it as a Science Writing Heuristic routine: instead of a lab report, each student answers seven questions about their own investigation."},"lead":"Duckweed is a tiny floating plant that is easy to count: each frond is a small, flat, leaf-like disc. Groups put ten fronds in each cup of pond water and added run-off substances from an approved list, at strengths they chose. Then they counted fronds at the start of every science lesson for two weeks.","you":"You're a pre-service teacher on placement, taking this class for lessons 5 and 6.","sofar":[{"phaseId":"beginning-ideas","when":"Lesson 1","text":"Students looked at duckweed and at photos of the creek after rain, and each wrote what they wanted to find out. The questions were kept."},{"phaseId":"tests","when":"Lesson 2","text":"Groups designed tests with repeats and plain-water cups, and the teacher checked each plan for safety and disposal."},{"phaseId":"observations","when":"Lessons 3–4","text":"Groups counted fronds over two weeks, recording counts and condition apart from what they thought they meant."},{"phaseId":"claims","when":"Lesson 5 · this lesson","text":"Each student writes a claim answering their own question, then the evidence for it."}]},{"id":"predict","at":"beginning-ideas","processing":"Retrieval","kind":"Predict","title":"Before you see the counts, make your own call.","q":"How do the fertiliser cups compare with the plain-water cups?","why":"“A pollutant always makes living things grow less” is this sequence's first target conception. A result that contradicts it gives the claims real work to do.","type":"predict","options":[{"text":"Fewer fronds. Run-off is pollution, and pollution harms plants"},{"text":"More fronds. Fertiliser feeds the duckweed"},{"text":"About the same. The fertiliser is too dilute to matter"},{"text":"All the duckweed dies"}],"answer":1,"reveal":"Fertiliser adds the nutrients duckweed is short of, so it usually grows faster than in plain water. Some groups conclude that fertiliser run-off is good for creeks. That claim is arguable, and lesson 6 is where it meets what a fast-growing mat of plants does to the rest of a waterway."},{"id":"claim","at":"claims","processing":"Analysis","kind":"Judge the claim","tests":"claims","title":"The counts are in. Which student's claim could another student most usefully disagree with?","refs":{"phaseIds":[],"lookForIds":["swh-claim-arguable"],"exampleIds":[],"sequenceIds":[],"misapplicationIds":[]},"table":{"caption":"The class's results, mean of three cups","head":["Cup","Fronds at start","Fronds at day 14","Condition"],"rows":[["Plain water","10","26","Green"],["Dilute fertiliser","10","48","Green; a thick mat"],["Detergent","10","12","Yellowing"],["Salt","10","9","Brown edges"]]},"type":"choice","options":[{"text":"Pollution is bad for creeks.","fb":"Hard to disagree with, and hard to test. Which substance, bad for what, and how would anyone know?"},{"text":"We counted fronds in twelve cups.","fb":"That's a report of what happened. No one could disagree with it."},{"text":"In our cups, fertiliser nearly doubled the fronds compared with plain water, so fertiliser run-off would make duckweed spread in a creek.","fb":"Yes. It's tied to the student's data and makes a prediction about a creek. Another group can challenge both parts, and the reading in lesson 6 will."},{"text":"Duckweed is a plant.","fb":"True, but there's nothing to argue."}],"answer":2,"variants":[]},{"id":"lf-individual","at":"claims","processing":"Comprehension","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Year 9 · Lesson 5","text":"Groups shared the counting, but the teacher asks every student to write their own claim, without conferring. Two members of the same group write different claims: one says fertiliser is good for the duckweed, the other that it could choke the creek."},"hint":"Who wrote it?","why":"Shared data, individual claims. Two different claims from one group are the guide's sign that each student is reasoning, not copying the group's conclusion.","type":"lookfor","answer":"swh-claim-individual","distractors":["swh-claim-arguable","swh-begin-own-question","swh-reading-peers-first"],"strong":true,"variants":[]},{"id":"evidence","at":"evidence","processing":"Analysis","kind":"Judge the evidence","tests":"evidence","title":"Aisha claims detergent harmed the duckweed. Which Evidence section does the job?","refs":{"phaseIds":[],"lookForIds":["swh-evidence-justifies","swh-evidence-selected","swh-evidence-anomalies"],"exampleIds":[],"sequenceIds":[],"misapplicationIds":[]},"type":"choice","options":[{"text":"Every count from every cup on every day, copied from her table","fb":"That's the observations again. It never says why any of it supports her claim."},{"text":"Detergent is a chemical, and chemicals are bad for plants.","fb":"Her own counts have disappeared, and the reasoning is the target conception, not evidence."},{"text":"The final counts for her three detergent cups and three plain-water cups, with the yellowing she noted, the salt cups left out because they aren't her claim, and one detergent cup that grew well, explained by its label showing it had been diluted twice","fb":"Yes. Data chosen for the claim, a reason for leaving some out, and the odd cup named and explained. That's what the guide's Evidence question asks for."},{"text":"Our group agreed detergent was the worst.","fb":"Agreement isn't evidence, and the claim should be Aisha's own."}],"answer":2,"variants":[]},{"id":"dx-recopied","at":"evidence","processing":"Analysis","kind":"Diagnose the plan","tests":"misapplication","vignette":{"who":"A pre-service teacher's SWH · Lesson 5","text":"The Evidence page is ruled up as a table with the same headings as the counting sheet. Students copy their counts across neatly, including one cup that behaved oddly, and hand their books in early."},"hint":"What does the ruled-up page make easy, and what does it leave out?","why":"The page invites restating, so the reasoning step is skipped while the work looks complete. The guide's fix is to ask what about this data makes the claim follow, and to require some data to be set aside with a reason.","type":"diagnose","answer":"mis-swh-evidence-recopied","distractors":["mis-swh-no-negotiation","mis-swh-closed-practical","mis-swh-supplied-question"],"variants":[]},{"id":"lf-anomaly","at":"evidence","processing":"Analysis","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Year 9 · Lesson 5","text":"Jordan argues that salt slowed the duckweed. One of his plain-water cups ended with far fewer fronds than its repeats. Under Evidence he notes it was the cup nearest the window, that its water level had dropped, and that he has left it out of his comparison for that reason."},"hint":"What did Jordan do with the result that didn't fit?","why":"The odd cup is named, explained and set aside with a reason rather than quietly dropped. That's the work the look-for exists for.","type":"lookfor","answer":"swh-evidence-anomalies","distractors":["swh-evidence-selected","swh-obs-separate","swh-claim-arguable"],"strong":true,"variants":[]},{"id":"move","at":"evidence","processing":"Knowledge utilisation","kind":"Teacher move","tests":"evidence","vignette":{"who":"Lesson 5 · claims and evidence","text":"The class is writing quietly. You have 40 minutes, a pile of marking and a prac to set up for tomorrow."},"q":"Where does your time go?","refs":{"phaseIds":[],"lookForIds":["swh-evidence-justifies"],"exampleIds":[],"sequenceIds":[],"misapplicationIds":[]},"type":"choice","options":[{"text":"Set up tomorrow's prac while they write","fb":"It's tempting, and the guide names it. The Evidence phase is where students most need you."},{"text":"Mark the counting sheets from the last fortnight","fb":"Useful, but the observations are done. The reasoning is happening now."},{"text":"Move from student to student asking, “Why do these counts support what you wrote?”","fb":"Yes. The guide says this lesson is where the teacher's time goes, even though it looks least like teaching. The claim-to-data link is what SWH exists to build."},{"text":"Check that every student has used every cup","fb":"Using all the data isn't the goal. Choosing what matters and saying why is."}],"answer":2,"variants":[]},{"id":"spot-tests","at":"tests","processing":"Comprehension","kind":"Spot the phase","tests":"tests","vignette":{"who":"Year 9 · Lesson 2","text":"A group whose question was “Does a little detergent do as much harm as a lot?” plans three strengths of detergent, three cups each, and three cups of plain water. The teacher asks how they'll dispose of the water at the end, and leaves the rest of the plan alone."},"q":"Which SWH phase is this?","refs":{"phaseIds":[],"lookForIds":["swh-tests-follows-question"],"exampleIds":[],"sequenceIds":[],"misapplicationIds":[]},"type":"spot","answer":"tests","among":["beginning-ideas","tests","observations"],"fb":{"beginning-ideas":"The question was written in lesson 1. Now the group is deciding how to answer it.","tests":"Yes. The method follows from their own question, and the teacher checks it for safety and feasibility without redesigning it.","observations":"Nothing has been counted yet. This is the plan."},"variants":[]},{"id":"dx-closed","at":"claims","processing":"Analysis","kind":"Diagnose the plan","tests":"misapplication","vignette":{"who":"Another pre-service teacher's SWH · Year 9","text":"Students look at one duckweed plant under a hand lens, count its fronds and roots, and run it through the seven SWH questions. Every claim reads “A duckweed plant has three fronds and one root each”, and the reading phase has nothing to do."},"why":"A task with one right answer leaves the claim, evidence and reading phases with no work. The guide's fix is a practical where the claim depends on judgement, like deciding what run-off does to a creek.","refs":{"phaseIds":[],"lookForIds":["swh-claim-arguable"],"exampleIds":[],"sequenceIds":[],"misapplicationIds":[]},"type":"diagnose","answer":"mis-swh-closed-practical","distractors":["mis-swh-evidence-recopied","mis-swh-answer-key","mis-swh-supplied-question"],"variants":[]},{"id":"nest","at":"claims","processing":"Knowledge utilisation","kind":"Nest it","tests":"nesting","q":"Your Year 9 sustainability unit runs as a 5E. In which 5E phase does the SWH writing do its work?","why":"SWH sits inside a unit model. Its claims, evidence and negotiation are how students explain what they found, so it does its work in Explain.","type":"nest","model":"swh","host":"5e","answer":"explain","how":"Use the seven questions to structure sense-making in the 5E Explain phase."},{"id":"reflect","at":"evidence","processing":"Metacognition","kind":"Look back","title":"A surprising result.","q":"Why is the fertiliser result, where duckweed grows faster, so useful for the claims and evidence phases?","type":"reflect","model":"Example: “It contradicts what most students expect, so their claims about ‘harm’ have to be precise: harm to what? Two students can read the same counts differently, and that gives the evidence and the reading something to argue about.”","recall":"predict"}]},{"id":"swh-3-bottles","path":"swh","track":"bottles","order":3,"title":"Not the answer key","summary":"Peers first, then the published figures. How a text becomes another voice in the argument, and why the beginning ideas have to come back.","level":"explain","version":"1.0.0","status":"published","guideSection":"sequences","requires":[],"items":[{"id":"case","at":"reading","processing":"Retrieval","kind":"The case","title":"Lesson 6, where claims meet each other","table":{"caption":"The class's results: 750 mL bottles, 80 °C water at the start","head":["Bottle","After 1 hour","Empty mass","Drop test"],"rows":[["Steel (double wall)","71 °C","350 g","Small dent"],["Plastic","49 °C","130 g","Undamaged"],["Glass","46 °C","420 g","Cracked"],["Aluminium","42 °C","160 g","Dented"]]},"type":"case","setting":{"who":"Year 10 · Materials · Chemistry · six lessons","text":"The school is replacing single-use plastic with a reusable drink bottle for every student, and a Year 10 class has been asked to recommend one. The teacher runs the investigation as a Science Writing Heuristic routine: instead of a lab report, each student answers seven questions about their own investigation."},"lead":"Every student has written a claim and the evidence for it. Most argued for the steel bottle, to keep a drink hot, or for the plastic, to carry all day. Today groups compare their claims, and then the teacher releases published figures for each material.","you":"You're the pre-service teacher taking lesson 6.","sofar":[{"phaseId":"beginning-ideas","when":"Lesson 1","text":"Each student wrote what they'd need to find out before recommending a bottle. The questions were kept."},{"phaseId":"observations","when":"Lessons 2–4","text":"Groups designed and ran their own tests, with repeats."},{"phaseId":"evidence","when":"Lesson 5","text":"Each student wrote a claim, chose the data that support it, and said why."},{"phaseId":"reading","when":"Lesson 6 · this lesson","text":"Groups compare claims, then read the published figures. Then the beginning questions come back."}]},{"id":"predict","at":"reading","processing":"Retrieval","kind":"Predict","title":"Lesson 6 of the bottles routine. Every student has a claim and evidence. You have published figures for each material's thermal conductivity, density, cost and recyclability.","q":"When should students see the published figures?","why":"“The published figure settles it, so testing is a formality” is this sequence's second target conception. Release the figures early and you teach it.","type":"predict","options":[{"text":"In lesson 1, so their questions are well informed"},{"text":"In lesson 3, so they can check their measurements as they go"},{"text":"In lesson 6, after groups have compared their claims with each other"},{"text":"Never. Their own data should be enough"}],"answer":2,"reveal":"The guide holds the figures back until groups have compared claims with each other. By then students have data of their own to set against the numbers, so the figures join the argument instead of ending it."},{"id":"lf-peers","at":"reading","processing":"Comprehension","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Year 10 · Lesson 6","text":"A group that argued for steel, to keep drinks hot, pairs with a group that argued for the plastic, to carry all day. Neither group's data contradicts the other's, and after ten minutes they work out why: they weighted different properties. Only then does the teacher hand out the published figures."},"hint":"What happens before the figures arrive?","refs":{"phaseIds":[],"lookForIds":[],"exampleIds":["swh-reading-pos-bottle-negotiation"],"sequenceIds":[],"misapplicationIds":[]},"type":"lookfor","answer":"swh-reading-peers-first","distractors":["swh-reading-not-answer-key","swh-claim-individual","swh-reflect-about-thinking"],"strong":true,"variants":[]},{"id":"dx-key","at":"reading","processing":"Analysis","kind":"Diagnose the plan","tests":"misapplication","vignette":{"who":"A pre-service teacher's SWH · Lesson 6","text":"With fifteen minutes left, the textbook page goes on the board. Students whose claims match tick the box. Students whose claims don't cross them out and copy the textbook's statement. Nobody talks to another group."},"hint":"What role is the textbook playing?","why":"The text arrives as the verdict, so students learn their own testing was the slow route to what the book already held. Crossing out isn't revision, because nothing changed for a reason. Comparing with the next bench first costs five minutes.","refs":{"phaseIds":[],"lookForIds":[],"exampleIds":["swh-reading-neg-bottle-checkit"],"sequenceIds":[],"misapplicationIds":[]},"type":"diagnose","answer":"mis-swh-answer-key","distractors":["mis-swh-no-negotiation","mis-swh-lost-beginnings","mis-swh-evidence-recopied"],"variants":[]},{"id":"move","at":"reading","processing":"Knowledge utilisation","kind":"Teacher move","tests":"reading","vignette":{"who":"Lesson 6 · after the figures are released","text":"Mia claimed steel is the best material for keeping drinks hot, because the steel bottle lost the least heat. Then she reads the published figures. Mia: “So our results were wrong.”"},"q":"What is the best move?","refs":{"phaseIds":[],"lookForIds":["swh-reading-not-answer-key","swh-reading-something-changes"],"exampleIds":[],"sequenceIds":[],"misapplicationIds":[]},"table":{"caption":"Published figures, released in lesson 6","head":["Material","Heat conduction (W/m·K)","Density (g/cm³)"],"rows":[["Stainless steel","about 16","8.0"],["Aluminium","about 200","2.7"],["Glass","about 1","2.5"],["Copolyester plastic","about 0.2","1.2"]]},"type":"choice","options":[{"text":"Tell Mia to replace her claim with the published figure","fb":"That makes the figures an answer key. Her cooling data were real, and the useful question is why they don't match the material's conductivity."},{"text":"Ask what her cooling data and the figure each show, and to look again at how the steel bottle is made","fb":"Yes. The steel bottle has a double wall with a vacuum gap, and the other three are single-walled. Her data still stand. What changes is the reason, so she can qualify her claim in writing to credit the bottle's design, not the steel."},{"text":"Tell Mia the published figure must be for a different kind of steel","fb":"That protects her claim without examining it. Nothing changes for a reason."},{"text":"Move on. She can sort it out in her reflection","fb":"The reflection is about how her thinking changed. This is the moment it could change."}],"answer":1,"variants":[]},{"id":"lf-changes","at":"reading","processing":"Analysis","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Year 10 · Lesson 6","text":"Groups compare claims with the bench next door, then read the published figures. At the bell, every book holds exactly the claim it held at the start of the lesson. The teacher says the discussion was the point."},"hint":"Compare the books at the start and the end.","why":"Talking isn't negotiating if nothing is allowed to change. The guide asks for revisions to be written, not just discussed. A claim that survives should be argued for in writing too, as the plastic group does when it adds the recyclability figures as support.","type":"lookfor","answer":"swh-reading-something-changes","distractors":["swh-reading-peers-first","swh-reading-not-answer-key","swh-claim-individual"],"strong":false,"variants":[]},{"id":"dx-none","at":"reading","processing":"Analysis","kind":"Diagnose the plan","tests":"misapplication","vignette":{"who":"Another pre-service teacher's SWH · Year 10","text":"Short of time, the teacher keeps the student template (questions, claims, evidence) and cuts the lesson where groups compare claims and read the figures. Books are marked on the Evidence page."},"why":"The negotiation is where a claim meets someone who might disagree. Without it, the writing still helps, but vague claims cost nothing. The guide's fix is to timetable the comparing as its own phase and protect it.","type":"diagnose","answer":"mis-swh-no-negotiation","distractors":["mis-swh-answer-key","mis-swh-closed-practical","mis-swh-evidence-recopied"],"variants":[]},{"id":"spot-reflect","at":"reflection","processing":"Comprehension","kind":"Spot the phase","tests":"reflection","vignette":{"who":"Year 10 · End of lesson 6","text":"The teacher hands back the lesson 1 question sheets. Students write what they first thought a good bottle was,
