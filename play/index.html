<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F6F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111917" media="(prefers-color-scheme: dark)">
<title>Fieldwork · The Field Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
/* Layout: one narrow lesson column, game HUD on top, a 5E phase rail showing where the learner's own lesson sits, and a fixed check/feedback bar at the bottom */
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --surface-2:#E9EEEB; --ink:#16211F; --muted:#5A6B68; --line:#D7DEDA; --line-soft:#E6EBE8;
  --accent:#1D6B56; --on-accent:#FFFFFF; --micro:#96601A;
  --good:#1f7446; --good-bg:#dff2e6; --bad:#ad3d2b; --bad-bg:#fae6e1;
  --engage:#b06e0c; --explore:#0d7c6f; --explain:#2a5cad; --elaborate:#7046ad; --evaluate:#ad4166;
  --plate-sun:#F2C76B; --plate-ray:#D9A62E; --plate-canopy:#DFEDE7; --plate-branch:#1D6B56; --plate-leaf:#2E8A6E;
  --plate-trunk:#5B4632; --plate-soil:#7A5B3E; --plate-tub:#35538F; --plate-rim:#2A4372; --plate-drop:#6FA8DC;
  --f-display:"Source Serif 4", Georgia, serif;
  --f-body:"IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --serif:var(--f-display); --mono:var(--f-mono);
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111917; --surface:#19231F; --surface-2:#131C19; --ink:#E6EDE9; --muted:#9CADA8; --line:#2C3A35; --line-soft:#232F2B;
  --accent:#6FC0A3; --on-accent:#0D1714; --micro:#DFA85C;
  --plate-sun:#C9A04A; --plate-ray:#A88128; --plate-canopy:#1B322A; --plate-branch:#6FC0A3; --plate-leaf:#4FA586;
  --plate-trunk:#B08C68; --plate-soil:#8C6B4B; --plate-tub:#5873AE; --plate-rim:#45609A; --plate-drop:#7FB4E4;
  --good:#62cf90; --good-bg:#16301f; --bad:#f08a75; --bad-bg:#371c17;
  --engage:#e7a64a; --explore:#4cc4b3; --explain:#86aef0; --elaborate:#b598e8; --evaluate:#ec8aac;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111917; --surface:#19231F; --surface-2:#131C19; --ink:#E6EDE9; --muted:#9CADA8; --line:#2C3A35; --line-soft:#232F2B;
  --accent:#6FC0A3; --on-accent:#0D1714; --micro:#DFA85C;
  --plate-sun:#C9A04A; --plate-ray:#A88128; --plate-canopy:#1B322A; --plate-branch:#6FC0A3; --plate-leaf:#4FA586;
  --plate-trunk:#B08C68; --plate-soil:#8C6B4B; --plate-tub:#5873AE; --plate-rim:#45609A; --plate-drop:#7FB4E4;
  --good:#62cf90; --good-bg:#16301f; --bad:#f08a75; --bad-bg:#371c17;
  --engage:#e7a64a; --explore:#4cc4b3; --explain:#86aef0; --elaborate:#b598e8; --evaluate:#ec8aac;
  color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.wrap{max-width:660px;margin:0 auto;padding-inline:16px;padding-block:14px 300px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* HUD */
.hud{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--good);border-radius:99px;transition:width .4s ease}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:14px;padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill svg{width:15px;height:15px}
.pill.streak{color:var(--engage)}
.pill.xp{color:var(--accent)}

/* phase rail */
.rail{margin-top:14px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.rail div{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;text-align:center;padding-top:7px;border-top:4px solid var(--line);color:var(--muted);transition:color .3s,border-color .3s}
.rail div.done{border-color:var(--pc);color:var(--muted)}
.rail div.now{border-color:var(--pc);color:var(--pc);font-weight:500}
.railnote{font-size:13px;color:var(--muted);margin:6px 0 0}

/* card */
.card{margin-top:22px;animation:rise .35s ease both}
@keyframes rise{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;padding:3px 9px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.chip.ph{color:var(--pc);background:color-mix(in srgb,var(--pc) 14%,transparent)}
.chip.rev{color:var(--bad);background:var(--bad-bg)}
.kind{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.card h2{font-size:clamp(22px,5vw,27px);line-height:1.2;font-weight:600}
.vignette{margin:14px 0 0;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:4px var(--r) var(--r) 4px;font-size:16px}
.vignette .who{display:block;font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.q{margin:16px 0 0;font-weight:700}

.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:13px 14px;border-radius:var(--r);border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);cursor:pointer;transition:border-color .15s,transform .05s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:active:not(:disabled){transform:translateY(2px)}
.opt .k{flex:none;width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.opt .t{min-width:0}
.opt.sel{border-color:var(--ink);background:var(--surface-2)}
.opt.sel .k{border-color:var(--ink);color:var(--ink)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .k{border-color:var(--good);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.opt .ofb{display:block;font-size:14.5px;color:var(--ink);margin-top:6px}
/* correct and wrong carry an icon and a word, so colour is never the only signal */
.vd{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-top:6px}
.vd .i{width:15px;height:15px}
.right .vd{color:var(--good)} .wrong .vd{color:var(--bad)}
.opts.phases .opt{flex-direction:column;align-items:center}
.slot .vd{margin:0 0 0 8px;flex:none}
.opts.phases{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.opts.phases .opt{justify-content:center;font-family:var(--f-display);font-weight:600;font-size:18px;border-color:color-mix(in srgb,var(--pc) 45%,var(--line));color:var(--pc)}
.opts.phases .opt.sel{background:var(--surface-2);border-color:var(--ink)}
.opts.phases .opt.right{color:var(--good)} .opts.phases .opt.wrong{color:var(--bad)}

.slider{margin-top:18px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.slider label{display:flex;justify-content:space-between;font-size:15px;font-weight:700}
.slider output{font-family:var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums}
.slider input{-webkit-appearance:none;appearance:none;display:block;width:100%;height:44px;margin:4px 0 0;background:transparent;cursor:pointer;--fill:60%}
.slider input::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:linear-gradient(90deg,var(--ink) var(--fill),var(--line) var(--fill))}
.slider input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;margin-top:-9px;border-radius:50%;background:var(--ink);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--ink)}
.slider input::-moz-range-track{height:6px;border-radius:99px;background:var(--line)}
.slider input::-moz-range-progress{height:6px;border-radius:99px;background:var(--ink)}
.slider input::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--ink);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--ink)}
.slider input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.slider small{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}

.hint{margin-top:12px}
.hint summary,.why summary{cursor:pointer;font-size:15px;color:var(--accent);font-weight:700;list-style:none;display:inline-flex;align-items:center;gap:6px}
.hint summary::-webkit-details-marker,.why summary::-webkit-details-marker{display:none}
.hint summary::before,.why summary::before{content:"+";font-family:var(--f-mono);display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;border:1.5px solid currentColor;font-size:14px}
.hint[open] summary::before,.why[open] summary::before{content:"−"}
.hint p{margin:8px 0 0;font-size:15px;color:var(--muted)}

/* order task */
.slots{display:grid;gap:8px;margin-top:14px;counter-reset:s}
.slot{display:flex;gap:12px;align-items:center;min-height:54px;padding:10px 12px;border-radius:var(--r);border:2px dashed var(--line);color:var(--muted);font-size:15px}
.slot .n{flex:none;font-family:var(--f-mono);font-size:13px;width:24px;text-align:center}
.slot.filled{border-style:solid;background:var(--surface);color:var(--ink);cursor:pointer}
.slot.filled:disabled{cursor:default}
.slot.right{border-color:var(--good);background:var(--good-bg)}
.slot.wrong{border-color:var(--bad);background:var(--bad-bg)}
.slot .tag{margin-left:auto;flex:none;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--pc)}
.slot .txt{min-width:0}
.pool{display:grid;gap:8px;margin-top:16px}
.pool .lbl{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* plan */
.plan{margin:14px 0 0;padding:0;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.plan li{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:15.5px}
.plan li:first-child{border-top:0}
.plan b{font-family:var(--f-mono);font-weight:500;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--pc);padding-top:2px}
.plan .min{min-width:0}

/* concept */
.concept{margin-top:14px;display:grid;gap:8px}
.concept .row{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.concept .row h3{font-size:19px;color:var(--pc)}
.concept .row p{margin:0;font-size:15.5px;min-width:0}
.concept .row em{display:block;font-style:normal;font-size:14px;color:var(--muted);margin-top:3px}
.lead{margin:12px 0 0;font-size:16.5px}
.cite{font-size:13px;color:var(--muted);margin-top:10px}

textarea{width:100%;min-height:110px;margin-top:12px;padding:12px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px;resize:vertical}
textarea:focus{border-color:var(--accent);outline:none}
.recall{margin-top:12px;padding:12px 14px;border-radius:var(--r);background:color-mix(in srgb,var(--engage) 12%,var(--surface));font-size:15.5px}
.recall b{color:var(--engage)}

/* bottom bar */
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));transition:background .2s}
.dock.good{background:var(--good-bg);border-color:var(--good)}
.dock.bad{background:var(--bad-bg);border-color:var(--bad)}
.dock-in{max-width:660px;margin:0 auto;display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.fb{flex:1 1 300px;min-width:0;max-height:38vh;overflow:auto}
.fb h3{font-size:20px;font-weight:600}
.dock.good .fb h3{color:var(--good)} .dock.bad .fb h3{color:var(--bad)}
.fb p{margin:4px 0 0;font-size:15.5px}
.why{margin-top:8px}
.why p{margin:6px 0 0;font-size:15px;color:var(--ink);padding-left:10px;border-left:3px solid var(--line)}
.go{flex:0 0 auto;margin-left:auto;min-width:150px;padding:13px 22px;border:0;border-radius:var(--r);background:var(--accent);color:var(--on-accent);font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.02em;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000);cursor:pointer}
.go:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.go:disabled{background:var(--surface-2);color:var(--muted);box-shadow:none;cursor:not-allowed}
.dock.good .go{background:var(--good);color:var(--surface);box-shadow:0 4px 0 color-mix(in srgb,var(--good) 60%,#000)}
.dock.bad .go{background:var(--bad);color:var(--surface);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 60%,#000)}
a.go.fbk{display:inline-block;margin-top:12px;text-decoration:none;text-align:center}
button.go.fbk{margin-top:12px}
.keys{font-size:12.5px;color:var(--muted);flex-basis:100%;margin:0}

/* summary */
.sum-head{text-align:left}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{padding:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.stat b{display:block;font-family:var(--f-display);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.skills{margin-top:18px;display:grid;gap:10px}
.skill{display:grid;grid-template-columns:100px 1fr 46px;gap:10px;align-items:center;font-size:15px}
.skill .track{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.skill .track i{display:block;height:100%;background:var(--pc);border-radius:99px}
.skill .v{font-family:var(--f-mono);font-size:13px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.crowns{margin-top:20px;padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.crowns h3{font-size:18px}
.lv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.lv div{font-size:12.5px;text-align:center;padding:8px 4px;border-radius:8px;background:var(--surface-2);color:var(--muted)}
.lv div.got{background:var(--good-bg);color:var(--good);font-weight:700}
.lv div.next{outline:2px dashed var(--accent);outline-offset:-2px;color:var(--accent)}
.note{font-size:15px;color:var(--muted);margin-top:12px}
@media (max-width:440px){
  .concept .row{grid-template-columns:1fr;gap:2px}
  .plan li{grid-template-columns:1fr;gap:0}
  .skill{grid-template-columns:84px 1fr 40px}
  .stats{gap:6px} .stat b{font-size:23px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* masthead */
.i{width:1.25em;height:1.25em;flex:none}
.top{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;min-height:44px}
.top .grow{flex:1}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:600;font-size:19px}
.brand-mark{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--on-accent)}
.brand-mark .i{width:18px;height:18px}
.top .back{display:inline-flex;align-items:center;gap:2px;min-height:44px;border:0;background:none;color:var(--accent);font-weight:600;font-size:15px;cursor:pointer;padding:0 4px;text-decoration:none;border-radius:8px}
.top .back .i{width:18px;height:18px}
/* HUD heading: where you are, and how far */
.hud-path{display:flex;justify-content:space-between;gap:10px;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--muted);margin:10px 0 0}
#count{flex:none;color:var(--ink);font-variant-numeric:tabular-nums}
.hud-title{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0 0 10px}
/* phase tag above each item's stem */
.phtag{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:99px;margin:0 0 6px;color:color-mix(in srgb,var(--pc) 70%,var(--ink));background:color-mix(in srgb,var(--pc) 14%,var(--surface))}
.phtag .i{width:16px;height:16px;color:var(--pc)}
.phtag.plain{color:var(--muted);background:var(--surface-2)}
/* lesson plate on graph paper */
.plate-card{background-color:var(--surface);background-image:linear-gradient(var(--line-soft) 1px,transparent 1px),linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);background-size:18px 18px;border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 14px}
.pl-sun{fill:var(--plate-sun)} .pl-ray{stroke:var(--plate-ray)} .pl-canopy{fill:var(--plate-canopy)}
.pl-trunk{stroke:var(--plate-trunk)} .pl-branch{stroke:var(--plate-branch)} .pl-leaf{fill:var(--plate-leaf)}
.pl-tub{fill:var(--plate-tub)} .pl-rim{fill:var(--plate-rim)} .pl-soil{stroke:var(--plate-soil)}
.pl-drop{fill:var(--plate-drop)} .pl-label{font:11px var(--mono);fill:var(--muted)}
.pl-q{font:600 40px var(--serif);fill:var(--micro)} .plate{width:100%;height:auto;display:block}
/* privacy line under the dock's controls on lesson screens */
.privacy{flex-basis:100%;display:flex;align-items:center;gap:6px;margin:0;font-size:12.5px;color:var(--muted)}
.privacy .i{width:14px;height:14px}
/* path map */
.banner{margin-top:12px;padding:10px 14px;border-radius:var(--r);background:var(--bad-bg);color:var(--bad);font-weight:700;font-size:15px}
.mapHead h1{font-size:clamp(26px,6vw,34px);font-weight:600;line-height:1.15;margin-top:18px}
.mapHead p{margin:8px 0 0;color:var(--muted)}
.path{margin-top:26px}
.pathHead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.pathHead h2{font-size:24px;font-weight:600}
.pathHead a{font-size:15px;color:var(--accent);font-weight:700}
.path > p{margin:4px 0 0;color:var(--muted);font-size:15.5px}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.ladder div{font-size:12.5px;text-align:center;padding:7px 4px;border-radius:8px;background:var(--surface-2);color:var(--muted)}
.ladder div.got{background:var(--good-bg);color:var(--good);font-weight:700}
.lessons{display:grid;gap:10px;margin-top:14px}
.lesson{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;padding:14px;border-radius:var(--r);background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;text-align:left;width:100%;cursor:pointer}
.lesson:hover:not(:disabled){border-color:var(--accent)}
.lesson:disabled{cursor:not-allowed;opacity:.62}
.lesson .num{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:19px;background:var(--surface-2);color:var(--muted)}
.lesson.done .num{background:var(--good);color:var(--surface)}
.lesson.next .num{background:var(--accent);color:var(--on-accent)}
.lesson h3{font-size:19px;font-weight:600}
.lesson .sum{display:block;font-size:15px;color:var(--muted);margin-top:2px}
.lesson .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lesson .min{min-width:0}
.chip.good{color:var(--good);background:var(--good-bg)}
.chip.warn{color:var(--bad);background:var(--bad-bg)}
.upcoming{padding:12px 14px;border-radius:var(--r);border:2px dashed var(--line);color:var(--muted);font-size:15px}
.warm{color:var(--engage)}
.row2{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.ghost{display:inline-block;padding:12px 18px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);color:var(--accent);font-weight:700;text-decoration:none;font-size:16px;cursor:pointer}
.reset{margin-top:28px;font-size:13.5px;color:var(--muted)}
.reset button{border:0;background:none;color:var(--accent);font:inherit;text-decoration:underline;cursor:pointer;padding:0}
.weigh{display:grid;gap:2px;margin-top:8px;font-size:14px}
.wrow{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(auto-fit,minmax(0,1fr));gap:10px;align-items:center;padding:6px 8px;border-radius:8px}
.wrow small{display:block;color:var(--muted);font-size:12.5px}
.wrow.whead{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wrow.hl{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.wrow.wtot{font-weight:700;border-top:1px solid var(--line);border-radius:0}
.wrow .bar{display:block;height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-bottom:3px}
.wrow .bar b{display:block;height:100%;background:var(--accent);border-radius:99px}
.wrow span{min-width:0;font-variant-numeric:tabular-nums}
.board{display:grid;gap:10px;margin-top:14px}
.phasebox{border:2px solid color-mix(in srgb,var(--pc) 40%,var(--line));border-radius:var(--r);padding:10px 12px;display:grid;gap:8px;background:var(--surface)}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.phead b{font-family:var(--f-display);font-size:18px;color:var(--pc)}
.place{border:0;border-radius:99px;padding:6px 14px;background:var(--pc);color:var(--surface);font-weight:700;font-size:14px;cursor:pointer}
.phasebox .empty{margin:0;font-size:14px;color:var(--muted)}
.phasebox .slot{min-height:0}
.tray{margin-top:14px}
.report{margin-top:18px;display:grid;gap:8px}
.report h3{font-size:20px}
.report h4{margin:6px 0 0;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rp{padding:10px 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);font-size:15px}
.rp span{display:block;margin-top:4px;color:var(--muted);font-size:14px}
.rp em{display:block;font-style:normal;margin-top:4px;font-size:14px}
.rp.good{border-left-color:var(--good)} .rp.bad{border-left-color:var(--bad)} .rp.miss{border-left-color:var(--muted)}
.thinking{margin-top:12px;padding:12px;border-radius:var(--r);background:var(--surface-2);display:grid;gap:6px}
.thinking .lbl{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cn{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;align-items:baseline}
.cn span{min-width:0}
.cn b{flex:none;font-family:var(--f-mono);font-size:12px;font-weight:500;padding:2px 8px;border-radius:6px;background:var(--surface);color:var(--muted)}
.cn.surfaced b{color:var(--engage)} .cn.hidden b{color:var(--bad);background:var(--bad-bg)} .cn.challenged b{color:var(--good);background:var(--good-bg)}
.said{margin-top:12px;padding:12px 14px;border-radius:var(--r);background:color-mix(in srgb,var(--engage) 12%,var(--surface));font-size:16px}
.dbh{font-size:18px;margin-top:16px}
.lfq{display:block;font-size:13px;color:var(--muted);font-family:var(--f-mono);letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
</style>
</head>
<body>
<!-- Field Guide icon sprite. 24 px grid, 1.75 stroke, round caps and joins, stroke = currentColor.
     Paste this block once, straight after <body>, in tools/reckoner/templates/app.html and game.html.

<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

  <symbol id="i-familytree" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.5" r="2"/><circle cx="5.5" cy="19.5" r="2"/><circle cx="12" cy="19.5" r="2"/><circle cx="18.5" cy="19.5" r="2"/><path d="M12 6.5v11M12 12H5.5v5.5M12 12h6.5v5.5"/></symbol>
  <symbol id="i-fieldwork" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="15.5" r="3.8"/><circle cx="17" cy="15.5" r="3.8"/><path d="M10.8 15.5h2.4"/><path d="M3.6 13.5L6.5 5h3.2l1.1 7M20.4 13.5L17.5 5h-3.2l-1.1 7"/></symbol>
  <symbol id="i-reckoner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16a8 8 0 0 1 16 0"/><path d="M12 16l4-5"/><circle cx="12" cy="16" r="1.4"/></symbol>
  <symbol id="i-guides" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M8.5 10h7M8.5 14h7M8.5 18h4"/></symbol>

  <!-- Reckoner tools (one per tab) -->
  <symbol id="i-unit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V8"/><path d="M12 15c-1-2.5-3.5-3.6-6-3 .5 2.5 3 3.8 6 3z"/><path d="M12 12c1-2.5 3.5-3.6 6-3-.5 2.5-3 3.8-6 3z"/><path d="M12 8c-1.3-1.8-1.3-3.6 0-5.2 1.3 1.6 1.3 3.4 0 5.2z"/></symbol>
  <symbol id="i-compare" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="7" height="14" rx="1.5"/><rect x="13.5" y="5" width="7" height="14" rx="1.5"/><path d="M6 9h2M16 9h2M6 13h2M16 13h2"/></symbol>
  <symbol id="i-detail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h12"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="17" r="2"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-2-1.5-5-2-8-1.5V18c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V4.5c-3-.5-6 0-8 1.5z"/><path d="M12 6v13.5"/></symbol>
  <symbol id="i-judgement" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M8 20h8M5 7h14"/><path d="M5 7l-2.5 6h5zM19 7l-2.5 6h5z"/></symbol>

  <!-- Stages: seedling grows to sapling -->
  <symbol id="i-stage4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5v-8"/><path d="M12 12.5c0-3-2.4-5-6-5 0 3 2.4 5 6 5z"/><path d="M12 12.5c0-3 2.4-5 6-5 0 3-2.4 5-6 5z"/><path d="M7 20.5h10"/></symbol>
  <symbol id="i-stage5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V8"/><path d="M12 15c-1-2.5-3.5-3.6-6-3 .5 2.5 3 3.8 6 3z"/><path d="M12 12c1-2.5 3.5-3.6 6-3-.5 2.5-3 3.8-6 3z"/><path d="M12 8c-1.3-1.8-1.3-3.6 0-5.2 1.3 1.6 1.3 3.4 0 5.2z"/><path d="M7 21h10"/></symbol>

  <!-- Model scale badges (SCALE keys in questions.json) -->
  <symbol id="i-scale-macro" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 12h18"/><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></symbol>
  <symbol id="i-scale-meso" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 12h10"/><circle cx="7" cy="12" r="1.8"/><circle cx="17" cy="12" r="1.8"/></symbol>
  <symbol id="i-scale-micro" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="2"/><circle cx="12" cy="12" r="7"/></symbol>
  <symbol id="i-scale-dial" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 16a8 8 0 0 1 16 0"/><path d="M12 16l-3-6"/></symbol>

  <!-- 5E phases (also used for the matching 7E phases; elicit uses i-engage, extend uses i-elaborate) -->
  <symbol id="i-engage" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .9-1 1.6v.4"/><path d="M12 16.6v.2"/></symbol>
  <symbol id="i-explore" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="5.5"/><path d="M14.6 14.6l5 5"/></symbol>
  <symbol id="i-explain" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5h16v10.5H10l-4 3.5v-3.5H4z"/><path d="M8 9.5h8M8 12.5h5"/></symbol>
  <symbol id="i-elaborate" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="9" width="9" height="11" rx="1.5"/><path d="M10 14l9.5-9.5M14 4.5h5.5V10"/></symbol>
  <symbol id="i-evaluate" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M8 12.4l2.8 2.8L16 9.6"/></symbol>

  <!-- Utility -->
  <symbol id="i-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="i-tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4.5M12 17.5v.2"/></symbol>
</svg>
<!-- Two icons the game needs that the Field Guide sprite does not have: a cross for wrong answers, a lock for the privacy line. Same grid and stroke. -->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-cross" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"/></symbol>
</svg>
<div class="wrap">
  <div class="top" id="top"></div>
  <div id="banner"></div>
  <div id="hud" hidden>
    <p class="hud-path"><span id="hudPath"></span><span id="count" title="Item"></span></p>
    <p class="hud-title" id="hudTitle"></p>
    <div class="hud">
      <div class="bar" role="progressbar" aria-label="Lesson progress" aria-valuemin="0" aria-valuemax="100"><i id="prog"></i></div>
      <span class="pill streak" title="Correct in a row"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 1c.5 2.6 3.8 4.2 3.8 8A3.8 3.8 0 0 1 4.2 9c0-1.6.8-2.7 1.7-3.5.1 1.2.6 2 1.4 2.4C7.1 5.6 7.3 3.1 8 1z"/></svg><span id="streak">0</span></span>
      <span class="pill xp" title="Experience points"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 1l2 4.6 5 .5-3.8 3.3 1.1 4.9L8 11.8 3.7 14.3l1.1-4.9L1 6.1l5-.5z"/></svg><span id="xp">0</span> XP</span>
    </div>
    <div class="rail" id="rail" aria-label="Phase of this lesson"></div>
    <p class="railnote" id="railnote"></p>
  </div>
  <main id="stage" aria-live="polite"><p class="lead" id="bootMsg">Loading…</p></main>
</div>
<div class="dock" id="dock" hidden>
  <div class="dock-in">
    <div class="fb" id="fb"></div>
    <button class="go" id="go" disabled>Check</button>
    <p class="keys" id="keys"></p>
    <p class="privacy" id="privacy" hidden><svg class="i" aria-hidden="true"><use href="#i-lock"/></svg><span id="privacyText"></span></p>
  </div>
</div>
<script>window.GAME_DATA = {"mastery":["recognise","explain","select","design"],"notice":"This is an early version being trialled to improve EDSE science education units. Nothing you do in the game is recorded or sent anywhere: your progress is kept in this browser only. Feedback is optional, anonymous and has no bearing on your grades.","feedback":{"url":"placeholder"},"guides":{"5e":{"name":"5E","phases":[{"id":"engage","name":"Engage"},{"id":"explore","name":"Explore"},{"id":"explain","name":"Explain"},{"id":"elaborate","name":"Elaborate"},{"id":"evaluate","name":"Evaluate"}],"groups":[],"misapplications":{"mis-labels":{"name":"Labels without logic","looksLike":"Existing lessons re-badged with E headings; order unchanged.","why":"Explanation still precedes experience, so there is no mechanism for conceptual change.","fix":"Rebuild around one big question and move practical work before explanation."},"mis-one-lesson":{"name":"Five Es in one lesson","looksLike":"Ten minutes per phase, every lesson.","why":"No time to explore or transfer; phases become rituals.","fix":"Plan 5E across 4–12 lessons."},"mis-entertainment":{"name":"Engage as entertainment","looksLike":"A fun video or demonstration with no link to the concept.","why":"Motivation without elicitation; prior ideas stay hidden.","fix":"Require a prediction or explanation and record it."},"mis-confirmation":{"name":"Explore as confirmation","looksLike":"A recipe practical run after the theory.","why":"Students verify rather than investigate.","fix":"Run the investigation first and hold back the answer."},"mis-monologue":{"name":"Explain as teacher monologue","looksLike":"Lessons of slides and notes with no student talk.","why":"Students' ideas are bypassed and misconceptions persist.","fix":"Students explain first; build on their data."},"mis-no-explain":{"name":"Explore without Explain","looksLike":"Open inquiry with no consolidation.","why":"Students leave with vague or wrong ideas.","fix":"Always follow Explore with explicit sense-making."},"mis-no-elaborate":{"name":"Missing Elaborate","looksLike":"The sequence ends at Explain, then a test.","why":"No transfer; understanding stays bound to one context.","fix":"Plan a new context that demands the concept."},"mis-end-only":{"name":"Evaluate only at the end","looksLike":"One summative test.","why":"No chance to respond to misconceptions during the sequence.","fix":"Embed formative checks in every phase."}},"lookFors":{"engage-link":{"phaseId":"engage","question":"Is the hook conceptually linked to the big idea, or just entertaining?","strong":"The phenomenon is the one the sequence will explain.","weak":"An unrelated video or demonstration used for attention only."},"engage-elicit":{"phaseId":"engage","question":"Are student ideas elicited and recorded?","strong":"Predictions are written down and kept for later comparison.","weak":"Student thinking is never surfaced."},"engage-question":{"phaseId":"engage","question":"Does Engage raise the question the sequence will answer?","strong":"A driving question is posed and displayed.","weak":"The lesson moves straight to definitions."},"explore-before-explain":{"phaseId":"explore","question":"Does the investigation come before the formal explanation?","strong":"Students would still need to think even if they knew the answer.","weak":"A confirmation practical run after the theory."},"explore-own-data":{"phaseId":"explore","question":"Is the data the students' own?","strong":"Students generate and record their own evidence.","weak":"Results are given or a conclusion is pre-scaffolded."},"explore-feeds-explain":{"phaseId":"explore","question":"Does the activity produce the evidence Explain will draw on?","strong":"Explain explicitly uses the Explore results.","weak":"Explore and Explain are disconnected."},"explain-students-first":{"phaseId":"explain","question":"Do students explain first, before the teacher?","strong":"Groups present and interpret their own data.","weak":"The teacher explains and students copy notes."},"explain-links-data":{"phaseId":"explain","question":"Does the explanation refer back to the class's own data?","strong":"The teacher cites group results when introducing concepts.","weak":"Explanation is disconnected from the investigation."},"explain-representations":{"phaseId":"explain","question":"Are multiple representations used?","strong":"Macroscopic, particulate, symbolic and graphical views are connected.","weak":"One representation, usually text."},"explain-conceptions":{"phaseId":"explain","question":"Are the Engage ideas explicitly revisited?","strong":"Students name what has changed in their thinking.","weak":"Prior ideas are never returned to."},"elaborate-new-context":{"phaseId":"elaborate","question":"Is the context genuinely different from Explore?","strong":"A new setting that requires transfer.","weak":"A repeat of the Explore activity or textbook questions."},"elaborate-requires-concept":{"phaseId":"elaborate","question":"Does the task demand the concept?","strong":"The task cannot be completed without using the concept.","weak":"Students can succeed without the science."},"elaborate-demand":{"phaseId":"elaborate","question":"Is cognitive demand higher than in Explore?","strong":"Students apply, analyse, design or evaluate.","weak":"Students recall definitions."},"evaluate-aligned":{"phaseId":"evaluate","question":"Is the assessment aligned with the outcomes actually taught?","strong":"Tasks map to the stated outcomes and success criteria.","weak":"Assessment covers content not taught, or omits Working scientifically."},"evaluate-understanding":{"phaseId":"evaluate","question":"Does it test understanding and application, not just recall?","strong":"Students explain an unfamiliar scenario.","weak":"Recall-only multiple choice."},"evaluate-revisit":{"phaseId":"evaluate","question":"Do students return to their initial ideas?","strong":"I used to think… now I think… because…","weak":"No metacognitive comparison."},"evaluate-formative":{"phaseId":"evaluate","question":"Are formative checks built into every phase?","strong":"Checks appear throughout and inform adjustment.","weak":"One test at the end."}}},"adi":{"name":"Argument-Driven Inquiry","phases":[{"id":"task-question","name":"Task and guiding question","group":"investigate"},{"id":"design-data","name":"Design the method and collect data","group":"investigate"},{"id":"tentative-argument","name":"Analysis and tentative argument","group":"investigate"},{"id":"argumentation","name":"Argumentation session","group":"argue"},{"id":"reflective-discussion","name":"Explicit and reflective discussion","group":"argue"},{"id":"report","name":"Investigation report","group":"write-review"},{"id":"peer-review","name":"Double-blind peer review","group":"write-review"},{"id":"revision","name":"Revision and submission","group":"write-review"}],"groups":[{"id":"investigate","name":"Investigate"},{"id":"argue","name":"Argue"},{"id":"write-review","name":"Write and review"}],"misapplications":{"mis-adi-closed-question":{"name":"A closed guiding question","looksLike":"A question with one obvious answer.","why":"With nothing to argue about, argumentation and review become theatre.","fix":"Choose questions where defensible answers can differ with method or interpretation."},"mis-adi-given-method":{"name":"The teacher supplies the method","looksLike":"All groups follow the same procedure.","why":"Critique of design is impossible, and WS-03 is never assessed.","fix":"Approve plans for safety and feasibility, and let designs differ."},"mis-adi-no-justification":{"name":"Claim and evidence without justification","looksLike":"A whiteboard with a claim and a results table.","why":"The scientific reasoning stays implicit, so it cannot be critiqued or taught.","fix":"Require a justification that says why the evidence counts."},"mis-adi-teacher-judges":{"name":"The teacher adjudicates","looksLike":"The teacher says which group is right after each presentation.","why":"Authority replaces evidence, and students stop critiquing.","fix":"Hold the science back until the reflective discussion, and let critique run on evidence."},"mis-adi-skip-review":{"name":"Cutting the argumentation or review stages","looksLike":"The sequence runs from data straight to a report handed to the teacher.","why":"The stages that distinguish ADI from a practical report are exactly the ones cut.","fix":"Shorten data collection rather than argumentation; plan 6–8 lessons from the start."},"mis-adi-group-report":{"name":"One report per group","looksLike":"A shared document with three names on it.","why":"Individual reasoning is never made visible or assessed.","fix":"Share the data, write individually."}},"lookFors":{"adi-question-open":{"phaseId":"task-question","question":"Does the guiding question admit more than one plausible answer?","strong":"Reasonable groups could reach different conclusions from the same materials.","weak":"The question has one obvious answer, so there is nothing to argue."},"adi-criteria-shared":{"phaseId":"task-question","question":"Do students know what a strong argument looks like before they start?","strong":"Claim, evidence and justification criteria are displayed and discussed.","weak":"Criteria appear only when work is marked."},"adi-tool-talk":{"phaseId":"task-question","question":"Do students know how to use the equipment and what the hazards are?","strong":"A brief demonstration of technique and a risk discussion precede planning.","weak":"Students improvise with unfamiliar equipment."},"adi-student-designed":{"phaseId":"design-data","question":"Did students design the method?","strong":"Groups' methods differ from each other in defensible ways.","weak":"Every group follows the same supplied procedure."},"adi-plan-checkpoint":{"phaseId":"design-data","question":"Is the plan checked before data collection?","strong":"A short conference covers safety, feasibility and reliability.","weak":"Groups start collecting with unworkable or unsafe plans."},"adi-reliability":{"phaseId":"design-data","question":"Have students thought about how much data they need and how reliable it is?","strong":"Sample size, repeats and controls appear in the plan.","weak":"A single measurement is treated as sufficient."},"adi-three-part":{"phaseId":"tentative-argument","question":"Does the whiteboard show a claim, evidence and a justification?","strong":"All three are present and distinguishable.","weak":"A claim with raw data underneath and no justification."},"adi-analysis":{"phaseId":"tentative-argument","question":"Have the data been analysed and represented?","strong":"Means, ranges, graphs or comparisons appear, chosen to answer the question.","weak":"An unprocessed results table."},"adi-justification":{"phaseId":"tentative-argument","question":"Does the justification connect evidence to the claim using science?","strong":"Students explain why this evidence is relevant and sufficient.","weak":"Because that's what we found."},"adi-critique-quality":{"phaseId":"argumentation","question":"Are the questions about evidence and justification?","strong":"Students ask how many samples, how the data were analysed, and why the evidence supports the claim.","weak":"Comments about neatness, or agreement without questions."},"adi-talk-norms":{"phaseId":"argumentation","question":"Is critique directed at ideas rather than people?","strong":"Sentence stems are displayed and used, and disagreement is normal.","weak":"Students avoid disagreeing, or critique becomes personal."},"adi-revision-record":{"phaseId":"argumentation","question":"Is revision visible?","strong":"Each group records what changed in its argument and why.","weak":"Arguments are unchanged after the session."},"adi-concept-consolidated":{"phaseId":"reflective-discussion","question":"Is the scientific concept made explicit at the end?","strong":"Students leave knowing the accepted explanation and how it relates to their arguments.","weak":"The sequence ends with competing claims and no resolution."},"adi-nos-explicit":{"phaseId":"reflective-discussion","question":"Is the nature of science discussed explicitly?","strong":"The class names ideas such as evidence, justification and peer review.","weak":"The practice is performed but never discussed."},"adi-individual-writing":{"phaseId":"report","question":"Is the report written individually?","strong":"Each student produces their own argument, even from shared data.","weak":"One report per group, copied."},"adi-report-structure":{"phaseId":"report","question":"Does the report answer the three guiding questions?","strong":"Purpose, method with reasons, and a three-part argument are all present.","weak":"A traditional aim, method, results, conclusion template with no justification."},"adi-review-rubric":{"phaseId":"peer-review","question":"Is the review criterion-based, with reasons?","strong":"Each criterion carries a comment explaining the judgement.","weak":"Ticks only, or general praise."},"adi-review-accountable":{"phaseId":"peer-review","question":"Are reviewers accountable for review quality?","strong":"The teacher samples reviews and sends weak ones back.","weak":"Reviews go straight to authors unchecked."},"adi-revision-used":{"phaseId":"revision","question":"Did the feedback change the report?","strong":"Authors show what they changed, or argue why they did not.","weak":"Identical drafts and final versions."},"adi-final-standard":{"phaseId":"revision","question":"Is the final report marked against the criteria students used?","strong":"The same claim, evidence and justification criteria run from stage 1 to stage 8.","weak":"A different marking rubric appears at the end."}}},"poe":{"name":"Predict–Observe–Explain","phases":[{"id":"predict","name":"Predict"},{"id":"observe","name":"Observe"},{"id":"explain","name":"Explain"}],"groups":[],"misapplications":{"mis-poe-not-discrepant":{"name":"No real surprise","looksLike":"An event most students predict correctly.","why":"Without a mismatch there is no pressure to change ideas.","fix":"Choose events from documented alternative conceptions, and trial them with a colleague."},"mis-poe-no-reasons":{"name":"Predictions without reasons","looksLike":"Students record only what they think will happen.","why":"The underlying idea never surfaces, so there is nothing to revise.","fix":"Require a because statement for every prediction."},"mis-poe-cued":{"name":"Cued predictions","looksLike":"Wording or tone signals the expected answer.","why":"Students predict what they think the teacher wants, hiding their real ideas.","fix":"Present the set-up neutrally and collect predictions before any hint."},"mis-poe-ambiguous":{"name":"An observation students can dismiss","looksLike":"A small, unclear or unrepeatable effect.","why":"Students explain away the result rather than their prediction.","fix":"Make the result visible and checkable, and repeat it on request."},"mis-poe-quiz":{"name":"POE as a quiz","looksLike":"The teacher asks who got it right and moves on.","why":"Wrong predictors feel judged and no one revises their thinking.","fix":"Treat every prediction as useful evidence of thinking, and spend most time on explanation."},"mis-poe-one-off":{"name":"A one-off demonstration","looksLike":"A POE with no link to the lessons that follow.","why":"Conflict without follow-up rarely produces lasting change.","fix":"Keep predictions and revisit them in the next lessons."}},"lookFors":{"poe-discrepant":{"phaseId":"predict","question":"Is the event likely to contradict the most common prediction?","strong":"Chosen from a documented alternative conception; many students will predict wrongly.","weak":"Most students will predict correctly, so there is no conflict."},"poe-commit-written":{"phaseId":"predict","question":"Does every student commit individually, in writing, before observing?","strong":"Written predictions are collected or displayed before the event runs.","weak":"A few students call out predictions orally."},"poe-reasons":{"phaseId":"predict","question":"Are students asked why, not just what?","strong":"Prediction sheets require a reason for each prediction.","weak":"Only an outcome is recorded."},"poe-no-cueing":{"phaseId":"predict","question":"Is the set-up free of cues to the expected answer?","strong":"Neutral wording and presentation; no hint of the surprise.","weak":"The teacher's framing signals the \"right\" answer."},"poe-observe-visible":{"phaseId":"observe","question":"Can every student see and check the outcome?","strong":"A visualiser, small-group sets or repeat runs make the result unambiguous.","weak":"A front-bench demonstration half the class cannot see."},"poe-observe-record":{"phaseId":"observe","question":"Do students record observations before discussing them?","strong":"Observation boxes are completed before any talk about why.","weak":"The teacher narrates what happened."},"poe-observe-inference":{"phaseId":"observe","question":"Are observations kept separate from inferences?","strong":"Students distinguish what they saw from what they think it means.","weak":"Explanations are written as if they were observations."},"poe-reconcile":{"phaseId":"explain","question":"Do students explicitly compare their prediction with the observation?","strong":"Students write or say what matched, what did not, and why.","weak":"The class moves straight to the answer."},"poe-revise":{"phaseId":"explain","question":"Do students revise their own explanations before the teacher explains?","strong":"Revised explanations are drafted in pairs, then shared.","weak":"The teacher explains immediately."},"poe-consolidate":{"phaseId":"explain","question":"Does the teacher consolidate the science and name the alternative conception?","strong":"The scientific explanation is made explicit and contrasted with the common idea.","weak":"The episode ends with surprise but no resolution."},"poe-followup":{"phaseId":"explain","question":"Is the POE connected to later learning?","strong":"Predictions are kept and revisited, and the next lessons build on the conflict.","weak":"A one-off demonstration with nothing after it."}}}},"paths":[{"id":"5e","title":"5E path","blurb":"From spotting the five phases in a classroom to explaining why each one sits where it does.","kind":"guide","journey":"5e","models":[],"requires":[],"rail":"phases","guide":"5e","upcoming":0},{"id":"poe","title":"POE path","blurb":"Predict, Observe, Explain. One lesson that makes students' ideas visible and then puts them to the test.","kind":"guide","journey":"poe","models":[],"requires":[],"rail":"phases","guide":"poe","upcoming":0},{"id":"adi","title":"ADI path","blurb":"Argument-Driven Inquiry. Students investigate, argue from their own evidence, then write, review and revise. The arguing and reviewing are the point.","kind":"guide","journey":"adi","models":[],"requires":[{"path":"poe","level":"explain"}],"rail":"groups","guide":"adi","upcoming":0},{"id":"select","title":"Choosing a model","blurb":"Which model fits this class, and why? The reckoner is the answer key, so your reasons have to match the class, not your favourite model.","kind":"select","journey":"5e","models":["5e","poe","adi"],"requires":[{"path":"5e","level":"explain"},{"path":"poe","level":"explain"}],"rail":"phases","guide":null,"upcoming":0}],"lessons":[{"id":"5e-1-willow","path":"5e","order":1,"title":"The Willow Problem","summary":"Where does a tree's mass come from? Spot the 5E phases in a photosynthesis sequence, then fix a flawed plan.","level":"recognise","version":"1.0.0","status":"published","guideSection":"phases","requires":[],"items":[{"id":"predict","at":"engage","processing":"Retrieval","kind":"Predict","title":"A 2 kg willow sapling is planted in a tub of dried, weighed soil. Five years of watering later, the tree weighs about 77 kg.","q":"Where did most of that extra mass come from?","why":"You've just been through Engage. Making a committed prediction, with a confidence rating, brings prior ideas into the open before any teaching. In a Year 7 class, many students choose soil. Their ideas become the raw material for the rest of the sequence, so Engage elicits them and leaves them uncorrected.","type":"predict","options":[{"text":"The soil"},{"text":"The water"},{"text":"Carbon dioxide from the air"},{"text":"Sunlight"}],"answer":2,"reveal":"Jan Baptist van Helmont ran this experiment in the 1640s. The soil lost only about 57 g. He concluded the mass came from water. Most of a tree's dry mass is actually carbon, fixed from atmospheric CO₂ during photosynthesis."},{"id":"spot1","at":"explore","processing":"Comprehension","kind":"Spot the phase","tests":"explore","vignette":{"who":"Year 7 · Living world","text":"Pairs place spinach leaf discs in bicarbonate solution under a lamp and count how many float each minute. The teacher moves between groups asking “What are you noticing? What might be causing it?” and gives no answers."},"q":"Which 5E phase is this?","hint":"Ask who is doing the explaining, and whether students have the scientific concept yet.","why":"Pre-service teachers often explain during Explore because silence feels unhelpful. Holding back gives the class a shared first-hand experience for the explanation to attach to later.","type":"spot","answer":"explore","fb":{"engage":"Engage hooks interest and draws out ideas. These students are already collecting data.","explore":"Students work with the phenomenon first-hand while the teacher asks questions and holds back answers. That restraint defines Explore.","explain":"No terms or scientific account have been introduced, and the teacher is deliberately withholding answers.","elaborate":"Elaborate applies a concept students already have. They don't have one to apply yet.","evaluate":"Nothing is being judged against a learning goal yet."},"variants":[]},{"id":"spot2","at":"explore","processing":"Comprehension","kind":"Spot the phase","tests":"explain","vignette":{"who":"Year 7 · Living world","text":"Using the class's float-count graph, the teacher introduces the term photosynthesis and builds the word equation on the board. Students annotate the graph to show where the gas in the floating discs came from."},"q":"Which 5E phase is this?","hint":"New vocabulary is a strong signal.","why":"In 5E the explanation is anchored to students' own observations. Teaching the word equation without that experience behind it turns the prac into a confirmation exercise.","type":"spot","answer":"explain","fb":{"engage":"Students are past the hook. They are being given the scientific account.","explore":"The investigation is finished. The teacher is now supplying the canonical explanation.","explain":"Formal terms and the scientific explanation arrive here, tied directly to data the students produced.","elaborate":"The concept is still being built. It isn't yet being transferred to a new context.","evaluate":"The annotation here is sense-making, not assessment."},"variants":[]},{"id":"concept","at":"explain","processing":"Retrieval","kind":"The model","title":"The 5E instructional model","type":"concept","lead":"Students build understanding by reconciling new experiences with what they already think. 5E puts that process in order, and gives each phase a defining teacher move.","rows":[{"phaseId":"engage","does":"Access prior ideas and raise a question worth answering.","move":"Teacher move: elicit, don't correct."},{"phaseId":"explore","does":"A shared, first-hand experience of the phenomenon.","move":"Teacher move: question, don't tell."},{"phaseId":"explain","does":"Scientific concepts and terms, linked to that experience.","move":"Teacher move: name it and connect it."},{"phaseId":"elaborate","does":"Apply the concept in a new context.","move":"Teacher move: stretch and transfer."},{"phaseId":"evaluate","does":"Students and teacher judge how understanding has changed.","move":"Teacher move: look for change, throughout the sequence."}],"cite":"Bybee et al. (2006), The BSCS 5E Instructional Model: Origins and Effectiveness. BSCS."},{"id":"why5e","at":"explain","processing":"Comprehension","kind":"Select all that apply","tests":"explain","title":"Why does 5E put Explore before Explain?","q":"Select every reason that holds.","hint":"Three are correct. Watch for the common misreading of constructivism as discovery learning.","why":"Critiques of minimal guidance (Kirschner, Sweller & Clark, 2006) target unguided discovery. 5E answers them with a structured, teacher-led Explain phase that follows the experience.","refs":{"phaseIds":[],"lookForIds":["explore-before-explain"],"exampleIds":[],"sequenceIds":[],"misapplicationIds":[]},"type":"multi","options":[{"text":"Students get a concrete experience that new terms can attach to","ok":true,"fb":"Yes. Vocabulary sticks better when it names something students have already seen."},{"text":"Students' existing ideas are tested against evidence before they are replaced","ok":true,"fb":"Yes. This is the conceptual-change logic at the heart of the model."},{"text":"It saves lesson time by skipping direct instruction","ok":false,"fb":"No. Explain still includes direct instruction. 5E reorders it."},{"text":"The teacher's explanation can refer back to what students observed","ok":true,"fb":"Yes. “Remember when the discs floated faster near the lamp?” is a powerful Explain move."},{"text":"Students should discover the scientific concept without help","ok":false,"fb":"No. 5E is guided inquiry. The teacher supplies the scientific explanation in Explain."}]},{"id":"order","at":"elaborate","processing":"Comprehension","kind":"Sequence it","tests":"sequence","title":"Put this Stage 4 photosynthesis sequence in 5E order.","q":"Tap each activity in the order you'd teach it. Tap a placed activity to remove it.","why":"Look at Evaluate here: students return to their own earlier idea. Evaluating against a learner's starting point is what makes it constructivist rather than a generic test.","refs":{"phaseIds":[],"lookForIds":[],"exampleIds":["evaluate-pos-tree"],"sequenceIds":[],"misapplicationIds":[]},"type":"order","steps":[{"text":"Students predict where a tree's mass comes from, then think-pair-share","phaseId":"engage"},{"text":"Leaf-disc investigation with the lamp at different distances","phaseId":"explore"},{"text":"Class builds the word equation from its own float-count data","phaseId":"explain"},{"text":"Students advise a local nursery on greenhouse lighting","phaseId":"elaborate"},{"text":"Students revisit their first prediction and explain what changed their thinking","phaseId":"evaluate"}],"variants":[]},{"id":"move1","at":"elaborate","processing":"Analysis","kind":"Teacher move","tests":"explore","vignette":{"who":"During Explore","text":"A student says: “The discs float because the lamp heats them up.”"},"q":"What is the best response at this point?","hint":"Which response keeps the student doing the thinking?","why":"Alternative ideas are useful data during Explore. Turning them into testable questions models scientific reasoning and keeps the cognitive work with students.","type":"choice","options":[{"text":"“Not quite. It's oxygen from photosynthesis.”","fb":"Correct science at the wrong moment. Telling cuts off the student's reasoning before the class has evidence. Save it for Explain."},{"text":"“How could you test whether it's the heat or the light?”","fb":"This treats the idea as a hypothesis worth testing. A heat filter, or a water bath to hold the temperature, would separate light from heat."},{"text":"“Good idea! Write that down.”","fb":"Accepting the idea without challenge leaves it untested, and the class may treat it as confirmed."},{"text":"“We'll cover that next lesson.”","fb":"Deferring tells the student the idea doesn't matter. Explore is exactly where it should be tested."}],"answer":1,"variants":[]},{"id":"says","at":"elaborate","processing":"Analysis","kind":"Student says","tests":"engage","vignette":{"who":"Mia, Year 7 · Engage response","text":"“Plants get their food from the soil through their roots.”"},"q":"What does this tell you about Mia's thinking?","why":"Naming a conception precisely tells you what evidence will challenge it. “Mia is wrong” gives you nothing to plan with. “Mia thinks the mass comes from soil” points straight at the next activity.","type":"choice","options":[{"text":"She's correct: roots absorb nutrients","fb":"Roots take up water and mineral ions, but these aren't the plant's food. Sugars are made in the leaves."},{"text":"She treats water and minerals as food, so she sees soil as the source of the plant's mass","fb":"Yes. This is one of the most persistent conceptions in school biology, and many adults still hold it."},{"text":"She has mixed up photosynthesis and respiration","fb":"That is a separate common conception. Mia's idea is about where food comes from, not how energy is released."},{"text":"She doesn't think plants need food","fb":"She clearly thinks plants need food. She has the wrong source."}],"answer":1,"variants":[]},{"id":"conflict","at":"elaborate","processing":"Knowledge utilisation","kind":"Choose the activity","tests":"explore","title":"Which activity is most likely to create productive conflict with Mia's idea?","why":"Conceptual change needs four conditions: dissatisfaction with the current idea, and a new idea that is intelligible, plausible and fruitful. Data that the old idea can't explain supplies the first.","type":"choice","options":[{"text":"Give students van Helmont's data: the willow gained about 74 kg while the soil lost about 57 g. Ask them to account for the difference.","fb":"The numbers clash directly with her model. Posner et al. (1982) argue that dissatisfaction with an existing idea is the first condition for conceptual change."},{"text":"Give her the correct definition of photosynthesis to copy into her book.","fb":"A definition can sit alongside her soil idea without displacing it. Students often hold both at once."},{"text":"Set a labelling worksheet on root structure.","fb":"This keeps the focus on roots and may reinforce the soil-as-food idea."},{"text":"Show a time-lapse of a bean seedling growing.","fb":"Engaging, but nothing in it challenges where the mass comes from."}],"answer":0,"variants":[]},{"id":"fix","at":"evaluate","processing":"Knowledge utilisation","kind":"Fix the plan","tests":"sequence","title":"A pre-service teacher submits this 5E sequence.","plan":[{"phaseId":"engage","text":"3-minute video on rainforests"},{"phaseId":"explain","text":"Teacher notes on photosynthesis and the word equation"},{"phaseId":"explore","text":"Leaf-disc prac to confirm the equation"},{"phaseId":"elaborate","text":"Greenhouse design task"},{"phaseId":"evaluate","text":"End-of-topic test"}],"q":"What is the most important problem?","hint":"Check whether each phase can do its job given what came before it.","why":"This is the most common error in pre-service 5E plans. A quick check: could students do the Explore activity without already knowing the answer? If not, it isn't Explore.","refs":{"phaseIds":[],"lookForIds":["explore-before-explain"],"exampleIds":[],"sequenceIds":[],"misapplicationIds":["mis-confirmation"]},"type":"choice","options":[{"text":"Explain comes before Explore, so the prac only confirms what students were told","fb":"Students have no experience to reason from before the explanation, and the prac becomes a recipe."},{"text":"The Engage video is too short","fb":"Length isn't the issue. A better question is whether it draws out students' ideas. This one probably doesn't, but the ordering problem matters more."},{"text":"Elaborate should come last","fb":"Evaluate usually closes the sequence, and it also runs throughout."},{"text":"Evaluate should be a quiz, not a test","fb":"Format matters less than timing and purpose. In 5E, evaluation runs throughout and includes students reviewing their own thinking."}],"answer":0,"variants":[]},{"id":"reflect","at":"evaluate","processing":"Metacognition","kind":"Look back","title":"Back to the willow.","q":"A Year 7 student tells you the tree's mass came from the soil. Write one question you'd ask them. Make it an Engage or Explore move, not an answer.","type":"reflect","model":"Example: “If the tree took 74 kg from the soil, what would you expect to happen to the soil? How could we check?”","recall":"predict"}]},{"id":"5e-2-cells","path":"5e","order":2,"title":"Cells under the lens","summary":"Is a mushroom made of cells? Learn what each 5E phase looks like when it's working, using the guide's look-fors.","level":"recognise","version":"1.0.0","status":"published","guideSection":"sequences","requires":[],"items":[{"id":"predict","at":"engage","processing":"Retrieval","kind":"Predict","title":"A Year 7 class sorts four things on the bench. A seed, a mushroom, a pinch of dried yeast and a salt crystal.","q":"Which of them are made of cells?","why":"The guide's sequence opens with exactly this kind of sort, and each group writes down the rule it used. Those rules go on a thinking wall and get tested for the next nine lessons. Engage collects the rules; it doesn't correct them.","type":"predict","options":[{"text":"Only the seed"},{"text":"The seed and the mushroom"},{"text":"The seed, the mushroom and the yeast"},{"text":"All four, including the crystal"}],"answer":2,"reveal":"The seed, the mushroom and the yeast are all made of cells. A mushroom is the fruiting body of a fungus, built from threads of cells, and each yeast granule holds many single-celled fungi. The crystal is not alive. Many Year 7 students think fungi, and even plants, are not made of cells."},{"id":"spot-rotation","at":"explore","processing":"Comprehension","kind":"Spot the phase","tests":"explore","vignette":{"who":"Year 7 · Lessons 2–4","text":"Groups rotate through microscope stations: onion skin, Elodea leaf, yeast in sugar water and pond water. At each one they draw what they see at two magnifications, estimate its size, and add to a list of what every sample has in common."},"q":"Which 5E phase is this?","why":"The guide's watch-for for this sequence is the urge to open with a labelled animal cell. Explore works here because students see real cells before anyone tells them what to look for.","type":"spot","answer":"explore","fb":{"engage":"Engage was the alive or not alive sort. These students are already gathering evidence.","explore":"Students collect their own observations before any cell diagram or vocabulary. That's Explore.","explain":"Nobody has named an organelle yet. The list of common features is students' own.","elaborate":"There's no concept to transfer yet. Students are still building it.","evaluate":"Drawings are checked for scale and labels, but the job here is investigating, not judging."},"variants":[{"vignette":{"who":"Year 7 · Lesson 3","text":"At the pond-water station, pairs search for anything that moves, sketch it, and argue about whether it is one cell or many. The teacher asks “How could you tell?” and moves on without settling it."}}]},{"id":"lf-own-data","at":"explore","processing":"Comprehension","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Year 7 · Elodea station","text":"Students draw the Elodea leaf at 100× and 400×, estimate the size of one green box using the field of view, and record it in their own table beside their onion and cheek-cell drawings."},"why":"Look-fors are the guide's quality checks. Learning them lets you see whether a phase is doing its job, not just whether it has the right label.","type":"lookfor","answer":"explore-own-data","distractors":["engage-elicit","explain-students-first","elaborate-new-context"],"strong":true,"variants":[]},{"id":"lf-diagram-first","at":"explore","processing":"Analysis","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Another Year 7 class · Lesson 2","text":"The lesson opens with a labelled diagram of an animal cell. At each microscope station, students tick off the organelles from the diagram as they find them."},"hint":"Could students do this activity if they already knew the answer?","why":"For biology-trained teachers, opening with the diagram feels efficient. It turns the microscope lessons into spot-the-organelle, so students confirm rather than investigate.","refs":{"phaseIds":[],"lookForIds":[],"exampleIds":[],"sequenceIds":["seq-s4-cells"],"misapplicationIds":["mis-confirmation"]},"type":"lookfor","answer":"explore-before-explain","distractors":["engage-question","explain-representations","evaluate-formative"],"strong":false,"variants":[]},{"id":"spot-theory","at":"explain","processing":"Comprehension","kind":"Spot the phase","tests":"explain","vignette":{"who":"Year 7 · Lesson 5","text":"Groups share their drawings. The teacher introduces cell theory and the names of key organelles, using the class's own images and a 3D cell model to challenge the idea that cells are flat."},"q":"Which 5E phase is this?","type":"spot","answer":"explain","fb":{"engage":"The class's ideas were drawn out in lesson 1. Now the scientific account is arriving.","explore":"The microscope work is done. The teacher is naming and connecting what students saw.","explain":"Cell theory and organelle names arrive here, attached to students' own drawings. That's Explain.","elaborate":"The concept is still being built. Transfer to a new task comes next.","evaluate":"This is sense-making, not judging whether students have the idea."},"variants":[]},{"id":"lf-links-data","at":"explain","processing":"Comprehension","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Year 7 · Lesson 5","text":"Introducing the cell wall, the teacher puts two students' Elodea drawings beside a cheek-cell drawing and asks what the plant cells have that the cheek cells don't."},"why":"Using students' own drawings is what lets the new word, cell wall, attach to something they saw rather than something they copied.","type":"lookfor","answer":"explain-links-data","distractors":["engage-link","explore-feeds-explain","elaborate-requires-concept"],"strong":true,"variants":[]},{"id":"move-elodea","at":"elaborate","processing":"Analysis","kind":"Teacher move","tests":"explore","vignette":{"who":"During Explore · Elodea station","text":"You want to find out whether a student thinks plants are made of cells, without telling them."},"q":"Which question does that best?","why":"A good Explore question is diagnostic: the answer tells you what the student thinks. A question that can be answered by recall tells you only what they've memorised.","refs":{"phaseIds":[],"lookForIds":[],"exampleIds":[],"sequenceIds":["seq-s4-cells"],"misapplicationIds":[]},"type":"choice","options":[{"text":"“Can you label the chloroplasts for me?”","fb":"This assumes the student already knows what the green structures are, and tests vocabulary rather than their idea."},{"text":"“Are those boxes part of the leaf, or is the whole leaf made of them? How could you check?”","fb":"This surfaces the student's model of a leaf and hands them a way to test it. It's the guide's scaffold question for this station."},{"text":"“Plant cells have walls, don't they?”","fb":"A leading question gets agreement, not the student's thinking."},{"text":"“Draw it neatly so it's ready for your book.”","fb":"Neat drawings matter, but this question reveals nothing about what the student thinks."}],"answer":1,"variants":[]},{"id":"lf-transfer","at":"elaborate","processing":"Comprehension","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Year 7 · Lessons 7–9","text":"Students build a dichotomous key for ten organisms from their own schoolyard survey, then swap keys and test them on another group's specimen photos."},"why":"The class moves from recognising cell structures to using structural features to classify. Same science, new setting, higher demand.","type":"lookfor","answer":"elaborate-new-context","distractors":["explore-own-data","evaluate-aligned","engage-question"],"strong":true,"variants":[]},{"id":"lf-revisit","at":"evaluate","processing":"Comprehension","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Year 7 · Lesson 10","text":"Students take out their lesson 1 sort, move the cards with evidence from the unit, and write “I used to think… now I think… because…”."},"why":"Returning to the lesson 1 sort is what lets students, and you, see their thinking change. A test on its own can't show that.","type":"lookfor","answer":"evaluate-revisit","distractors":["engage-elicit","explain-students-first","elaborate-demand"],"strong":true,"variants":[]},{"id":"order","at":"evaluate","processing":"Comprehension","kind":"Sequence it","tests":"sequence","title":"Put the cells sequence in 5E order.","q":"Tap each activity in the order you'd teach it. Tap a placed activity to remove it.","type":"order","steps":[{"text":"Sort a seed, yeast, a mushroom and a crystal into alive and not alive, and record the rule","phaseId":"engage"},{"text":"Microscope rotation, drawing every sample at two magnifications","phaseId":"explore"},{"text":"Cell theory and organelles, introduced from the class's own drawings","phaseId":"explain"},{"text":"Build and peer-test a dichotomous key for schoolyard organisms","phaseId":"elaborate"},{"text":"Revise the lesson 1 sort with evidence and explain what changed","phaseId":"evaluate"}],"variants":[{"title":"Put this classification sequence in 5E order.","steps":[{"text":"Groups argue whether a lichen-covered rock is alive, and post their reasons on the thinking wall","phaseId":"engage"},{"text":"Pond-water microscopy, sketching and sizing every organism found","phaseId":"explore"},{"text":"The teacher models a dichotomous key using the class's pond-water sketches","phaseId":"explain"},{"text":"Students classify an unfamiliar set of specimen photos with a key they design","phaseId":"elaborate"},{"text":"Students revisit the lichen argument and justify a final answer with cell evidence","phaseId":"evaluate"}]}]},{"id":"reflect","at":"evaluate","processing":"Metacognition","kind":"Look back","title":"The labelled diagram can wait.","q":"A colleague wants to open the cells unit with a labelled cell diagram “to save time”. Write one or two sentences you'd say to them.","type":"reflect","model":"Example: “If they see the labelled diagram first, the microscope lessons turn into spot-the-organelle. Let them draw real cells first, so the words attach to what they saw.”","recall":"predict"}]},{"id":"5e-3-outbreak","path":"5e","order":3,"title":"Outbreak","summary":"Why does the simulation come before herd immunity is named? Explain why each phase sits where it does.","level":"explain","version":"1.0.0","status":"published","guideSection":"sequences","requires":[],"items":[{"id":"predict","at":"engage","processing":"Retrieval","kind":"Predict","title":"In a classroom outbreak simulation, a third of the students are “vaccinated”. Their cups can't be infected, so they can't pass the infection on.","q":"Compared with a class where nobody is vaccinated, what happens to the unvaccinated students' chance of being infected?","why":"“Vaccines only protect the person vaccinated” is one of this sequence's target conceptions. A committed prediction makes the idea visible, so the simulation has something to challenge.","type":"predict","options":[{"text":"It stays the same. Vaccines only protect the person vaccinated."},{"text":"It goes down"},{"text":"It goes up"},{"text":"It depends only on who washes their hands"}],"answer":1,"reveal":"It goes down. Every vaccinated student is a link the infection can't pass through, so chains of transmission break and fewer infections reach the unvaccinated. That's herd immunity, and the simulation lets students see it happen before anyone names it."},{"id":"why-sim-first","at":"explore","processing":"Comprehension","kind":"Why here?","tests":"explore","vignette":{"who":"Year 9 · Lessons 2–3","text":"Each student has a cup of clear liquid. One is secretly “infected” with dilute sodium carbonate. Over three rounds students swap liquid, test with indicator, and use their swap records to trace patient zero."},"q":"Why does this simulation come before the teacher explains herd immunity?","why":"At the Explain level, the question isn't just which phase this is, but why it's in that position. The answer is nearly always about what students need to have experienced before a concept is named.","refs":{"phaseIds":[],"lookForIds":["explore-before-explain"],"exampleIds":[],"sequenceIds":["seq-s5-disease"],"misapplicationIds":[]},"type":"choice","options":[{"text":"Students experience spread and protection first, so the term herd immunity names something they've seen","fb":"Yes. The guide's case for this sequence is that students feel exponential spread and herd immunity before they hear the terms."},{"text":"It saves time, because students will work out the immunology themselves","fb":"No. The teacher still explains pathogens, transmission and immunity in lessons 5 and 6. The simulation gives that explanation something to attach to."},{"text":"Simulations are more engaging than explanations","fb":"Engagement matters, but it isn't why the simulation sits here. A fun simulation placed after the explanation would only confirm it."},{"text":"Students need practice with indicators before the chemistry unit","fb":"The indicator is just a way to make infection visible. This sequence isn't about indicators."}],"answer":0,"variants":[]},{"id":"spot-data","at":"explore","processing":"Comprehension","kind":"Spot the phase","tests":"explore","vignette":{"who":"Year 9 · Lesson 4","text":"Groups analyse real data on measles cases against vaccination coverage, describe the pattern they see, and write a hypothesis to explain it. No one has introduced the immune system yet."},"q":"Which 5E phase is this?","hint":"Explore isn't only practical work. What matters is that students make sense of evidence before
