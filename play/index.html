nt conceptions in school biology, and many adults still hold it."},{"text":"She has mixed up photosynthesis and respiration","fb":"That is a separate common conception. Mia's idea is about where food comes from, not how energy is released."},{"text":"She doesn't think plants need food","fb":"She clearly thinks plants need food. She has the wrong source."}],"answer":1,"variants":[]},{"id":"conflict","at":"elaborate","processing":"Knowledge utilisation","kind":"Choose the activity","tests":"explore","title":"Which activity is most likely to create productive conflict with Mia's idea?","why":"Conceptual change needs four conditions: dissatisfaction with the current idea, and a new idea that is intelligible, plausible and fruitful. Data that the old idea can't explain supplies the first.","type":"choice","options":[{"text":"Give students van Helmont's data: the willow gained about 74 kg while the soil lost about 57 g. Ask them to account for the difference.","fb":"The numbers clash directly with her model. Posner et al. (1982) argue that dissatisfaction with an existing idea is the first condition for conceptual change."},{"text":"Give her the correct definition of photosynthesis to copy into her book.","fb":"A definition can sit alongside her soil idea without displacing it. Students often hold both at once."},{"text":"Set a labelling worksheet on root structure.","fb":"This keeps the focus on roots and may reinforce the soil-as-food idea."},{"text":"Show a time-lapse of a bean seedling growing.","fb":"Engaging, but nothing in it challenges where the mass comes from."}],"answer":0,"variants":[]},{"id":"fix","at":"evaluate","processing":"Knowledge utilisation","kind":"Fix the plan","tests":"sequence","title":"A pre-service teacher submits this 5E sequence.","plan":[{"phaseId":"engage","text":"3-minute video on rainforests"},{"phaseId":"explain","text":"Teacher notes on photosynthesis and the word equation"},{"phaseId":"explore","text":"Leaf-disc prac to confirm the equation"},{"phaseId":"elaborate","text":"Greenhouse design task"},{"phaseId":"evaluate","text":"End-of-topic test"}],"q":"What is the most important problem?","hint":"Check whether each phase can do its job given what came before it.","why":"This is the most common error in pre-service 5E plans. A quick check: could students do the Explore activity without already knowing the answer? If not, it isn't Explore.","refs":{"phaseIds":[],"lookForIds":["explore-before-explain"],"exampleIds":[],"sequenceIds":[],"misapplicationIds":["mis-confirmation"]},"type":"choice","options":[{"text":"Explain comes before Explore, so the prac only confirms what students were told","fb":"Students have no experience to reason from before the explanation, and the prac becomes a recipe."},{"text":"The Engage video is too short","fb":"Length isn't the issue. A better question is whether it draws out students' ideas. This one probably doesn't, but the ordering problem matters more."},{"text":"Elaborate should come last","fb":"Evaluate usually closes the sequence, and it also runs throughout."},{"text":"Evaluate should be a quiz, not a test","fb":"Format matters less than timing and purpose. In 5E, evaluation runs throughout and includes students reviewing their own thinking."}],"answer":0,"variants":[]},{"id":"reflect","at":"evaluate","processing":"Metacognition","kind":"Look back","title":"Back to the willow.","q":"A Year 7 student tells you the tree's mass came from the soil. Write one question you'd ask them. Make it an Engage or Explore move, not an answer.","type":"reflect","model":"Example: “If the tree took 74 kg from the soil, what would you expect to happen to the soil? How could we check?”","recall":"predict"}]},{"id":"5e-2-cells","path":"5e","track":null,"order":2,"title":"Cells under the lens","summary":"Is a mushroom made of cells? Learn what each 5E phase looks like when it's working, using the guide's look-fors.","level":"recognise","version":"1.0.0","status":"published","guideSection":"sequences","requires":[],"items":[{"id":"predict","at":"engage","processing":"Retrieval","kind":"Predict","title":"A Year 7 class sorts four things on the bench. A seed, a mushroom, a pinch of dried yeast and a salt crystal.","q":"Which of them are made of cells?","why":"The guide's sequence opens with exactly this kind of sort, and each group writes down the rule it used. Those rules go on a thinking wall and get tested for the next nine lessons. Engage collects the rules; it doesn't correct them.","type":"predict","options":[{"text":"Only the seed"},{"text":"The seed and the mushroom"},{"text":"The seed, the mushroom and the yeast"},{"text":"All four, including the crystal"}],"answer":2,"reveal":"The seed, the mushroom and the yeast are all made of cells. A mushroom is the fruiting body of a fungus, built from threads of cells, and each yeast granule holds many single-celled fungi. The crystal is not alive. Many Year 7 students think fungi, and even plants, are not made of cells."},{"id":"spot-rotation","at":"explore","processing":"Comprehension","kind":"Spot the phase","tests":"explore","vignette":{"who":"Year 7 · Lessons 2–4","text":"Groups rotate through microscope stations: onion skin, Elodea leaf, yeast in sugar water and pond water. At each one they draw what they see at two magnifications, estimate its size, and add to a list of what every sample has in common."},"q":"Which 5E phase is this?","why":"The guide's watch-for for this sequence is the urge to open with a labelled animal cell. Explore works here because students see real cells before anyone tells them what to look for.","type":"spot","answer":"explore","fb":{"engage":"Engage was the alive or not alive sort. These students are already gathering evidence.","explore":"Students collect their own observations before any cell diagram or vocabulary. That's Explore.","explain":"Nobody has named an organelle yet. The list of common features is students' own.","elaborate":"There's no concept to transfer yet. Students are still building it.","evaluate":"Drawings are checked for scale and labels, but the job here is investigating, not judging."},"variants":[{"vignette":{"who":"Year 7 · Lesson 3","text":"At the pond-water station, pairs search for anything that moves, sketch it, and argue about whether it is one cell or many. The teacher asks “How could you tell?” and moves on without settling it."}}]},{"id":"lf-own-data","at":"explore","processing":"Comprehension","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Year 7 · Elodea station","text":"Students draw the Elodea leaf at 100× and 400×, estimate the size of one green box using the field of view, and record it in their own table beside their onion and cheek-cell drawings."},"why":"Look-fors are the guide's quality checks. Learning them lets you see whether a phase is doing its job, not just whether it has the right label.","type":"lookfor","answer":"explore-own-data","distractors":["engage-elicit","explain-students-first","elaborate-new-context"],"strong":true,"variants":[]},{"id":"lf-diagram-first","at":"explore","processing":"Analysis","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Another Year 7 class · Lesson 2","text":"The lesson opens with a labelled diagram of an animal cell. At each microscope station, students tick off the organelles from the diagram as they find them."},"hint":"Could students do this activity if they already knew the answer?","why":"For biology-trained teachers, opening with the diagram feels efficient. It turns the microscope lessons into spot-the-organelle, so students confirm rather than investigate.","refs":{"phaseIds":[],"lookForIds":[],"exampleIds":[],"sequenceIds":["seq-s4-cells"],"misapplicationIds":["mis-confirmation"]},"type":"lookfor","answer":"explore-before-explain","distractors":["engage-question","explain-representations","evaluate-formative"],"strong":false,"variants":[]},{"id":"spot-theory","at":"explain","processing":"Comprehension","kind":"Spot the phase","tests":"explain","vignette":{"who":"Year 7 · Lesson 5","text":"Groups share their drawings. The teacher introduces cell theory and the names of key organelles, using the class's own images and a 3D cell model to challenge the idea that cells are flat."},"q":"Which 5E phase is this?","type":"spot","answer":"explain","fb":{"engage":"The class's ideas were drawn out in lesson 1. Now the scientific account is arriving.","explore":"The microscope work is done. The teacher is naming and connecting what students saw.","explain":"Cell theory and organelle names arrive here, attached to students' own drawings. That's Explain.","elaborate":"The concept is still being built. Transfer to a new task comes next.","evaluate":"This is sense-making, not judging whether students have the idea."},"variants":[]},{"id":"lf-links-data","at":"explain","processing":"Comprehension","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Year 7 · Lesson 5","text":"Introducing the cell wall, the teacher puts two students' Elodea drawings beside a cheek-cell drawing and asks what the plant cells have that the cheek cells don't."},"why":"Using students' own drawings is what lets the new word, cell wall, attach to something they saw rather than something they copied.","type":"lookfor","answer":"explain-links-data","distractors":["engage-link","explore-feeds-explain","elaborate-requires-concept"],"strong":true,"variants":[]},{"id":"move-elodea","at":"elaborate","processing":"Analysis","kind":"Teacher move","tests":"explore","vignette":{"who":"During Explore · Elodea station","text":"You want to find out whether a student thinks plants are made of cells, without telling them."},"q":"Which question does that best?","why":"A good Explore question is diagnostic: the answer tells you what the student thinks. A question that can be answered by recall tells you only what they've memorised.","refs":{"phaseIds":[],"lookForIds":[],"exampleIds":[],"sequenceIds":["seq-s4-cells"],"misapplicationIds":[]},"type":"choice","options":[{"text":"“Can you label the chloroplasts for me?”","fb":"This assumes the student already knows what the green structures are, and tests vocabulary rather than their idea."},{"text":"“Are those boxes part of the leaf, or is the whole leaf made of them? How could you check?”","fb":"This surfaces the student's model of a leaf and hands them a way to test it. It's the guide's scaffold question for this station."},{"text":"“Plant cells have walls, don't they?”","fb":"A leading question gets agreement, not the student's thinking."},{"text":"“Draw it neatly so it's ready for your book.”","fb":"Neat drawings matter, but this question reveals nothing about what the student thinks."}],"answer":1,"variants":[]},{"id":"lf-transfer","at":"elaborate","processing":"Comprehension","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Year 7 · Lessons 7–9","text":"Students build a dichotomous key for ten organisms from their own schoolyard survey, then swap keys and test them on another group's specimen photos."},"why":"The class moves from recognising cell structures to using structural features to classify. Same science, new setting, higher demand.","type":"lookfor","answer":"elaborate-new-context","distractors":["explore-own-data","evaluate-aligned","engage-question"],"strong":true,"variants":[]},{"id":"lf-revisit","at":"evaluate","processing":"Comprehension","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Year 7 · Lesson 10","text":"Students take out their lesson 1 sort, move the cards with evidence from the unit, and write “I used to think… now I think… because…”."},"why":"Returning to the lesson 1 sort is what lets students, and you, see their thinking change. A test on its own can't show that.","type":"lookfor","answer":"evaluate-revisit","distractors":["engage-elicit","explain-students-first","elaborate-demand"],"strong":true,"variants":[]},{"id":"order","at":"evaluate","processing":"Comprehension","kind":"Sequence it","tests":"sequence","title":"Put the cells sequence in 5E order.","q":"Tap each activity in the order you'd teach it. Tap a placed activity to remove it.","type":"order","steps":[{"text":"Sort a seed, yeast, a mushroom and a crystal into alive and not alive, and record the rule","phaseId":"engage"},{"text":"Microscope rotation, drawing every sample at two magnifications","phaseId":"explore"},{"text":"Cell theory and organelles, introduced from the class's own drawings","phaseId":"explain"},{"text":"Build and peer-test a dichotomous key for schoolyard organisms","phaseId":"elaborate"},{"text":"Revise the lesson 1 sort with evidence and explain what changed","phaseId":"evaluate"}],"variants":[{"title":"Put this classification sequence in 5E order.","steps":[{"text":"Groups argue whether a lichen-covered rock is alive, and post their reasons on the thinking wall","phaseId":"engage"},{"text":"Pond-water microscopy, sketching and sizing every organism found","phaseId":"explore"},{"text":"The teacher models a dichotomous key using the class's pond-water sketches","phaseId":"explain"},{"text":"Students classify an unfamiliar set of specimen photos with a key they design","phaseId":"elaborate"},{"text":"Students revisit the lichen argument and justify a final answer with cell evidence","phaseId":"evaluate"}]}]},{"id":"reflect","at":"evaluate","processing":"Metacognition","kind":"Look back","title":"The labelled diagram can wait.","q":"A colleague wants to open the cells unit with a labelled cell diagram “to save time”. Write one or two sentences you'd say to them.","type":"reflect","model":"Example: “If they see the labelled diagram first, the microscope lessons turn into spot-the-organelle. Let them draw real cells first, so the words attach to what they saw.”","recall":"predict"}]},{"id":"5e-3-outbreak","path":"5e","track":null,"order":3,"title":"Outbreak","summary":"Why does the simulation come before herd immunity is named? Explain why each phase sits where it does.","level":"explain","version":"1.0.0","status":"published","guideSection":"sequences","requires":[],"items":[{"id":"predict","at":"engage","processing":"Retrieval","kind":"Predict","title":"In a classroom outbreak simulation, a third of the students are “vaccinated”. Their cups can't be infected, so they can't pass the infection on.","q":"Compared with a class where nobody is vaccinated, what happens to the unvaccinated students' chance of being infected?","why":"“Vaccines only protect the person vaccinated” is one of this sequence's target conceptions. A committed prediction makes the idea visible, so the simulation has something to challenge.","type":"predict","options":[{"text":"It stays the same. Vaccines only protect the person vaccinated."},{"text":"It goes down"},{"text":"It goes up"},{"text":"It depends only on who washes their hands"}],"answer":1,"reveal":"It goes down. Every vaccinated student is a link the infection can't pass through, so chains of transmission break and fewer infections reach the unvaccinated. That's herd immunity, and the simulation lets students see it happen before anyone names it."},{"id":"why-sim-first","at":"explore","processing":"Comprehension","kind":"Why here?","tests":"explore","vignette":{"who":"Year 9 · Lessons 2–3","text":"Each student has a cup of clear liquid. One is secretly “infected” with dilute sodium carbonate. Over three rounds students swap liquid, test with indicator, and use their swap records to trace patient zero."},"q":"Why does this simulation come before the teacher explains herd immunity?","why":"At the Explain level, the question isn't just which phase this is, but why it's in that position. The answer is nearly always about what students need to have experienced before a concept is named.","refs":{"phaseIds":[],"lookForIds":["explore-before-explain"],"exampleIds":[],"sequenceIds":["seq-s5-disease"],"misapplicationIds":[]},"type":"choice","options":[{"text":"Students experience spread and protection first, so the term herd immunity names something they've seen","fb":"Yes. The guide's case for this sequence is that students feel exponential spread and herd immunity before they hear the terms."},{"text":"It saves time, because students will work out the immunology themselves","fb":"No. The teacher still explains pathogens, transmission and immunity in lessons 5 and 6. The simulation gives that explanation something to attach to."},{"text":"Simulations are more engaging than explanations","fb":"Engagement matters, but it isn't why the simulation sits here. A fun simulation placed after the explanation would only confirm it."},{"text":"Students need practice with indicators before the chemistry unit","fb":"The indicator is just a way to make infection visible. This sequence isn't about indicators."}],"answer":0,"variants":[]},{"id":"spot-data","at":"explore","processing":"Comprehension","kind":"Spot the phase","tests":"explore","vignette":{"who":"Year 9 · Lesson 4","text":"Groups analyse real data on measles cases against vaccination coverage, describe the pattern they see, and write a hypothesis to explain it. No one has introduced the immune system yet."},"q":"Which 5E phase is this?","hint":"Explore isn't only practical work. What matters is that students make sense of evidence before they're told.","why":"Explore can include real data sets. It moves the investigation beyond the lab and builds towards the Stage 5 data outcomes.","type":"spot","answer":"explore","fb":{"engage":"Students' first ideas were collected in lesson 1. This is new evidence.","explore":"Analysing real data is still Explore. Students generate their own patterns and hypotheses before the scientific explanation.","explain":"The explanation hasn't arrived. Students are writing hypotheses, not receiving the account.","elaborate":"Elaborate transfers a concept students already have. The immune system hasn't been taught yet.","evaluate":"Hypotheses are reviewed, but the job here is investigating."},"variants":[]},{"id":"why-antibiotics","at":"explain","processing":"Comprehension","kind":"Why here?","tests":"explain","vignette":{"who":"Year 9 · Lessons 5–6","text":"Introducing pathogen types, the teacher explicitly raises the idea that antibiotics cure viral infections, and asks groups to test it against what they now know about bacteria and viruses."},"q":"Why name this idea in Explain rather than just teaching pathogen types?","why":"Explain is where the scientific view meets students' ideas directly. If you plan Explain as content delivery only, misconceptions stay hidden and persist.","type":"choice","options":[{"text":"A target conception that is never named tends to survive alongside the new learning","fb":"Yes. Students can learn the correct account and keep the old idea for everyday use. Naming it gives them the chance to reject it."},{"text":"It fills time while groups finish presenting","fb":"It's there on purpose. The guide lists it as one of the sequence's target conceptions."},{"text":"Antibiotics are the main content outcome for the unit","fb":"The idea matters because it's a common misconception, not because antibiotics are the focus of the unit."},{"text":"It's an Engage activity placed in the wrong lesson","fb":"Engage elicits ideas. Here the teacher is confronting one with the scientific account, which is Explain's job."}],"answer":0,"variants":[]},{"id":"lf-links","at":"explain","processing":"Comprehension","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Year 9 · Lesson 5","text":"Introducing herd immunity, the teacher points to Group 3's transmission table and asks, “Your chain stopped at Mia's cup. Why?”"},"type":"lookfor","answer":"explain-links-data","distractors":["explore-own-data","engage-link","elaborate-demand"],"strong":true,"variants":[{"vignette":{"who":"Year 9 · Lesson 6","text":"Explaining transmission by contact, the teacher replays two rounds of the class's swap records on the board and asks students to find the moment the infection jumped between groups."}}]},{"id":"lf-annotate","at":"explain","processing":"Comprehension","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Year 9 · Lesson 7","text":"After a case study of John Snow's cholera map, students take out their lesson 1 camp answers and annotate them with the new concepts."},"why":"Revisiting Engage ideas belongs in Explain as well as in Evaluate. Students name what has changed while the new concepts are fresh.","type":"lookfor","answer":"explain-conceptions","distractors":["engage-question","explore-feeds-explain","elaborate-requires-concept"],"strong":true,"variants":[]},{"id":"why-elaborate","at":"elaborate","processing":"Analysis","kind":"Why here?","tests":"elaborate","vignette":{"who":"Year 9 · Lessons 8–10","text":"Students choose a disease relevant to a community and write an evidence-based public health recommendation, including a check of one online claim about the disease."},"q":"Why does this task come after Explain rather than before it?","refs":{"phaseIds":[],"lookForIds":["elaborate-new-context","elaborate-requires-concept"],"exampleIds":[],"sequenceIds":[],"misapplicationIds":[]},"type":"choice","options":[{"text":"The recommendation needs transmission and immunity concepts, applied to a new setting","fb":"Yes. The task demands the concept in a new context, which is what Elaborate is for. Before Explain, students wouldn't have the science to do it."},{"text":"Written tasks always go at the end of a unit","fb":"Placement depends on what the task demands, not its format."},{"text":"It's the summative assessment","fb":"Evaluate holds the summative task. This is a transfer task with its own formative checkpoints."},{"text":"Students need a break from data before the test","fb":"The task is demanding. It's there to extend the concept, not to rest."}],"answer":0,"variants":[]},{"id":"poster","at":"elaborate","processing":"Analysis","kind":"Fix the plan","tests":"elaborate","vignette":{"who":"A pre-service teacher's Elaborate","text":"Groups make a poster about a disease of their choice, with key facts, pictures and a slogan."},"q":"What is the main problem?","why":"A poster can be completed by copying facts. Ask whether a student who missed lessons 5 and 6 could still do the task well. If they could, it isn't Elaborate.","refs":{"phaseIds":[],"lookForIds":["elaborate-requires-concept"],"exampleIds":[],"sequenceIds":[],"misapplicationIds":[]},"type":"choice","options":[{"text":"Nothing in the task requires transmission or immunity concepts, so students can succeed without the science","fb":"Yes. This is the guide's watch-for for this sequence. The task must use the concepts and cite evidence."},{"text":"Posters take too long to make","fb":"Time matters, but the bigger problem is what the task asks students to think about."},{"text":"Students shouldn't choose their own disease","fb":"Choice is a strength here. The guide suggests it partly so students can avoid a disease that touches their own experience."},{"text":"Elaborate should be done individually","fb":"Group work is fine. The problem is the cognitive demand of the task."}],"answer":0,"variants":[]},{"id":"why-revisit","at":"evaluate","processing":"Comprehension","kind":"Select all that apply","tests":"evaluate","title":"Lesson 11 brings back the camp scenario from lesson 1. Why?","q":"Select every reason that holds.","refs":{"phaseIds":[],"lookForIds":["evaluate-revisit"],"exampleIds":[],"sequenceIds":[],"misapplicationIds":[]},"type":"multi","options":[{"text":"Students can see how far their own reasoning has moved","ok":true,"fb":"Yes. The guide's case for this sequence says exactly this."},{"text":"It assesses understanding against the student's own starting point","ok":true,"fb":"Yes. That comparison is what makes Evaluate constructivist."},{"text":"It saves writing a new assessment task","ok":false,"fb":"No. Lesson 11 also includes a new outbreak scenario, so students must transfer the concepts as well."},{"text":"Students should give the same answer they gave in lesson 1","ok":false,"fb":"No. The point is that their answers change, with scientific reasoning behind them."}]},{"id":"order","at":"evaluate","processing":"Comprehension","kind":"Sequence it","tests":"sequence","title":"Put the outbreak sequence in 5E order.","q":"Tap each activity in the order you'd teach it. Tap a placed activity to remove it.","type":"order","steps":[{"text":"Students explain a camp outbreak in their own words, and answers are kept","phaseId":"engage"},{"text":"Cup simulation with indicator, tracing patient zero","phaseId":"explore"},{"text":"Pathogen types and herd immunity, linked to the simulation and the data","phaseId":"explain"},{"text":"An evidence-based public health recommendation for a chosen community","phaseId":"elaborate"},{"text":"Rewrite the camp answer with scientific reasoning, then explain a new outbreak","phaseId":"evaluate"}],"variants":[]},{"id":"reflect","at":"evaluate","processing":"Metacognition","kind":"Look back","title":"Every phase earns its place.","q":"Pick one phase of the outbreak sequence and say in one or two sentences why it sits where it does.","type":"reflect","model":"Example: “The simulation comes before herd immunity is named, so the term has something students have seen to attach to.”","recall":"predict"}]},{"id":"5e-4-labels","path":"5e","track":null,"order":4,"title":"Labels without logic","summary":"Diagnose re-badged and broken 5E plans using the guide's misapplications, then repair one.","level":"explain","version":"1.0.0","status":"published","guideSection":"misapplications","requires":[],"items":[{"id":"predict","at":"engage","processing":"Retrieval","kind":"Predict","title":"A teacher adds an E heading to each of her existing Year 8 lessons and changes nothing else.","q":"Will her students learn any differently?","why":"Every item in this lesson is a plan someone could plausibly submit. Learning the guide's names for what goes wrong gives you a vocabulary for checking your own plans.","type":"predict","options":[{"text":"Yes, the structure alone helps them"},{"text":"Barely. The order of experience and explanation hasn't changed."},{"text":"They'll learn less, because the headings confuse them"},{"text":"Only if she adds a better hook"}],"answer":1,"reveal":"Barely. The guide calls this labels without logic: explanation still comes before experience, so there's no mechanism for conceptual change. A model is a sequence of jobs, not a set of headings."},{"id":"dx-confirmation","at":"explore","processing":"Analysis","kind":"Diagnose the plan","tests":"misapplication","plan":[{"phaseId":"engage","text":"The camp outbreak scenario, answers kept"},{"phaseId":"explain","text":"Two lessons on pathogens and the immune system"},{"phaseId":"explore","text":"Cup simulation “to see herd immunity in action”"},{"phaseId":"elaborate","text":"Public health recommendation"},{"phaseId":"evaluate","text":"Revisit the camp scenario"}],"type":"diagnose","answer":"mis-confirmation","distractors":["mis-monologue","mis-no-elaborate","mis-entertainment"],"variants":[{"plan":[{"phaseId":"engage","text":"Predict where a tree's mass comes from"},{"phaseId":"explain","text":"Notes on photosynthesis and the word equation"},{"phaseId":"explore","text":"Leaf-disc prac to prove the equation"},{"phaseId":"elaborate","text":"Greenhouse lighting advice"},{"phaseId":"evaluate","text":"Revisit the prediction"}]}]},{"id":"dx-entertainment","at":"explore","processing":"Analysis","kind":"Diagnose the plan","tests":"misapplication","vignette":{"who":"Year 8 · Engage","text":"The unit on food webs opens with a dramatic clip of a cheetah chasing a gazelle. Students then copy the definition of a food chain from the board."},"hint":"Was anyone's thinking recorded?","type":"diagnose","answer":"mis-entertainment","distractors":["mis-confirmation","mis-no-elaborate","mis-monologue"],"variants":[]},{"id":"dx-monologue","at":"explain","processing":"Analysis","kind":"Diagnose the plan","tests":"misapplication","vignette":{"who":"Year 9 · Explain","text":"After the outbreak simulation, the next three lessons are slides on the immune system. Students copy notes. The simulation results aren't mentioned again."},"type":"diagnose","answer":"mis-monologue","distractors":["mis-labels","mis-end-only","mis-one-lesson"],"variants":[]},{"id":"dx-one-lesson","at":"explain","processing":"Analysis","kind":"Diagnose the plan","tests":"misapplication","vignette":{"who":"Year 7 · Every lesson","text":"Every lesson of a cells unit runs all five phases: a ten-minute hook, ten minutes at the microscope, ten minutes of notes, ten minutes of questions and a five-minute quiz."},"type":"diagnose","answer":"mis-one-lesson","distractors":["mis-labels","mis-end-only","mis-entertainment"],"variants":[]},{"id":"dx-no-elaborate","at":"elaborate","processing":"Analysis","kind":"Diagnose the plan","tests":"misapplication","plan":[{"phaseId":"engage","text":"Alive or not alive card sort, rules recorded"},{"phaseId":"explore","text":"Microscope rotation over three lessons"},{"phaseId":"explain","text":"Cell theory from the class's drawings, with exit tickets each lesson"},{"phaseId":"evaluate","text":"Topic test on cell structures"}],"hint":"Count the phases. Then look at the formative checks before you decide.","why":"Without Elaborate, understanding stays tied to the one context students met it in. The exit tickets show evaluation isn't only at the end, so that isn't the main problem here.","type":"diagnose","answer":"mis-no-elaborate","distractors":["mis-end-only","mis-confirmation","mis-monologue"],"variants":[]},{"id":"dx-end-only","at":"evaluate","processing":"Analysis","kind":"Diagnose the plan","tests":"misapplication","vignette":{"who":"Year 8 · Assessment","text":"All five phases run over eight weeks. Apart from marking books, the only check on learning is a 30-question test in week 8."},"type":"diagnose","answer":"mis-end-only","distractors":["mis-no-elaborate","mis-one-lesson","mis-labels"],"variants":[]},{"id":"dx-labels","at":"evaluate","processing":"Analysis","kind":"Diagnose the plan","tests":"misapplication","plan":[{"phaseId":"engage","text":"Notes on the parts of a cell"},{"phaseId":"explore","text":"Textbook questions on cell parts"},{"phaseId":"explain","text":"Worksheet labelling a plant cell"},{"phaseId":"elaborate","text":"Microscope prac to find the parts"},{"phaseId":"evaluate","text":"Topic test"}],"hint":"Ignore the headings. What actually happens, in what order?","type":"diagnose","answer":"mis-labels","distractors":["mis-one-lesson","mis-entertainment","mis-no-elaborate"],"variants":[]},{"id":"repair","at":"evaluate","processing":"Knowledge utilisation","kind":"Repair it","tests":"misapplication","title":"Which single change does most to repair that re-badged cells unit?","refs":{"phaseIds":[],"lookForIds":["explore-before-explain"],"exampleIds":[],"sequenceIds":[],"misapplicationIds":["mis-labels"]},"type":"choice","options":[{"text":"Rebuild it around one big question, and move the microscope work before the notes","fb":"Yes. This is the guide's fix for labels without logic. Practical work before explanation is what gives the model its mechanism."},{"text":"Replace the notes with a more engaging video","fb":"A better hook doesn't change the order. Explanation would still come before experience."},{"text":"Add a quiz at the end of each lesson","fb":"Formative checks help, but they don't fix the order."},{"text":"Rename the phases to match what each lesson really does","fb":"Honest labels are a start, but the unit would still teach before students investigate."}],"answer":0,"variants":[]},{"id":"reflect","at":"evaluate","processing":"Metacognition","kind":"Look back","title":"Check your own plan.","q":"Think of a sequence you've planned or seen. Which misapplication is it most at risk of, and what's one change that would prevent it?","type":"reflect","model":"Example: “Mine risks Explore as confirmation: I teach the concept first. I'd run the investigation first and hold back the answer.”","recall":"predict"}]},{"id":"5e-5-build","path":"5e","track":null,"order":5,"title":"Build it","summary":"Build a Stage 4 plant-growth sequence from activity cards, then read what the guide's look-fors say about it.","level":"design","version":"1.0.0","status":"published","guideSection":"checklist","requires":[],"items":[{"id":"question","at":"engage","processing":"Analysis","kind":"Set the question","tests":"engage","title":"Your unit: Year 8, plant growth. Many students think plants get their food from the soil.","q":"Which driving question gives the sequence the most to work with?","refs":{"phaseIds":[],"lookForIds":["engage-question"],"exampleIds":[],"sequenceIds":[],"misapplicationIds":[]},"type":"choice","options":[{"text":"Where does a plant's mass come from?","fb":"Yes. It's answerable with evidence students can collect, it leads straight to photosynthesis, and it puts the soil idea on the table from day one."},{"text":"What is photosynthesis?","fb":"This asks for a definition. It names the answer before students have met the problem."},{"text":"Why are plants important?","fb":"A worthwhile question, but too broad to drive an investigation, and it doesn't surface the soil idea."},{"text":"What are the parts of a plant?","fb":"This invites labelling, not explanation. Students can answer it without changing what they think."}],"answer":0,"variants":[]},{"id":"rubric","at":"engage","processing":"Retrieval","kind":"Before you build","title":"What the report will look for","type":"concept","lead":"The board checks your plan against the 5E guide's look-fors and misapplications. A card only counts in the phase whose job it does, and some cards look useful but bring a known problem with them.","rows":[{"phaseId":"engage","does":"Ideas drawn out and recorded, around one driving question.","move":"Watch for: entertainment with no elicitation."},{"phaseId":"explore","does":"Students' own data, before any explanation.","move":"Watch for: a practical that only confirms the notes."},{"phaseId":"explain","does":"The science built from the class's data, returning to the Engage ideas.","move":"Watch for: lessons of slides with no student talk."},{"phaseId":"elaborate","does":"A new context that can't be done without the concept.","move":"Watch for: leaving it out altogether."},{"phaseId":"evaluate","does":"Students compare where they started with where they are now.","move":"Watch for: checking only at the end."}]},{"id":"board","at":"explore","processing":"Knowledge utilisation","kind":"Build the plan","tests":"design","title":"Build your 5E sequence.","q":"Place one or more activities in each phase, and spread check-for-understanding cards through the sequence. Not every card belongs in a strong plan.","hint":"Read each card for what it actually does, not the phase it sounds like.","why":"A plan can carry every heading and still miss the model. The look-fors are a checklist you can run on any plan you write or are given, including on placement.","type":"build","brief":{"who":"Year 8 · Living systems · about 10 lessons","text":"Driving question: where does a plant's mass come from?"},"cards":[{"id":"wall","text":"Students predict where a plant's mass comes from and post their ideas on a class thinking wall","kind":"activity","does":"engage","features":["engage-elicit","engage-question"],"flaws":[]},{"id":"timelapse","text":"A time-lapse video of a rainforest, then students copy the definition of photosynthesis","kind":"activity","does":"engage","features":[],"flaws":["mis-entertainment"]},{"id":"cress","text":"Groups grow cress in sealed bags, with and without light and soil, and weigh plants and bags over a week","kind":"activity","does":"explore","features":["explore-own-data","explore-before-explain"],"flaws":[]},{"id":"confirm","text":"Notes on photosynthesis, then a leaf-disc prac to prove the word equation","kind":"activity","does":"explore","features":[],"flaws":["mis-confirmation"]},{"id":"from-data","text":"Groups present their mass data, and the teacher builds the word equation from the class's results and returns to the thinking wall","kind":"activity","does":"explain","features":["explain-links-data","explain-conceptions"],"flaws":[]},{"id":"slides","text":"Three lessons of slides on photosynthesis and respiration, with notes to copy","kind":"activity","does":"explain","features":[],"flaws":["mis-monologue"]},{"id":"garden","text":"Students advise a community garden on why seedlings raised in a dark shed failed, using photosynthesis","kind":"activity","does":"elaborate","features":["elaborate-new-context","elaborate-requires-concept"],"flaws":[]},{"id":"textbook","text":"Textbook questions that repeat the definitions from Explain","kind":"activity","does":"elaborate","features":[],"flaws":[]},{"id":"revisit","text":"Students rewrite their thinking-wall idea as “I used to think… now I think… because…”, then explain an unfamiliar plant's growth","kind":"activity","does":"evaluate","features":["evaluate-revisit"],"flaws":[]},{"id":"recall-test","text":"A 30-question recall test in the last lesson","kind":"activity","does":"evaluate","features":[],"flaws":[]},{"id":"exit-cress","text":"Exit ticket: what does the cress data show so far?","kind":"check","features":[],"flaws":[]},{"id":"whiteboards","text":"Mini-whiteboards: draw where the plant's mass came from","kind":"check","features":[],"flaws":[]},{"id":"confidence","text":"Hinge question: which of four statements about plant food is right, and why?","kind":"check","features":[],"flaws":[]}],"report":["engage-elicit","engage-question","explore-own-data","explore-before-explain","explain-links-data","explain-conceptions","elaborate-new-context","elaborate-requires-concept","evaluate-revisit","evaluate-formative"],"missing":{"explain":"mis-no-explain","elaborate":"mis-no-elaborate"},"formative":{"lookFor":"evaluate-formative","flag":"mis-end-only","minPhases":3}},{"id":"why-report","at":"elaborate","processing":"Comprehension","kind":"Select all that apply","tests":"design","title":"Why might the recall test and the textbook questions leave look-fors missing, even though they sit in the right phases?","q":"Select every reason that holds.","refs":{"phaseIds":[],"lookForIds":["evaluate-revisit","elaborate-new-context"],"exampleIds":[],"sequenceIds":[],"misapplicationIds":[]},"type":"multi","options":[{"text":"The recall test doesn't ask students to compare their thinking with where they started","ok":true,"fb":"Yes. Evaluate's look-fors are about revisiting initial ideas and applying understanding, not recall."},{"text":"The textbook questions can be answered without using the concept in a new setting","ok":true,"fb":"Yes. Elaborate needs a new context that demands the concept."},{"text":"Tests and textbook questions are never useful","ok":false,"fb":"They have their place. The issue is that these two don't do the job the phase is for."},{"text":"The report only counts cards in Engage and Explore","ok":false,"fb":"Every phase is checked. These cards are in the right phases but don't meet those phases' look-fors."}]},{"id":"reflect","at":"evaluate","processing":"Metacognition","kind":"Look back","title":"Your report, your plan.","q":"Which look-for in your report was hardest to meet, and what would you change in a plan of your own because of it?","type":"reflect","model":"Example: “Formative checks across three phases. I usually only plan an end-of-unit test, so I'd add an exit ticket in Explore and a hinge question in Explain.”"}]},{"id":"5e-6-prac-day","path":"5e","track":null,"order":6,"title":"Prac Day","summary":"Teach the cells unit to a simulated Year 7 class. Every move you make changes what the class thinks next.","level":"design","version":"1.0.0","status":"published","guideSection":"sequences","requires":[],"items":[{"id":"briefing","at":"engage","processing":"Retrieval","kind":"How Prac Day works","title":"Ten lessons, four decisions","type":"concept","lead":"You're on placement with a Year 7 class, teaching the cells sequence from the 5E guide. At four moments you choose what to do next. Students voice the ideas the guide says to expect. Your choices decide which ideas surface, which stay hidden and which get challenged, and the class-thinking panel tracks them.","rows":[{"phaseId":"engage","does":"Lesson 1: the alive or not alive card sort.","move":"Listen for the rules groups use."},{"phaseId":"explore","does":"Lessons 2–4: the microscope rotation.","move":"Ask questions that reveal thinking."},{"phaseId":"explain","does":"Lesson 5: cell theory from the class's drawings.","move":"Build from what students saw."},{"phaseId":"evaluate","does":"Lesson 10: back to the sort.","move":"Make the change in thinking visible."}]},{"id":"sim","at":"engage","processing":"Knowledge utilisation","kind":"Prac Day","tests":"sim","type":"sim","cast":{"who":"Year 7 · Cells and classification","text":"26 students, mixed abilities. Most have never used a microscope."},"sequenceId":"seq-s4-cells","start":"sort","nodes":[{"id":"sort","phase":"engage","when":"Lesson 1 · the card sort","situation":"Groups are sorting a candle flame, a seed, yeast, a lichen-covered rock, a crystal, a mushroom and a virus image into alive and not alive. Group 3 has put the mushroom in “not alive”.","said":{"who":"Ari, Group 3","text":"“Mushrooms aren't alive. They don't move.”","conception":2},"choices":[{"text":"Ask Group 3 to write the rule they used on the thinking wall, and keep moving between groups","next":"microscope","good":true,"lookFor":"engage-elicit","debrief":"The rule “alive things move” is now on the wall, where the whole unit can test it. Engage collects ideas; it doesn't correct them.","surface":[2],"hide":[],"challenge":[]},{"text":"Explain that fungi are alive, and move the mushroom to the right column","next":"quiet","good":false,"lookFor":"engage-elicit","debrief":"The answer is right, but the idea behind it never reached the wall. Group 3 learned that their thinking gets corrected, not used.","surface":[],"hide":[2],"challenge":[]}]},{"id":"microscope","phase":"explore","when":"Lesson 3 · Elodea station","situation":"Students are drawing an Elodea leaf at two magnifications. Mia has drawn the green dots carefully and nothing else.","said":{"who":"Mia","text":"“The green dots are the cells. The rest is just leaf.”","conception":0},"choices":[{"text":"Ask, “Is the whole leaf made of those boxes, or are they on it? How could you check?”","next":"explain-data","good":true,"lookFor":"explore-before-explain","debrief":"Mia now has to look again and decide for herself. Her idea that plants aren't really made of cells is out in the open, ready for Explain.","surface":[0],"hide":[],"challenge":[]},{"text":"Show her the labelled plant-cell diagram so she knows what to look for","next":"explain-diagram","good":false,"lookFor":"explore-before-explain","debrief":"Her drawing will improve, but she's now copying the diagram, not observing. The diagram also plants the flat-cell picture the sequence wanted to challenge.","surface":[],"hide":[0,1],"challenge":[]}]},{"id":"quiet","phase":"explore","when":"Lesson 3 · Elodea station","situation":"Since lesson 1, Group 3 has stopped volunteering ideas. At the Elodea station, Mia copies her partner's drawing and says nothing.","choices":[{"text":"Ask Mia what she thinks the green dots are, and why","next":"explain-data","good":true,"lookFor":"explore-before-explain","debrief":"A direct, curious question brings her thinking back. She says the green dots are the cells and the rest is just leaf, which is exactly the idea Explain needs.","surface":[0],"hide":[],"challenge":[]},{"text":"Move on. She'll pick it up from the notes in lesson 5.","next":"explain-diagram","good":false,"lookFor":"explore-before-explain","debrief":"Her idea stays hidden, so Explain can't challenge it. Students like Mia often leave a unit with the right words and the old idea underneath.","surface":[],"hide":[0],"challenge":[]}]},{"id":"explain-data","phase":"explain","when":"Lesson 5 · cell theory","situation":"Groups have shared their drawings. You're about to introduce cell theory and the cell wall.","choices":[{"text":"Put Mia's Elodea drawing beside a cheek-cell drawing, and ask what the plant cells have that the cheek cells don't","next":"revisit","good":true,"lookFor":"explain-links-data","debrief":"The cell wall now names something students drew themselves. Mia sees boxes across the whole leaf in her own drawing, which challenges her idea more than any diagram could.","surface":[],"hide":[],"challenge":[0]},{"text":"Present the textbook diagrams of plant and animal cells, and have students label them","next":"revisit-hidden","good":false,"lookFor":"explain-links-data","debrief":"Students can label the parts, but the explanation has come loose from what they saw. The flat textbook cell becomes the picture they remember.","surface":[],"hide":[1],"challenge":[]}]},{"id":"explain-diagram","phase":"explain","when":"Lesson 5 · cell theory","situation":"Many drawings show tidy organelles copied from the diagram. Few match what was actually under the microscope.","choices":[{"text":"Ask groups which parts they actually saw, and which they drew because of the diagram","next":"revisit","good":true,"lookFor":"explain-students-first","debrief":"Separating what they saw from what they were shown gets students explaining first. The flat-cell idea surfaces, and so does the question of whether the whole leaf is cells.","surface":[1],"hide":[],"challenge":[0]},{"text":"Move on to organelle functions while the diagram is fresh","next":"revisit-hidden","good":false,"lookFor":"explain-students-first","debrief":"The class moves on with tidy notes and untested ideas. Nothing they think has been challenged yet.","surface":[],"hide":[],"challenge":[]}]},{"id":"revisit","phase":"evaluate","when":"Lesson 10 · back to the sort","situation":"The thinking wall still has the lesson 1 rules on it, including “alive things move”.","choices":[{"text":"Have groups re-sort the cards with evidence from the unit, rewrite their rule, and then classify an unfamiliar organism","next":"end","good":true,"lookFor":"evaluate-revisit","debrief":"Students can see how far their own thinking has moved. Rewriting “alive things move” with cell evidence is the change you were teaching for.","surface":[],"hide":[],"challenge":[2]},{"text":"Give a recall quiz on organelles and their functions","next":"end","good":false,"lookFor":"evaluate-revisit","debrief":"The quiz shows what students can recall, not how their thinking changed. The lesson 1 rules are still on the wall, untouched.","surface":[],"hide":[],"challenge":[]}]},{"id":"revisit-hidden","phase":"evaluate","when":"Lesson 10 · back to the sort","situation":"Several students still say plants aren't really made of cells, and the wall still says “alive things move”.","choices":[{"text":"Have groups re-sort the cards with evidence, rewrite their rules, and look again at an Elodea leaf","next":"end","good":true,"lookFor":"evaluate-revisit","debrief":"Going back to the sort and the microscope rescues a lot. The ideas finally get tested, though later than they should have been.","surface":[0],"hide":[],"challenge":[2]},{"text":"Give a recall quiz on organelles and their functions","next":"end","good":false,"lookFor":"evaluate-revisit","debrief":"The quiz scores look fine, but the ideas from lesson 1 have never been tested. They'll be back in Year 9.","surface":[],"hide":[],"challenge":[]}]}],"endings":[{"minGood":4,"title":"Thinking changed, and you can see it","text":"Every key idea surfaced, met evidence and changed. That's the 5E mechanism working as the guide describes: elicit, investigate before explaining, build from students' data, then make the change visible."},{"minGood":2,"title":"Some ideas moved, some never surfaced","text":"Parts of the sequence did their job. Look at the decisions where an idea was hidden or a diagram came first. Those are the moments to plan differently on your next placement."},{"minGood":0,"title":"Right words, old ideas","text":"Students can name the parts of a cell, but the ideas they started with were never tested. The guide's look-fors for Engage and Explore are the place to start."}],"conceptions":["Plants and fungi are not made of cells","Cells are flat, like textbook diagrams","Living things are things that move","Classification groups are fixed and obvious"]},{"id":"takeaway","at":"evaluate","processing":"Analysis","kind":"What made the difference?","tests":"sim","title":"In every run, one kind of move did the most damage.","q":"Which?","type":"choice","options":[{"text":"Supplying the answer or the diagram before students had committed to their own idea","fb":"Yes. Every weak path began with telling or showing too early. Each one hid an idea the sequence needed to challenge."},{"text":"Asking too many questions at the microscope","fb":"Questions were the moves that brought ideas out. Silence and telling hid them."},{"text":"Spending too long on the card sort","fb":"The sort is where ideas first surface. Cutting it short leaves less to work with."},{"text":"Using students' drawings in Explain","fb":"That was one of the strongest moves, because it tied the explanation to what students saw."}],"answer":0,"variants":[]},{"id":"reflect","at":"evaluate","processing":"Metacognition","kind":"Look back","title":"Your Prac Day.","q":"Which decision would be hardest for you on a real placement, and what will you say or do in that moment?","type":"reflect","model":"Example: “Not correcting Ari in lesson 1. I'll have a sentence ready: ‘Write that rule on the wall. We'll test it.’”"}]},{"id":"poe-1-yeast","path":"poe","track":null,"order":1,"title":"Is yeast alive?","summary":"Three flasks, three balloons. Learn what each POE phase has to do, and what it looks like when it works.","level":"recognise","version":"1.0.0","status":"published","guideSection":"sequences","requires":[],"items":[{"id":"predict","at":"predict","processing":"Retrieval","kind":"Predict","title":"Three flasks of warm water, each with a balloon stretched over the top: yeast and sugar; yeast only; sugar only.","q":"Which balloons will inflate over the next 20 minutes?","why":"You've just done the Predict phase. It works because you committed to an answer and a reason before seeing anything. Many Year 7 and 8 students predict “none”, because they think yeast is a non-living powder.","type":"predict","options":[{"text":"None of them. Yeast is just a powder."},{"text":"Only the yeast-and-sugar balloon"},{"text":"All three"},{"text":"The two flasks with yeast in them, equally"}],"answer":1,"reveal":"Only the yeast-and-sugar balloon inflates properly. Yeast is a living, single-celled fungus. Given sugar and warmth, it respires and releases carbon dioxide. The yeast-only and sugar-only flasks are the controls that let students pin the change on yeast using sugar."},{"id":"lf-commit","at":"predict","processing":"Comprehension","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Year 8 · Predict","text":"Before the flasks go into the water bath, every student writes, on their own sheet, which balloons will inflate. The teacher collects the sheets and pins a tally of predictions on the board."},"why":"Individual, written commitment matters because a show of hands lets students drift to the popular answer. A written prediction can't be quietly revised once the result is known.","type":"lookfor","answer":"poe-commit-written","distractors":["poe-observe-record","poe-reconcile","poe-followup"],"strong":true,"variants":[]},{"id":"lf-cued","at":"predict","processing":"Analysis","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Another Year 8 class · Predict","text":"The teacher opens with, “Most people think yeast is just a powder, so let's find out whether that's true,” then asks every student to write a prediction."},"hint":"Read the teacher's first sentence as a student would.","why":"The framing tells students the popular answer is wrong, so they predict what they think the teacher wants and their real ideas stay hidden.","type":"lookfor","answer":"poe-no-cueing","distractors":["poe-observe-visible","poe-revise","poe-discrepant"],"strong":false,"variants":[]},{"id":"spot-observe","at":"observe","processing":"Comprehension","kind":"Spot the phase","tests":"observe","vignette":{"who":"Year 8 · 20 minutes in","text":"The flasks stand in a warm water bath. Every five minutes, students measure each balloon with string and a ruler and note any foam, writing what they see in one column and what they think it means in another."},"q":"Which POE phase is this?","why":"Measuring over time means the result builds and can't be missed or dismissed. That matters most for the students whose prediction was wrong.","type":"spot","answer":"observe","fb":{"predict":"The predictions are already on the board. Students are now gathering evidence.","observe":"Students record what happens, over time and separately from their explanations. That's Observe doing its job.","explain":"No one is reconciling predictions yet. Keeping inferences in their own column holds the explaining back for now."},"variants":[{"vignette":{"who":"Year 8 · Observe","text":"A visualiser shows the three flasks on the screen. Students sketch the balloons at 0, 10 and 20 minutes before anyone talks about why."}}]},{"id":"concept","at":"observe","processing":"Retrieval","kind":"The model","title":"Predict–Observe–Explain","type":"concept","lead":"A POE makes students' ideas visible, then puts them up against evidence they can't explain away. It's usually one lesson, built around one event chosen because many students will predict it wrongly.","rows":[{"phaseId":"predict","does":"Every student commits, in writing, to a prediction and a reason.","move":"Teacher move: choose a surprising event and give nothing away."},{"phaseId":"observe","does":"Every student sees, records and checks what actually happens.","move":"Teacher move: make the result visible and repeatable."},{"phaseId":"explain","does":"Students reconcile prediction with observation and build a better explanation.","move":"Teacher move: students revise first, then you consolidate."}],"cite":"White, R. & Gunstone, R. (1992). Probing Understanding. Falmer Press."},{"id":"spot-explain","at":"explain","processing":"Comprehension","kind":"Spot the phase","tests":"explain","vignette":{"who":"Year 8 · After the water bath","text":"In pairs, students put their prediction sheet beside their observations and draft a new explanation. Only then does the teacher explain that yeast is a living, single-celled fungus that uses sugar and releases carbon dioxide."},"q":"Which POE phase is this?","refs":{"phaseIds":[],"lookForIds":[],"exampleIds":["poe-explain-pos-yeast"],"sequenceIds":[],"misapplicationIds":[]},"type":"spot","answer":"explain","fb":{"predict":"Predictions were made before the flasks went in. This is what happens after.","observe":"The observations are done. Students are now reconciling them with what they predicted.","explain":"Students revise their own explanations before the teacher consolidates. That order is the heart of Explain."},"variants":[]},{"id":"dx-quiz","at":"explain","processing":"Analysis","kind":"Diagnose the plan","tests":"misapplication","vignette":{"who":"Year 8 · Explain","text":"Once the balloon has inflated, the teacher asks who predicted correctly, praises them, gives the explanation and moves on to the next topic."},"refs":{"phaseIds":[],"lookForIds":[],"exampleIds":["poe-explain-neg-quiz"],"sequenceIds":[],"misapplicationIds":[]},"type":"diagnose","answer":"mis-poe-quiz","distractors":["mis-poe-cued","mis-poe-one-off","mis-poe-not-discrepant"],"variants":[]},{"id":"dx-no-surprise","at":"explain","processing":"Analysis","kind":"Diagnose the plan","tests":"misapplication","vignette":{"who":"A pre-service teacher's POE","text":"Students predict whether a balloon over a flask of yeast, sugar and warm water will inflate. Almost the whole class correctly predicts that it will."},"hint":"What did the three-flask version have that this one lacks?","why":"With one flask, the event isn't surprising enough to challenge anyone. The three-flask set-up and the “just a powder” idea are what create the conflict.","type":"diagnose","answer":"mis-poe-not-discrepant","distractors":["mis-poe-no-reasons","mis-poe-ambiguous","mis-poe-quiz"],"variants":[]},{"id":"lf-followup","at":"explain","processing":"Comprehension","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Year 8 · Next lesson","text":"The next lesson opens with the class's prediction tally and the exit tickets, and asks why so many people thought yeast was a powder. The unit on living things builds from there."},"type":"lookfor","answer":"poe-followup","distractors":["poe-discrepant","poe-observe-inference","poe-commit-written"],"strong":true,"variants":[]},{"id":"order","at":"explain","processing":"Comprehension","kind":"Sequence it","tests":"sequence","title":"Put the yeast POE in order.","q":"Tap each step in the order you'd teach it. Tap a placed step to remove it.","type":"order","steps":[{"text":"Each student writes which balloons will inflate, and why","phaseId":"predict"},{"text":"The class tallies predictions without discussing them","phaseId":"predict"},{"text":"Students measure the balloons every five minutes in the water bath","phaseId":"observe"},{"text":"Pairs compare predictions with observations and draft new explanations","phaseId":"explain"},{"text":"The teacher consolidates, and students complete “I predicted… I observed… Now I think…”","phaseId":"explain"}],"variants":[]},{"id":"reflect","at":"explain","processing":"Metacognition","kind":"Look back","title":"Your prediction, revisited.","q":"Complete it for yourself: “I predicted… I observed… Now I think…”. What would you change about how you'd run this POE?","type":"reflect","model":"Example: “I predicted none would inflate. I observed only the yeast and sugar did. Now I think the controls are what make it convincing, so I'd never cut them for time.”","recall":"predict"}]},{"id":"poe-2-hands","path":"poe","track":null,"order":2,"title":"Clean hands","summary":"Write prediction prompts that surface reasoning, handle a model's limits, and place a POE inside a 5E unit.","level":"explain","version":"1.0.0","status":"published","guideSection":"sequences","requires":[],"items":[{"id":"predict","at":"predict","processing":"Retrieval","kind":"Predict","title":"Students rub fluorescent lotion onto their hands as a model for germs, then try one of four ways to remove it.","q":"Under a UV torch, which hands will show the least lotion left?","why":"“A quick rinse is enough” is one of this sequence's target conceptions. A POE is built around an event the common idea gets wrong.","type":"predict","options":[{"text":"A 5-second rinse with water"},{"text":"A 20-second wash with soap"},{"text":"A rub with alcohol hand sanitiser"},{"text":"Wiping hands on a paper towel"}],"answer":1,"reveal":"The 20-second soap wash usually removes the most lotion, and the quick rinse reliably disappoints. The sanitiser result is the interesting one: lots of lotion remains, because sanitiser inactivates many microbes without removing them. The model can't show that, which is a lesson in itself."},{"id":"prompt","at":"predict","processing":"Analysis","kind":"Write the prompt","tests":"prediction","title":"Which prediction prompt does the Predict phase's job best?","refs":{"phaseIds":[],"lookForIds":["poe-commit-written","poe-reasons","poe-no-cueing"],"exampleIds":[],"sequenceIds":[],"misapplicationIds":[]},"type":"choice","options":[{"text":"“Which method will leave the least lotion on your hands? Write your answer and explain why you think so.”","fb":"This asks every student for an outcome and a reason, in writing, without signalling an answer. It meets the guide's look-fors for Predict."},{"text":"“Do you think soap will work best?”","fb":"This cues the answer the teacher expects. Students predict what they think you want."},{"text":"“Hands up if you think water is enough.”","fb":"A show of hands lets students follow the crowd, and it records no reasons."},{"text":"“Rank the four methods from best to worst.”","fb":"A ranking gives you outcomes but not the ideas behind them, so there's nothing to revise later."}],"answer":0,"variants":[]},{"id":"lf-reasons","at":"predict","processing":"Comprehension","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Year 9 · Predict","text":"Each student ticks the method they think will remove the most lotion. The sheet has no space for anything else."},"hint":"What will students have to revise if their prediction turns out wrong?","type":"lookfor","answer":"poe-reasons","distractors":["poe-observe-record","poe-consolidate","poe-followup"],"strong":false,"variants":[]},{"id":"spot-observe","at":"observe","processing":"Comprehension","kind":"Spot the phase","tests":"observe","vignette":{"who":"Year 9 · UV torches","text":"Each group tests one method, inspects their hands under a UV torch, photographs the result and rates the remaining coverage on a five-point scale."},"q":"Which POE phase is this?","type":"spot","answer":"observe","fb":{"predict":"The predictions were tallied before anyone washed. This is the test.","observe":"Groups produce their own visible, photographed evidence. That's Observe.","explain":"Nobody is comparing results with predictions yet."},"variants":[]},{"id":"lf-visible","at":"observe","processing":"Comprehension","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Year 9 · Observe","text":"Every group posts its UV photo on the shared screen, so the whole class can check each method's result side by side, and any group can re-run a method if someone doubts it."},"type":"lookfor","answer":"poe-observe-visible","distractors":["poe-commit-written","poe-revise","poe-followup"],"strong":true,"variants":[]},{"id":"dx-ambiguous","at":"observe","processing":"Analysis","kind":"Diagnose the plan","tests":"misapplication","vignette":{"who":"A pre-service teacher's POE","text":"One small UV torch is shone on the teacher's own hands at the front bench. The differences between methods are faint, and only the front row can see them."},"type":"diagnose","answer":"mis-poe-ambiguous","distractors":["mis-poe-cued","mis-poe-quiz","mis-poe-no-reasons"],"variants":[]},{"id":"limitation","at":"explain","processing":"Knowledge utilisation","kind":"Teacher move","tests":"explain","vignette":{"who":"During Explain","text":"A group says: “Sanitiser doesn't work. Look, the lotion's still there.”"},"q":"What is the best response?","why":"The guide's watch-for for this sequence is exactly this conclusion. Plan the Explain phase around the limitation instead of letting it slip past.","type":"choice","options":[{"text":"Ask what the lotion models, and whether sanitiser works by removing microbes or by inactivating them","fb":"Yes. This turns the model's limitation into the discussion the guide plans for. Sanitiser can inactivate many microbes without removing the lotion."},{"text":"Tell them sanitiser does work, and move on","fb":"This settles the answer but leaves students thinking the evidence lied. The model's limitation is the learning."},{"text":"Agree that soap is the only method that works","fb":"That's a new misconception. The lotion shows removal, not microbial kill."},{"text":"Re-run the sanitiser test until the lotion comes off","fb":"More sanitiser won't remove the lotion, because removal isn't how sanitiser works."}],"answer":0,"variants":[]},{"id":"lf-consolidate","at":"explain","processing":"Comprehension","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Year 9 · Explain","text":"After groups compare results with predictions, the teacher sets out the scientific account of removal and inactivation, and contrasts it explicitly with “a quick rinse is enough”."},"type":"lookfor","answer":"poe-consolidate","distractors":["poe-discrepant","poe-observe-record","poe-commit-written"],"strong":true,"variants":[]},{"id":"nest-5e","at":"explain","processing":"Analysis","kind":"Nest it","tests":"nesting","title":"This POE could open the 5E outbreak unit from the 5E path.","q":"Which 5E phase would it be?","why":"A POE is a single lesson. Inside a longer model it does one job well: surfacing and challenging the target conception before the investigation begins.","type":"nest","model":"poe","host":"5e","answer":"engage","how":"Use a POE as the Engage to surface and challenge the target conception."},{"id":"dx-cued","at":"explain","processing":"Analysis","kind":"Diagnose the plan","tests":"misapplication","vignette":{"who":"Another Year 9 class · Predict","text":"The teacher opens with, “Everyone knows a quick rinse doesn't really do much,” then asks students to predict which method works best."},"type":"diagnose","answer":"mis-poe-cued","distractors":["mis-poe-not-discrepant","mis-poe-one-off","mis-poe-ambiguous"],"variants":[]},{"id":"reflect","at":"explain","processing":"Metacognition","kind":"Look back","title":"Write your own prompt.","q":"Pick a phenomenon you might teach. Write a prediction prompt that asks for a reason and gives nothing away.","type":"reflect","model":"Example: “When the steel wool burns on the balance, will the reading go up, go down or stay the same? Write your answer and why.”","recall":"predict"}]},{"id":"adi-1-leaf-litter","path":"adi","track":null,"order":1,"title":"Under the leaf litter","summary":"Two schoolyard sites and a question with more than one defensible answer. Learn the eight stages of ADI and what each has to do.","level":"recognise","version":"1.0.1","status":"published","guideSection":"sequences","requires":[],"items":[{"id":"predict","at":"task-question","processing":"Retrieval","kind":"Predict","title":"A Year 10 class sets one pitfall trap at each of two sites overnight. The mown oval edge catches 118 animals of 3 kinds, 110 of them ants. The leaf litter under the gum trees catches 41 animals of 9 kinds.","q":"Which site has more invertebrate diversity?","why":"You've just been given the guiding question. “More animals seen means more diversity” is one of this sequence's target conceptions, and “one sample is enough” is the other. ADI lets students argue both out against their own data.","type":"predict","options":[{"text":"The oval edge, because it caught almost three times as many animals"},{"text":"The leaf litter, because it has more kinds, more evenly spread"},{"text":"They are about the same once you allow for the ants"},{"text":"Neither. Pitfall traps can't measure diversity"}],"answer":1,"reveal":"Diversity counts kinds and how evenly the animals spread across them, not the total caught. The oval's haul is mostly one kind of ant, so the leaf litter is the more diverse site. But one trap per site is thin evidence, and a group that says so has found the argument this investigation is built for."},{"id":"concept","at":"task-question","processing":"Retrieval","kind":"The model","title":"Argument-Driven Inquiry","type":"concept","lead":"ADI turns a practical into an argument other students can question, then makes everyone write, review and revise. It's a multi-lesson routine of about 6–8 lessons that sits inside a unit, in three groups of stages: investigate, argue, then write and review.","rows":[{"phaseId":"task-question","does":"Students meet a phenomenon, a guiding question and the criteria for a strong argument.","move":"Teacher move: pose an open question and run a tool talk."},{"phaseId":"design-data","does":"Groups design their own method and collect data.","move":"Teacher move: approve plans for safety and feasibility, not for the right answer."},{"phaseId":"tentative-argument","does":"Groups analyse their data into a claim, evidence and a justification on a whiteboard.","move":"Teacher move: ask why the evidence counts."},{"phaseId":"argumentation","does":"Every argument is critiqued by other students, and groups revise.","move":"Teacher move: model critique language and hold the science back."},{"phaseId":"reflective-discussion","does":"The class consolidates the science and names how the question was settled.","move":"Teacher move: correct what the session surfaced."},{"phaseId":"report","does":"Each student writes their own argument for a peer reader.","move":"Teacher move: give the structure and model a justification."},{"phaseId":"peer-review","does":"Students review an anonymous report against the criteria.","move":"Teacher move: sample reviews and return weak ones."},{"phaseId":"revision","does":"Authors revise, respond to each review point and submit.","move":"Teacher move: mark against the criteria used all along."}],"cite":"Sampson, V., Grooms, J. & Walker, J. P. (2011). Argument-Driven Inquiry as a way to help students learn how to participate in scientific argumentation and craft written arguments. Science Education, 95(2)."},{"id":"lf-criteria","at":"task-question","processing":"Comprehension","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Year 10 · Lesson 1","text":"Before anyone plans, the teacher puts three criteria on the wall: a claim that answers the question, evidence from analysed data, and a justification that says why the evidence counts. The class discusses what each one would look like for the two sites."},"why":"Students know what quality means before they start, and the same three criteria will run all the way to the final report.","type":"lookfor","answer":"adi-criteria-shared","distractors":["adi-question-open","adi-tool-talk","adi-three-part"],"strong":true,"variants":[]},{"id":"spot-plan","at":"design-data","processing":"Comprehension","kind":"Spot the stage","tests":"design-data","vignette":{"who":"Year 10 · Lesson 2","text":"The teacher sits with each group for three minutes. One group plans four traps per site; another plans quadrat searches at three times of day. The teacher asks how they'll handle the animals safely and how many samples they'll need, but changes neither design."},"q":"Which ADI stage is this?","why":"Different groups' methods differ in defensible ways. That is what gives the argumentation session something to critique later.","type":"spot","answer":"design-data","among":["task-question","design-data","tentative-argument","argumentation"],"fb":{"task-question":"The question and criteria were set in lesson 1. Groups are now deciding how to answer it.","design-data":"A plan conference that checks safety and feasibility but leaves the design with the group. That's the design stage.","tentative-argument":"No one has data yet, so there is nothing to argue from.","argumentation":"The teacher is asking questions, but about a plan, not about another group's argument."},"variants":[]},{"id":"lf-reliability","at":"design-data","processing":"Analysis","kind":"Match the look-for","tests":"lookfor","vignette":{"who":"Another Year 10 group · Plan","text":"Their plan says “one quadrat at each site, count everything we find, compare the totals.”"},"hint":"The plan is the group's own. What hasn't the group thought about?","why":"One sample per site and a total count: both target conceptions in one plan. The guide's scaffold prompt asks what you would say to this group without telling them the answer.","type":"lookfor","answer":"adi-reliability","distractors":["adi-student-designed","adi-tool-talk","adi-plan-checkpoint"],"strong":false,"variants":[]},{"id":"spot-board","at":"tentative-argument","processing":"Comprehension","kind":"Spot the stage","tests":"tentative-argument","vignette":{"who":"Year 10 · Lesson 4","text":"Groups turn their tallies into a bar chart of kinds per site, then fill a whiteboard: claim at the top, the chart in the middle, and a justification underneath explaining why kinds, not totals, measure diversity."},"q":"Which ADI stage is this?","refs":{"phaseIds":[],"lookForIds":["adi-three-part","adi-analysis"],"exampleIds":[],"sequenceIds":[],"misapplicationIds":[]},"type":"spot","answer":"tentative-argument","among":["design-data","tentative-argument","argumentation","reflective-discussion"],"fb":{"design-data":"The data are in. Groups are now turning them into an argument.","tentative-argument":"Claim, evidence and justification on a whiteboard, drafted to be questioned. That's the tentative argument.","argumentation":"No one else has seen the boards yet. Critique comes next.","reflective-discussion":"The teacher hasn't consolidated anything. These are the groups' own arguments."},"variants":[]},{"id":"spot-round","at":"argumentation","processing":"Comprehension","kind":"Spot the stage","tests":"argumentation","vignette":{"who":"Year 10 · Lesson 5","text":"One student stays with each whiteboard while the rest move around. A visitor asks, “How do you know one trap was enough?” The presenter writes the question in a log, and later the group changes its claim."},"q":"Which ADI stage is this?","refs":{"phaseIds":[],"lookForIds":["adi-critique-quality","adi-revision-record"],"exampleIds":["adi-argue-pos-roundrobin"],"sequenceIds":[],"misapplicationIds":[]},"type":"spot","answer":"argumentation","among":["tentative-argument","argumentation","reflective-discussion","peer-review"],"fb":{"tentative-argument":"The whiteboards are already drafted. Now other students are testing them.","argumentation":"Students critique each other's evidence, log the questions and revise. That's the argumentation session.","reflective-discussion":"The teacher hasn't stepped in to consolidate. The critique is still running on evidence.","peer-review":"Peer review is of written reports, later and anonymous. This is face to face, on the whiteboards."},"variants":[]},{"id":"dx-closed","at":"argumentation","processing":"Analysis","kind":"Diagnose the plan","tests":"misapplication","vignette":{"who":"A pre-service teacher's ADI","text":"The guiding question is “Do invertebrates live in leaf litter?” Every group finds beetles and slaters in the first ten minutes, and the argumentation session is over in five."},"hint":"Could two careful groups disagree about the answer?","why":"With one obvious answer there is nothing to argue about, so the stages that make ADI worth the time have nothing to work on.","type":"diagnose","answer":"mis-adi-closed-question","distractors":["mis-adi-given-method","mis-adi-no-justification","mis-adi-teacher-judges"],"variants":[]},{"id":"dx-method","at":"argumentation","processing":"Analysis","kind":"Diagnose the plan","tests":"misapplication","vignette":{"who":"Another pre-service teacher's ADI","text":"The question is open, but every group receives the same method sheet: two quadrats per site, ten minutes each, count every animal. In the argumentation session, nobody can question anyone's design."},"refs":{"phaseIds":[],"lookForIds":[],"exampleIds":["adi-inv-neg-worksheet"],"sequenceIds":[],"misapplicationIds":[]},"type":"diagnose","answer":"mis-adi-given-method","distractors":["mis-adi-closed-question","mis-adi-skip-review","mis-adi-group-report"],"variants":[]},{"id":"order","at":"revision","processing":"Comprehension","kind":"Sequence it","tests":"sequence","title":"The question is set and the tool talk is done. Put the rest of the routine in order.","q":"Tap each step in the order you'd teach it. Tap a placed step to remove it.","type":"order","steps":[{"text":"Groups plan their sampling and talk it through with the teacher","phaseId":"design-data"},{"text":"Groups build a whiteboard with a claim, evidence and a justification","phaseId":"tentative-argument"},{"text":"Round robin, with visitors questioning each whiteboard","phaseId":"argumentation"},{"text":"The class consolidates kinds versus totals and names what made arguments strong","phaseId":"reflective-discussion"},{"text":"Each student writes their own report within a word limit","phaseId":"report"},{"text":"Another group reviews each anonymous report against the criteria","phaseId":"peer-review"},{"text":"Authors respond to each review point and submit with the review attached","phaseId":"revision"}],"variants":[]},{"id":"reflect","at":"revision","processing":"Metacognition","kind":"Look back","title":"Which stage would you cut?","q":"If you lost a lesson from this routine, which stage would you cut first, and what would that cost your students?","type":"reflect","model":"Example: “I'd shorten data collection, not cut a stage. Cutting the argumentation session or the review would leave a practical with a report, and those are the stages where ‘one trap is enough’ gets challenged.”","recall":"predict"}]},{"id":"adi-2-noise","path":"adi","track":null,"order":2,"title":"Keep the noise out","summary":"Claim, evidence and justification, critique that targets evidence, and why the teacher holds the science back until the argument has run.","level":"explain","version":"1.0.0","status":"published","guideSection":"sequences","requires":[],"items":[{"id":"predict","at":"task-question","processing":"Retrieval","kind":"Predict","title":"A speaker plays a steady tone inside a box. Groups change the box's lining and read the sound level outside it with a phone meter.","q":"Which lining will cut the sound reaching the meter the most?","why":"The guiding question ends “and does the answer depend on the sound?” That half is what gives groups that tested different tones something real to argue about. All three of this sequence's target conceptions sit in these options.","type":"predict","options":[{"text":"Foam, because soft materials always block sound best"},{"text":"Timber, because sound can't travel through solids"},{"text":"It depends on the tone the speaker plays"},{"text":"None of them makes a noticeable difference"}],"answer":2,"reveal":"Classes usually find that the answer changes with the tone. Soft, porous linings like foam often do best on a high tone, while a denser lining can match or beat them on a low one. Sound does travel through solids; that's why some always gets out."},{"id":"board","at":"tentative-argument","processing":"Analysis","kind":"Judge the argument","tests":"tentative-argument","title":"Four groups' whiteboards. Which one has a real justification?","refs":{"phaseIds":[],"lookForIds":["adi-three-part","adi-analysis","adi-justification"],"exampleIds":[],"sequenceIds":[],"misapplicationIds":[]},"type":"choice","options":[{"text":"Claim: foam works best. Evidence: our table of 24 readings.","fb":"A claim and raw data, with nothing saying why the data support the claim. That's the gap the argumentation session will fall into."},{"text":"Claim: foam works best. Evidence: a bar chart of reduction for each lining. Justification: foam is the softest material.","fb":"The evidence has been analysed, but “it's softest” restates the target conception instead of explaining the result with science."},{"text":"Claim: foam cut the high tone most, but timber did as well on the low tone. Evidence: a chart of reduction for each lining at both tones. Justification: the high tone lost energy in the foam's air pockets, while the low tone passed through the foam more easily and the denser timber reflected more of it.","fb":"Yes. The claim is limited to what the data show, the evidence is analysed, and the justification uses wave ideas to say why the evidence counts."},{"text":"Claim: foam works best. Evidence: it sounded quietest to us.","fb":"An impression, not data. The group collected readings but didn't use them."}],"answer":2,"variants":[]},{"id":"dx-no-just","at":"tentative-argument","processing":"Analysis","kind":"Diagnose the plan","tests":"misapplication","vignette":{"who":"A pre-service teacher's ADI · Lesson 4","text":"The teacher's whiteboard template has two boxes: “Our claim”
